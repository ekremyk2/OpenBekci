# oapi-codegen v2.8.2 (pinned as a go.mod tool). Run from server/ via `task gen`:
#   go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml
package: gen
output: internal/httpapi/gen/api.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  nullable-type: true
  # The agent transport (/v1/agent/*) is served by hand-written handlers: the
  # WebSocket upgrade cannot go through the strict server and agentAuth is not
  # a user session. The operations stay in the spec for documentation.
  exclude-tags:
    - agent
compatibility:
  always-prefix-enum-values: true
