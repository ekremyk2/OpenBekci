openapi: 3.0.3
info:
  title: OpenBekci API
  version: 0.1.0
  description: |
    HTTP API of an OpenBekci instance (residential site management).
    Conventions: see api/README.md. /v1 is not frozen until 1.0.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
  - name: org
    description: Organizations.
  - name: audit
    description: The append-only audit trail.
  - name: tenancy
    description: Sites, blocks, units, allocation keys, vehicles, spreadsheet import and site hand-over.
  - name: people
    description: People, occupancies, memberships, invitations, join code and claims, directory, move-out and vendors.
  - name: platform
    description: Instance operation (platform administrators).
  - name: governance
    description: Assemblies, notices, agenda, polls, attendance, decisions, minutes, term reminders (release 0.2).
paths:
  /.well-known/openbekci.json:
    get:
      operationId: instance.getDiscovery
      summary: Instance discovery document
      description: Unauthenticated; used by apps to find the API and the available login methods.
      tags:
        - instance
      security: []
      x-stability: stable
      responses:
        '200':
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instance:
    get:
      operationId: instance.getInstance
      summary: Instance information (authenticated)
      tags:
        - instance
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-stability: stable
      responses:
        '200':
          description: The discovery document plus policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/session:
    post:
      operationId: auth.createSession
      summary: Sign in and start a browser session
      description: |
        `method` is `password`, `sms_otp` or `magic_link`; `identifier` is the
        email address or phone number. For `password` and for `sms_otp` with a
        `code` this verifies the credentials and sets the session cookie `obk_session`
        (httpOnly, SameSite=Lax, Secure except in development). `sms_otp` without
        `code` sends a code by SMS and `magic_link` emails a link (`client`
        selects the web or `openbekci://` link); both answer 202 whether or not
        the account exists. Wrong credentials
        of any kind answer 401 `invalid_grant`; repeated failures lock the
        identifier out (429 `rate_limited` with `Retry-After`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in. The cookie is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '202':
          description: A code or link was sent if the account exists. No body.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: auth.deleteSession
      summary: Sign out the current session
      description: Revokes the current session and clears the cookie (same as `DELETE /v1/me/sessions/current`).
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token:
    post:
      operationId: auth.createToken
      summary: Sign in and get access and refresh tokens (mobile, integrations)
      description: |
        Same credentials as `auth.createSession` (`password`, or `sms_otp` with a `code`; no `magic_link`), but returns opaque tokens
        instead of a cookie: an access token (15 minutes) for `Authorization:
        Bearer` and a rotating refresh token (60 days).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token/refresh:
    post:
      operationId: auth.refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        The refresh token is single use: the response carries a new one. Presenting
        a refresh token that was already used revokes the whole session (the
        family) and answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/otp:
    post:
      operationId: auth.requestOtp
      summary: Send a sign-in code by SMS
      description: |
        Sends a six-digit code (valid 5 minutes, 5 attempts) when an account has
        this phone number. The answer is the same whether or not it does.
        503 `sms_unavailable` when the instance has no SMS gateway. Limited per
        phone number and per client address (429 `rate_limited`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Accepted; a code was sent if the number is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link:
    post:
      operationId: auth.requestMagicLink
      summary: Email a single-use sign-in link
      description: |
        Emails a link valid for 15 minutes when an account has this address. The
        answer is the same whether or not it does. The link is
        `{BASE_URL}/login/magic?token=...`, or `openbekci://login/magic?token=...`
        for `client=mobile`. 503 `mail_unavailable` when the instance has no email
        configuration. Limited per address and per client address.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Accepted; a link was sent if the address is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link/consume:
    post:
      operationId: auth.consumeMagicLink
      summary: Sign in with a magic-link token
      description: |
        Exchanges the token from a magic link (single use) for a session: a cookie
        for `client=web`, tokens for `client=mobile`. An unknown, used or expired
        token answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsumeRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth:
    post:
      operationId: auth.reauth
      summary: Re-authenticate the current session for sensitive operations
      description: |
        Proves the caller is still the user with the password, a fresh SMS code
        (`auth.requestOtp`) or a fresh email code (`auth.requestReauthEmailCode`),
        and marks the current session as re-authenticated for 10 minutes. A user
        with only an email address and no password re-authenticates by email code.
        Sensitive operations answer 403 `reauth_required` outside that window.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth/email-code:
    post:
      operationId: auth.requestReauthEmailCode
      summary: Email a re-authentication code to the signed-in user
      description: |
        Sends a six-digit code (valid 5 minutes, 5 attempts) to the email address of
        the signed-in account, to be passed to `auth.reauth` with `method: email_code`.
        This is the re-authentication route of users who have neither a password nor
        a phone number. 422 `validation_failed` when the account has no email
        address, 503 `mail_unavailable` when the instance has no email
        configuration. Limited per address, per client address and per day.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '202':
          description: Accepted; the code was sent.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/password:
    post:
      operationId: auth.changePassword
      summary: Set or change the password
      description: |
        Requires a recent re-authentication (`auth.reauth`, else 403
        `reauth_required`). The password must have at least 10 characters. Every
        other session of the user is signed out.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: me.get
      x-openbekci-roles:
        - me.read
      summary: The signed-in user, organizations, roles and permissions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions:
    get:
      operationId: me.listSessions
      x-openbekci-roles:
        - sessions.manage_own
      summary: List the caller's open sessions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Open sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: me.revokeAllSessions
      x-openbekci-roles:
        - sessions.manage_own
      summary: Sign out everywhere
      description: Revokes every session of the caller, the current one included.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: All sessions were revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions/{id}:
    delete:
      operationId: me.revokeSession
      x-openbekci-roles:
        - sessions.manage_own
      summary: Sign out one session
      description: |
        Revokes the session with this id (from `me.listSessions`), or the current
        one for `current` (log out). For a mobile session the refresh token and
        every access token of the session are revoked.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      parameters:
        - name: id
          in: path
          required: true
          description: A session id, or `current`.
          schema:
            type: string
            pattern: ^(current|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      responses:
        '204':
          description: The session was revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: org.get
      summary: Read an organization
      description: Needs the `org.read` permission in the organization. Callers without an active membership there get 404.
      tags:
        - org
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - org.read
      responses:
        '200':
          description: The organization.
          headers:
            ETag:
              description: The organization's version, quoted; send it as `If-Match` when updating.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: org.update
      summary: Change an organization's settings
      description: |
        Needs the `org.manage` permission. `If-Match` carries the `version` the
        client last read; a stale version is 409 `version_conflict`. The change is
        recorded in the audit trail.
      tags:
        - org
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - org.manage
      x-idempotent: optional
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            The organization's `version` (as sent in `ETag`), optionally quoted. Required: without it the answer is 422
            `validation_failed`. It is declared optional here only so that an unauthenticated caller gets 401 before
            any validation detail (generated code binds required headers before authentication runs).
          schema:
            type: string
            pattern: ^"?[0-9]{1,9}"?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: The updated organization.
          headers:
            ETag:
              description: The new version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/audit:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: audit.list
      summary: List the organization's audit events
      description: |
        Newest first. Needs `audit.read`. Cursor pagination over `(at, id)`.
        Personal data in a `diff` appears only as hashes.
      tags:
        - audit
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - audit.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: action
          in: query
          description: Only events with this action, such as `org.update`.
          schema:
            type: string
        - name: target_type
          in: query
          description: Only events about this kind of target, such as `organization`.
          schema:
            type: string
        - name: actor
          in: query
          description: Only events caused by this user id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only events at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only events before this time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/codes:
    get:
      operationId: instance.getCodes
      summary: Labels of the API's codes
      description: Human labels for enums and error codes (roles, unit types, occupancy kinds, allocation key kinds, invitation kinds, problem codes, ...) in the requested locale.
      tags:
        - tenancy
      security: []
      parameters:
        - name: locale
          in: query
          description: en or tr (default en).
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Codes'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret token or code from the link.
        schema:
          type: string
          maxLength: 200
    get:
      operationId: people.previewInvitation
      summary: Preview an invitation
      description: What the holder of an invitation link sees before accepting. The token is the secret.
      tags:
        - people
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret token or code from the link.
        schema:
          type: string
          maxLength: 200
    post:
      operationId: people.acceptInvitation
      summary: Accept an invitation
      description: 'Public: the link proves the invited contact, like a magic link. The account for that contact is found or created (with the optional password), linked to the invited person, and the occupancy is created. Then sign in with any method.'
      tags:
        - people
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/join/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: The secret token or code from the link.
        schema:
          type: string
          maxLength: 200
    get:
      operationId: people.previewJoin
      summary: Preview the site behind a join code
      description: The site and organization names; signed in, also the units that can be claimed.
      tags:
        - people
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinPreview'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/join/{code}/claims:
    parameters:
      - name: code
        in: path
        required: true
        description: The secret token or code from the link.
        schema:
          type: string
          maxLength: 200
    post:
      operationId: people.createClaim
      summary: Claim a unit through a join code
      description: Needs a signed-in account. The claim waits for a manager's approval.
      tags:
        - people
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreate'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClaim'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/allocation-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: key_id
        in: path
        required: true
        description: The key id.
        schema:
          type: string
          format: uuid
    get:
      operationId: tenancy.getAllocationKey
      summary: Read an allocation key with its values
      tags:
        - tenancy
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - allocation.read
      responses:
        '200':
          description: Success.
          headers:
            ETag:
              description: The version, quoted; send it as `If-Match` when updating.
              schema:
                type: string
          content:
            application/json:
              schema:
