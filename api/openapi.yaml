    TermReminderList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermReminder'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.
      example:
        items:
          - id: 0192a3f0-1000-7000-8000-000000000002
            org_id: 0192a3f0-1000-7000-8000-000000000003
            site_id: 0192a3f0-1000-7000-8000-000000000004
            membership_id: 0192a3f0-1000-7000-8000-000000000005
            person_display_name: Ali Veli
            role: role
            valid_to: '2026-03-01'
            days_left: 1
            status: upcoming
            notified_at: null
            created_at: '2026-03-01T09:00:00Z'
            updated_at: '2026-03-01T09:00:00Z'
        next_cursor: null
    ReauthEmailCode:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `email_code`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own email address by `auth.requestReauthEmailCode`.
    EligibilityOwner:
      type: object
      description: An owner of record with the weight they vote with.
      required:
        - person_id
        - display_name
        - unit_ids
        - unit_labels
        - share
        - vote_weight
        - representative_of_unit_ids
      properties:
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
        unit_ids:
          type: array
          description: Every unit the person owns, including co-owned units another owner votes for.
          items:
            type: string
            format: uuid
        unit_labels:
          type: array
          description: Door numbers of `unit_ids`.
          items:
            type: string
        share:
          type: string
          description: The arsa payi the person votes for, a decimal string (exact, not a float).
        vote_weight:
          type: integer
          format: int64
          description: Number of votes the person holds (before the per-person cap).
        representative_of_unit_ids:
          type: array
          description: The units this person votes for (co-owners vote through one representative).
          items:
            type: string
            format: uuid
    EligibilitySnapshot:
      type: object
      description: Who could vote and with what weight; the attendance desk shows each owner's arsa payi from it.
      required:
        - taken_at
        - as_of
        - vote_weight
        - share_basis
        - unit_count
        - total_votes
        - total_share
        - owners
        - unrepresented_units
      properties:
        taken_at:
          type: string
          format: date-time
          description: When the snapshot was computed.
        as_of:
          type: string
          format: date-time
          description: The day whose owners of record it lists.
        vote_weight:
          type: string
          description: Open enum. `per_unit` or `per_owner`.
          x-open-enum: true
          enum:
            - per_unit
            - per_owner
        share_basis:
          type: string
          description: '`arsa_payi`, or `equal` when the site has no arsa payi values.'
        unit_count:
          type: integer
          format: int64
        total_votes:
          type: integer
          format: int64
        total_share:
          type: number
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityOwner'
        unrepresented_units:
          type: array
          description: Door numbers of units without an owner of record; nobody votes for them.
          items:
            type: string
