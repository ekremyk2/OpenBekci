          additionalProperties:
            type: string
            format: uuid
          description: 'Keyed by a removed status that tickets use: the kept status (by id) its tickets move to. Required for every such status (422 `required`); an entry for any other status, one that is kept or removed but unused, is 422 `unexpected`; a target that is not kept is 422 `invalid_value`.'
    UnreadCount:
      type: object
      required:
        - unread
        - visitor_approvals_pending
      properties:
        unread:
          type: integer
          format: int64
        visitor_approvals_pending:
          type: integer
          format: int64
          description: Pending visitor approval requests (0.3); polled together.
    DashboardMeeting:
      type: object
      required:
        - id
        - title
        - scheduled_at
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
        status:
          type: string
    DashboardTerm:
      type: object
      required:
        - membership_id
        - person_display_name
        - role
        - valid_to
      properties:
        membership_id:
          type: string
          format: uuid
        person_display_name:
          type: string
        role:
          type: string
        valid_to:
          type: string
          format: date
    MeDashboard:
      type: object
      description: The caller's home summary in the organization.
      required:
        - home
        - sides
        - unread_notifications
        - unread_announcements
        - my_open_tickets
        - upcoming_meetings
        - pending_visitor_approvals
        - waiting_deliveries
      properties:
        home:
          type: string
          description: Which home the web app should show. Open enum.
          enum:
            - portfolio
            - site
            - resident
          x-open-enum: true
        sides:
          type: array
          items:
            $ref: '#/components/schemas/MySide'
          description: Resident money summary (what do I owe today); empty without money visibility.
        unread_notifications:
          type: integer
          format: int64
        unread_announcements:
          type: integer
          format: int64
        my_open_tickets:
          type: integer
          format: int64
        upcoming_meetings:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMeeting'
        pending_visitor_approvals:
          type: integer
          format: int64
        waiting_deliveries:
          type: integer
          format: int64
    MySide:
      type: object
      description: What the caller owes on one side (owner or tenant) of one unit today. Filled by the money module; the draft's `money.MySide`, kept here until the money module lands and owns it.
      required:
        - unit_id
        - unit_door_number
        - debtor_kind
        - principal
        - accrued_late_fee
        - total
        - credit
        - next_due_date
        - bank_details
      properties:
        unit_id:
          type: string
          format: uuid
        unit_door_number:
          type: string
        debtor_kind:
          type: string
          description: Open enum.
          enum:
            - owner
            - tenant
          x-open-enum: true
        principal:
          $ref: '#/components/schemas/Money'
        accrued_late_fee:
          $ref: '#/components/schemas/Money'
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: What do I owe today.
        credit:
          $ref: '#/components/schemas/Money'
        next_due_date:
          type: string
          format: date
          nullable: true
        bank_details:
          type: object
          additionalProperties: true
          nullable: true
          description: The site's bank details shown to payers (IBAN and holder).
    PortfolioDashboard:
      type: object
      description: 'Cross-site view for management companies (S5): overdue, cash and open tickets per site.'
      required:
        - as_of
        - sites
        - totals
      properties:
        as_of:
          type: string
          format: date-time
        sites:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioSite'
        totals:
          $ref: '#/components/schemas/PortfolioTotals'
    PortfolioSite:
      type: object
      required:
        - site_id
        - name
        - overdue
        - overdue_units
        - cash
        - bank
        - open_tickets
        - collection_rate_pct
      properties:
        site_id:
          type: string
          format: uuid
        name:
          type: string
        overdue:
          $ref: '#/components/schemas/Money'
        overdue_units:
          type: integer
          format: int64
        cash:
          $ref: '#/components/schemas/Money'
        bank:
          $ref: '#/components/schemas/Money'
        open_tickets:
          type: integer
          format: int64
        collection_rate_pct:
          type: number
    PortfolioTotals:
      type: object
      required:
        - overdue
        - cash
        - bank
        - open_tickets
      properties:
        overdue:
          $ref: '#/components/schemas/Money'
        cash:
          $ref: '#/components/schemas/Money'
        bank:
          $ref: '#/components/schemas/Money'
        open_tickets:
          type: integer
          format: int64
    SiteDashboard:
      type: object
      description: Per-site dashboard for managers, board, auditors and accountants.
      required:
        - site_id
        - as_of
        - receivable_owner
        - receivable_tenant
        - overdue_total
        - overdue_units
        - cash
        - bank
        - collection_rate_pct
        - accrued_late_fees
        - open_tickets
        - open_common_tickets
        - pending_unit_claims
        - pending_declared_payments
        - waiting_deliveries
        - pending_visitor_approvals
        - upcoming_meeting
        - expiring_terms
      properties:
        site_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        receivable_owner:
          $ref: '#/components/schemas/Money'
        receivable_tenant:
          $ref: '#/components/schemas/Money'
        overdue_total:
          $ref: '#/components/schemas/Money'
        overdue_units:
          type: integer
          format: int64
        cash:
          $ref: '#/components/schemas/Money'
        bank:
          $ref: '#/components/schemas/Money'
        collection_rate_pct:
          type: number
        accrued_late_fees:
          $ref: '#/components/schemas/Money'
        open_tickets:
          type: integer
          format: int64
        open_common_tickets:
          type: integer
          format: int64
        pending_unit_claims:
          type: integer
          format: int64
        pending_declared_payments:
          type: integer
          format: int64
        waiting_deliveries:
          type: integer
          format: int64
          description: 0 before release 0.3.
        pending_visitor_approvals:
          type: integer
          format: int64
          description: 0 before release 0.3.
        upcoming_meeting:
          type: object
          allOf:
            - $ref: '#/components/schemas/DashboardMeeting'
          nullable: true
          description: Null before release 0.2.
        expiring_terms:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTerm'
          description: Empty before release 0.2.
    StaffDashboard:
      type: object
      description: 'Counts-only dashboard for staff (S3/S8): their own work and the gate, with no money, no debtor data and no resident names.'
      required:
        - site_id
        - as_of
        - assigned_open_tickets
        - assigned_overdue_tickets
        - open_common_tickets
        - expected_visitors_today
        - waiting_deliveries
      properties:
        site_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        assigned_open_tickets:
          type: integer
          format: int64
          description: Open tickets assigned to the caller.
        assigned_overdue_tickets:
          type: integer
          format: int64
          description: Assigned tickets past their category's target time.
        open_common_tickets:
          type: integer
          format: int64
          description: Open common (site-wide) tickets.
        expected_visitors_today:
          type: integer
          format: int64
        waiting_deliveries:
          type: integer
          format: int64
          description: Parcels logged and not yet collected.
      example:
        site_id: 0192a3f0-1000-7000-8000-000000000002
        as_of: '2026-03-05T09:00:00Z'
        assigned_open_tickets: 3
        assigned_overdue_tickets: 0
        open_common_tickets: 5
        expected_visitors_today: 4
        waiting_deliveries: 2
    CodeLabel:
      type: object
      required:
        - code
        - label
      properties:
        code:
          type: string
        label:
          type: string
        description:
          type: string
    OrgCodes:
      type: object
      required:
        - locale
        - enums
        - errors
        - ticket_statuses
      properties:
        locale:
          type: string
        enums:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CodeLabel'
          description: Labels per open enum, keyed by enum name (for example `charge_type`, `occupancy_kind`), pack labels included.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
          description: Problem codes.
        ticket_statuses:
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
          description: Site-defined ticket statuses when `site_id` is given.
    ReauthEmailCode:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `email_code`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own email address by `auth.requestReauthEmailCode`.
