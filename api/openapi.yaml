            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkflow'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: operations.updateTicketWorkflow
      summary: Replace the ticket workflow of a site
      description: |-
        Reopen is just a transition back to an open-like status. The body is the complete ordered list: entries with an `id` keep that status (renamed, reordered, `semantic` changed), entries without one are new, statuses left out are removed. At least one open-like and one closed-like status are needed. A removed status that tickets use needs an entry in `replacements` naming the kept status its tickets move to (422 `required`); an entry for a status that is kept, or removed but unused, is refused (422 `unexpected`). Removed statuses are archived: history keeps their names. `site_id` and `If-Match` (the `version` of `TicketWorkflow`) are required. `PUT ...:restore-default` puts the built-in flow back.

        Permission: `tickets.manage`.

        Problems: `conflict` (409), `version_conflict` (409).
      tags:
        - operations
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        org_admin:
          - tickets.manage
        site_manager:
          - tickets.manage
