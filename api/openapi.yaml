        - name: after
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by `after`.
        - name: point_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by `point_id`.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/GuardSession'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardAccessEventList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/access/commands/{command_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: command_id
        in: path
        required: true
        description: Id of the command.
        schema:
          type: string
          format: uuid
    get:
      operationId: access.getAgentCommand
      summary: Status of an open command
      description: |-
        **Release 0.3.** The console polls every 500 ms for up to 10 seconds.

        Permission (any one of): `access.open`, `access.manage`.
      tags:
        - access
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        org_admin:
          - access.open
          - access.manage
        site_manager:
          - access.open
          - access.manage
        guard:
          - access.open
      x-stability: preview
      parameters:
        - $ref: '#/components/parameters/GuardSession'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCommand'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent/enrol:
    post:
      operationId: agent.enrol
      summary: Enrol an agent with a one-time token
      description: |-
        **Release 0.3.** The one-time token is the credential (10 per minute per IP). An unknown, expired or already used token answers one identical 404 body, so the three cases cannot be told apart. Re-enrolling needs a new token (`access.reenrolAgent`).

        Problems: `not_found` (404), `validation_failed` (422), `rate_limited` (429).
      tags:
        - agent
      security: []
      x-idempotent: optional
      x-stability: preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrolRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrolResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent/poll:
    post:
      operationId: agent.poll
      summary: Long-poll transport (WebSocket fallback)
      description: |-
        **Release 0.3.** Same envelopes, semantics and authentication as the WebSocket. A session begins with a `hello` call (no `session`); the server hello carries the `session` handle that every later call sends. Each response has a per-session `seq` (ordered delivery, see `AgentPollResponse`). An empty poll is 200 with an empty `messages` array, never 204.

        A session ends after 60 seconds without a request: the next call fails with 410 `agent_session_expired` and the agent starts a new session with `hello`. A bare 401 means an unknown token only (the agent quarantines itself and does not wipe); a revoked agent receives the `revoked` command (the WebSocket closes with 4401) and wipes. Idempotency is built into the protocol (events by id, commands by id, deltas by version); `Idempotency-Key` is ignored.

        Problems: `agent_session_expired` (410), `rate_limited` (429), `conflict` (409).
      tags:
        - agent
      security:
        - agentAuth: []
      x-idempotent: optional
      x-stability: preview
      x-agent-message-schemas:
        envelope: api/agent-protocol/v1/envelope.schema.json
        hello_agent: api/agent-protocol/v1/hello-agent.schema.json
        hello_server: api/agent-protocol/v1/hello-server.schema.json
        snapshot: api/agent-protocol/v1/snapshot.schema.json
        delta: api/agent-protocol/v1/delta.schema.json
        event: api/agent-protocol/v1/event.schema.json
        ack: api/agent-protocol/v1/ack.schema.json
        command: api/agent-protocol/v1/command.schema.json
        heartbeat: api/agent-protocol/v1/heartbeat.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPollRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPollResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent/token:rotate:
    post:
      operationId: agent.rotateToken
      summary: Rotate the agent token
      description: |-
        **Release 0.3.** Returns a new token. The retired token stays valid for 10 minutes (`previous_valid_until`) so a crash between steps recovers, and calling again with the retired token inside that window is idempotent: it returns the same new token. After the window the retired token is 401. `rotate_by` is also in the server hello (default 180 days); the hello may set `rotate_now`.

        Problems: `rate_limited` (429), `conflict` (409).
      tags:
        - agent
      security:
        - agentAuth: []
      x-idempotent: optional
      x-stability: preview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenRotated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent/ws:
    get:
      operationId: agent.connect
      summary: WebSocket transport
      description: |-
        **Release 0.3.** Upgrade with subprotocol `openbekci.agent.v1` and `Authorization: Bearer <agent token>`. One JSON envelope per text frame, at most 1 MiB. Close codes: 4401 revoked or unauthorized, 4409 replaced by a newer session, 4426 no common protocol version, 4429 rate limited. Server ping every 30 s, 60 s pong deadline; the server answers the agent's pings with a pong and acks heartbeats, so the agent's contact clock advances. Revocation is the `revoked` command followed by close 4401; a bare 401 on upgrade means an unknown token only.

        Problems: `rate_limited` (429).
      tags:
        - agent
      security:
        - agentAuth: []
      x-stability: preview
      x-agent-message-schemas:
        envelope: api/agent-protocol/v1/envelope.schema.json
        hello_agent: api/agent-protocol/v1/hello-agent.schema.json
        hello_server: api/agent-protocol/v1/hello-server.schema.json
        snapshot: api/agent-protocol/v1/snapshot.schema.json
        delta: api/agent-protocol/v1/delta.schema.json
        event: api/agent-protocol/v1/event.schema.json
        ack: api/agent-protocol/v1/ack.schema.json
        command: api/agent-protocol/v1/command.schema.json
        heartbeat: api/agent-protocol/v1/heartbeat.schema.json
      responses:
        '101':
          description: WebSocket upgrade accepted (subprotocol `openbekci.agent.v1`).
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: obk_session
      description: Browser session cookie issued by the login endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (mobile app sessions, later API keys).
    agentAuth:
      type: http
      scheme: bearer
      description: On-site access agent token (`obk_agt_<agent_id>.<secret>`), scoped to one site. Used by `/v1/agent/*`.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays within 7 days return the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DryRun:
      name: dry_run
      in: query
      description: When true, validate and return the row-level report without saving anything.
      schema:
        type: boolean
        default: false
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (8..128 chars); mandatory on this operation. A replay within 7 days returns the stored response; the same key with a different request is 422 `idempotency_mismatch`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the resource the client last read, as a quoted integer (`"3"`). A stale value is 409 `version_conflict`; a missing one is 422 `validation_failed`.
      schema:
        type: string
        example: '"3"'
    OrgId:
      name: org_id
      in: path
      required: true
      description: Organization id.
      schema:
        type: string
        format: uuid
    SiteId:
      name: site_id
      in: query
      description: 'Restrict to one site. Omitted: all sites the caller may see in the organization.'
      schema:
        type: string
        format: uuid
    SiteIdRequired:
      name: site_id
      in: query
      required: true
      description: The site this resource belongs to.
      schema:
        type: string
        format: uuid
    GuardSession:
      name: X-Guard-Session
      in: header
      description: Optional guard session from `community.createGuardSession`. With a valid token the action is attributed to that guard (audit actor and `decided_by` fields) instead of the console's login principal; the guard must hold `gate.operate` on the site, and a token never grants more than the console login itself has. Without it the login principal is the actor. An unknown, expired or ended token is 401 `invalid_grant`; a token from another console login session or another site is 403 `insufficient_permission`. The header is never required and is ignored by operations that do not list it.
      schema:
        type: string
  responses:
    Problem:
      description: Error. RFC 9457 problem details with a stable `code`.
      headers:
        X-Request-Id:
          schema:
            type: string
        WWW-Authenticate:
          description: On 401, the accepted scheme (`Bearer`).
          schema:
            type: string
        Allow:
          description: On 405, the methods the resource supports.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as application/problem+json. Clients
        translate by `code`. `code` is an open enum: clients must tolerate unknown values.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` unless documented.
          example: about:blank
        title:
          type: string
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          x-open-enum: true
          description: Stable machine-readable error code. Open enum.
          enum:
            - validation_failed
            - bad_request
            - unauthenticated
            - not_found
            - conflict
            - version_conflict
            - idempotency_mismatch
            - locked_period
            - insufficient_permission
            - reauth_required
            - mfa_required
            - invalid_grant
            - rate_limited
            - pack_error
            - site_offboarded
            - internal_error
            - csrf_failed
            - sms_unavailable
            - mail_unavailable
            - payload_too_large
            - method_not_allowed
            - unsupported_media_type
            - timeout
            - agent_offline
            - agent_session_expired
        detail:
          type: string
          description: Human-readable explanation, not for machine parsing.
        instance:
          type: string
          description: The request id (also in the `X-Request-Id` response header), for support and logs.
        request_id:
          type: string
          description: Same value as `instance`.
        errors:
          type: array
          description: Per-field errors (with `validation_failed`).
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: Dotted path of the offending request field, query or header parameter.
        code:
          type: string
          description: Field-level error code, for example `required`, `invalid`, `too_long`.
        params:
          type: object
          additionalProperties: true
          description: Values for the client message template, such as the maximum length.
    Money:
      type: object
      description: Integer minor units with an ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          example: 123450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TRY
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page.
    DiscoveryDocument:
      type: object
      description: Unauthenticated instance discovery document (overview section 6.8).
      required:
        - instance_id
        - instance_name
        - api_base_url
        - api_versions
        - server_version
        - sdk_version
        - min_app_version
        - auth_methods
        - push
        - packs
        - branding
        - relay_enrollment
      properties:
        instance_id:
          type: string
          format: uuid
          description: Stable for the life of the instance.
        instance_name:
          type: string
        api_base_url:
          type: string
          example: https://example.org/v1
        api_versions:
          type: array
          items:
            type: string
          example:
            - v1
        server_version:
          type: string
          example: 0.1.0
        sdk_version:
          type: string
          nullable: true
          description: Pack SDK version, null until packs exist.
        min_app_version:
          $ref: '#/components/schemas/MinAppVersion'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethod'
        push:
          $ref: '#/components/schemas/PushInfo'
        packs:
          type: array
          items:
            type: string
        branding:
          $ref: '#/components/schemas/Branding'
        relay_enrollment:
          $ref: '#/components/schemas/RelayEnrollment'
    MinAppVersion:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          example: 1.0.0
        ios:
          type: string
          example: 1.0.0
    AuthMethod:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Open string. Known: `password`, `sms_otp`, `magic_link`, `oidc:<provider>`.
          x-known-values:
            - password
            - sms_otp
            - magic_link
            - oidc:<provider>
        label_key:
          type: string
        icon:
          type: string
    PushInfo:
      type: object
      required:
        - relay_ids
        - unified_push
      properties:
        relay_ids:
          type: array
          items:
            type: string
        unified_push:
          type: boolean
    Branding:
      type: object
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#1a73e8'
    RelayEnrollment:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string
          nullable: true
          description: Ephemeral challenge for push relay enrollment; null when not enrolling.
    InstancePolicies:
      type: object
      description: Instance policies. Empty until later phases add some.
      additionalProperties: true
    Instance:
      description: Authenticated twin of the discovery document, with policies.
      allOf:
        - $ref: '#/components/schemas/DiscoveryDocument'
        - type: object
          required:
            - policies
          properties:
            policies:
              $ref: '#/components/schemas/InstancePolicies'
    AuthUser:
      type: object
      description: The signed-in account (instance-wide, not per organization).
      required:
        - id
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: E.164.
        locale:
          type: string
          example: tr
        is_platform_admin:
          type: boolean
    Credentials:
      type: object
      required:
        - method
        - identifier
      description: |
        What the caller proves. `method` is `password`, `sms_otp` or
        `magic_link` (open on input; known values listed). `identifier` is an
        email address or a phone number (E.164 or national format). `password`
        is required for `password`; `code` is the six-digit SMS code for
        `sms_otp` (without it the server sends one). Field errors are reported
        for `identifier`, `password` and `code`.
      properties:
        method:
          type: string
          x-known-values:
            - password
            - sms_otp
            - magic_link
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        code:
          type: string
          maxLength: 16
          description: The code sent by SMS.
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes an emailed link use the `openbekci://` scheme.'
        device_name:
          type: string
          maxLength: 128
          description: Label of the session in the session list.
    SessionResponse:
      type: object
      description: A browser session was created; the token is in the `obk_session` cookie.
      required:
        - session_id
        - expires_at
        - user
      properties:
        session_id:
          type: string
          format: uuid
          description: Id of the session in `GET /v1/me/sessions`.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenResponse:
      type: object
      description: |
        A mobile or integration session. The access token is short-lived and
        checked on every request; the refresh token rotates on every use, and
        presenting a rotated one revokes the whole session.
      required:
        - token_type
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_id
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResult:
      type: object
      description: |
        Result of consuming a magic link. For `client=web` the token is in the
        `obk_session` cookie and `expires_at` is the session expiry; for
        `client=mobile` the token fields are present and `expires_at` is the
        access token expiry.
      required:
        - client
        - session_id
        - expires_at
        - user
      properties:
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Which kind of session was created (open enum).
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: Only for `client=mobile`.
        refresh_token:
          type: string
          description: Only for `client=mobile`.
        refresh_expires_at:
          type: string
          format: date-time
          description: Only for `client=mobile`.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 200
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 32
          description: E.164 or national format.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes the link use the `openbekci://` scheme instead of the web URL.'
    MagicLinkConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 200
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`web` sets the session cookie, `mobile` returns tokens.'
        device_name:
          type: string
          maxLength: 128
    ReauthPassword:
      type: object
      required:
        - method
        - password
      properties:
        method:
          type: string
          description: Always `password`.
        password:
          type: string
          maxLength: 256
    ReauthSmsOtp:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `sms_otp`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own phone by `auth.requestOtp`.
    ReauthRequest:
      oneOf:
        - $ref: '#/components/schemas/ReauthPassword'
        - $ref: '#/components/schemas/ReauthSmsOtp'
        - $ref: '#/components/schemas/ReauthEmailCode'
      discriminator:
        propertyName: method
        mapping:
          password: '#/components/schemas/ReauthPassword'
          sms_otp: '#/components/schemas/ReauthSmsOtp'
          email_code: '#/components/schemas/ReauthEmailCode'
    ReauthResponse:
      type: object
      required:
        - reauth_until
      properties:
        reauth_until:
          type: string
          format: date-time
          description: End of the re-authentication window of this session (10 minutes).
    ChangePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    RoleGrant:
      type: object
      description: An active membership of the caller's person in the organization.
      required:
        - role
        - scope_type
        - scope_id
        - site_owned
      properties:
        role:
          type: string
          x-open-enum: true
          description: 'Open enum: org_admin, site_manager, board_member, auditor, accountant, staff, guard.'
          enum:
            - org_admin
            - site_manager
            - board_member
            - auditor
            - accountant
            - staff
            - guard
        scope_type:
          type: string
          x-open-enum: true
          description: Open enum.
          enum:
            - org
            - site
            - block
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: The site or block id; null for `org` scope.
        site_owned:
          type: boolean
    OrgAccess:
      type: object
      required:
        - id
        - slug
        - name
        - default_locale
        - roles
        - permissions
        - sites
      properties:
        default_locale:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        permissions:
          type: array
          description: Effective permissions in this organization, from the caller's active memberships and the role to permission matrix.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        sites:
          type: array
