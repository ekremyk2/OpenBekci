    get:
      operationId: money.getUnitStatement
      summary: Statement of a unit side
      description: |-
        **Release 0.1.** JSON, or `format=pdf` for the printable statement. A former occupant sees only their own period (S7).

        Permission (any one of): `statements.read`, `statements.read_own` (occupants: their own side and period only).
      tags:
        - money
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        org_admin:
          - statements.read
        site_manager:
          - statements.read
        board_member:
          - statements.read
        auditor:
          - statements.read
        accountant:
          - statements.read
        owner:
          - statements.read_own
        tenant:
          - statements.read_own
        household:
          - statements.read_own
        former_occupant:
          - statements.read_own
      x-stability: stable
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start of the range (inclusive).
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End of the range (inclusive).
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The report. JSON by default; `format` selects a CSV, XLSX or PDF download.
          content:
