openapi: 3.0.3
info:
  title: OpenBekci API
  version: 0.1.0
  description: |
    HTTP API of an OpenBekci instance (residential site management).
    Conventions: see api/README.md. /v1 is not frozen until 1.0.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
  - name: org
    description: Organizations.
  - name: audit
    description: The append-only audit trail.
  - name: operations
    description: Everyday operation of the building; for now the files (uploaded and generated, streamed through the server).
  - name: platform
    description: Instance operation (platform administrators).
paths:
  /.well-known/openbekci.json:
    get:
      operationId: instance.getDiscovery
      summary: Instance discovery document
      description: Unauthenticated; used by apps to find the API and the available login methods.
      tags:
        - instance
      security: []
      x-stability: stable
      responses:
        '200':
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instance:
    get:
      operationId: instance.getInstance
      summary: Instance information (authenticated)
      tags:
        - instance
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-stability: stable
      responses:
        '200':
          description: The discovery document plus policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/session:
    post:
      operationId: auth.createSession
      summary: Sign in and start a browser session
      description: |
        `method` is `password`, `sms_otp` or `magic_link`; `identifier` is the
        email address or phone number. For `password` and for `sms_otp` with a
        `code` this verifies the credentials and sets the session cookie `obk_session`
        (httpOnly, SameSite=Lax, Secure except in development). `sms_otp` without
        `code` sends a code by SMS and `magic_link` emails a link (`client`
        selects the web or `openbekci://` link); both answer 202 whether or not
        the account exists. Wrong credentials
        of any kind answer 401 `invalid_grant`; repeated failures lock the
        identifier out (429 `rate_limited` with `Retry-After`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in. The cookie is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '202':
          description: A code or link was sent if the account exists. No body.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: auth.deleteSession
      summary: Sign out the current session
      description: Revokes the current session and clears the cookie (same as `DELETE /v1/me/sessions/current`).
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token:
    post:
      operationId: auth.createToken
      summary: Sign in and get access and refresh tokens (mobile, integrations)
      description: |
        Same credentials as `auth.createSession` (`password`, or `sms_otp` with a `code`; no `magic_link`), but returns opaque tokens
        instead of a cookie: an access token (15 minutes) for `Authorization:
        Bearer` and a rotating refresh token (60 days).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token/refresh:
    post:
      operationId: auth.refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        The refresh token is single use: the response carries a new one. Presenting
        a refresh token that was already used revokes the whole session (the
        family) and answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/otp:
    post:
      operationId: auth.requestOtp
      summary: Send a sign-in code by SMS
      description: |
        Sends a six-digit code (valid 5 minutes, 5 attempts) when an account has
        this phone number. The answer is the same whether or not it does.
        503 `sms_unavailable` when the instance has no SMS gateway. Limited per
        phone number and per client address (429 `rate_limited`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Accepted; a code was sent if the number is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link:
    post:
      operationId: auth.requestMagicLink
      summary: Email a single-use sign-in link
      description: |
        Emails a link valid for 15 minutes when an account has this address. The
        answer is the same whether or not it does. The link is
        `{BASE_URL}/login/magic?token=...`, or `openbekci://login/magic?token=...`
        for `client=mobile`. 503 `mail_unavailable` when the instance has no email
        configuration. Limited per address and per client address.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Accepted; a link was sent if the address is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link/consume:
    post:
      operationId: auth.consumeMagicLink
      summary: Sign in with a magic-link token
      description: |
        Exchanges the token from a magic link (single use) for a session: a cookie
        for `client=web`, tokens for `client=mobile`. An unknown, used or expired
        token answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsumeRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth:
    post:
      operationId: auth.reauth
      summary: Re-authenticate the current session for sensitive operations
      description: |
        Proves the caller is still the user with the password, a fresh SMS code
        (`auth.requestOtp`) or a fresh email code (`auth.requestReauthEmailCode`),
        and marks the current session as re-authenticated for 10 minutes. A user
        with only an email address and no password re-authenticates by email code.
        Sensitive operations answer 403 `reauth_required` outside that window.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth/email-code:
    post:
      operationId: auth.requestReauthEmailCode
      summary: Email a re-authentication code to the signed-in user
      description: |
        Sends a six-digit code (valid 5 minutes, 5 attempts) to the email address of
        the signed-in account, to be passed to `auth.reauth` with `method: email_code`.
        This is the re-authentication route of users who have neither a password nor
        a phone number. 422 `validation_failed` when the account has no email
        address, 503 `mail_unavailable` when the instance has no email
        configuration. Limited per address, per client address and per day.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '202':
          description: Accepted; the code was sent.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/password:
    post:
      operationId: auth.changePassword
      summary: Set or change the password
      description: |
        Requires a recent re-authentication (`auth.reauth`, else 403
        `reauth_required`). The password must have at least 10 characters. Every
        other session of the user is signed out.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: me.get
      x-openbekci-roles:
        - me.read
      summary: The signed-in user, organizations, roles and permissions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions:
    get:
      operationId: me.listSessions
      x-openbekci-roles:
        - sessions.manage_own
      summary: List the caller's open sessions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Open sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: me.revokeAllSessions
      x-openbekci-roles:
        - sessions.manage_own
      summary: Sign out everywhere
      description: Revokes every session of the caller, the current one included.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: All sessions were revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions/{id}:
    delete:
      operationId: me.revokeSession
      x-openbekci-roles:
        - sessions.manage_own
      summary: Sign out one session
      description: |
        Revokes the session with this id (from `me.listSessions`), or the current
        one for `current` (log out). For a mobile session the refresh token and
        every access token of the session are revoked.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      parameters:
        - name: id
          in: path
          required: true
          description: A session id, or `current`.
          schema:
            type: string
            pattern: ^(current|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      responses:
        '204':
          description: The session was revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: org.get
      summary: Read an organization
      description: Needs the `org.read` permission in the organization. Callers without an active membership there get 404.
      tags:
        - org
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - org.read
      responses:
        '200':
          description: The organization.
          headers:
            ETag:
              description: The organization's version, quoted; send it as `If-Match` when updating.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: org.update
      summary: Change an organization's settings
      description: |
        Needs the `org.manage` permission. `If-Match` carries the `version` the
        client last read; a stale version is 409 `version_conflict`. The change is
        recorded in the audit trail.
      tags:
        - org
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - org.manage
      x-idempotent: optional
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            The organization's `version` (as sent in `ETag`), optionally quoted. Required: without it the answer is 422
            `validation_failed`. It is declared optional here only so that an unauthenticated caller gets 401 before
            any validation detail (generated code binds required headers before authentication runs).
          schema:
            type: string
            pattern: ^"?[0-9]{1,9}"?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: The updated organization.
          headers:
            ETag:
              description: The new version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/audit:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: audit.list
      summary: List the organization's audit events
      description: |
        Newest first. Needs `audit.read`. Cursor pagination over `(at, id)`.
        Personal data in a `diff` appears only as hashes.
      tags:
        - audit
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - audit.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: action
          in: query
          description: Only events with this action, such as `org.update`.
          schema:
            type: string
        - name: target_type
          in: query
          description: Only events about this kind of target, such as `organization`.
          schema:
            type: string
        - name: actor
          in: query
          description: Only events caused by this user id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only events at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only events before this time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/files:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: operations.uploadFile
      summary: Upload a file
      description: |
        **Release 0.1.** `multipart/form-data`, streamed through the server (no direct-to-storage uploads): type
        sniffed, EXIF location stripped, `thumb` and `medium` generated for images. The form fields come **before**
        the `file` part (see `FileUpload`); a field after it is 422 `validation_failed` with the field code
        `multipart_order`, and so is a field this operation does not know.

        Needs `files.upload` (at the site, when `site_id` is given). With `scope` (`<type>:<id>`, for example
        `ticket:2f9c...`) the file is attached to that resource at once and the module that owns it must allow
        the caller to add files there; without it the file is a draft that expires after 7 days and that
        only its uploader can see, read and discard.

        The content is sniffed: the extension must be on the instance's allowlist (photos, PDF, office documents,
        plain text by default) and the bytes must really be that type, whatever the client's `Content-Type`.
        Images are decoded and re-encoded, which strips EXIF (including the GPS location) and every other piece of
        metadata, rotated upright first (JPEG, PNG and WebP), downscaled to at most 4096 px, and given `thumb` and
        `medium` variants. A file the virus scanner flags is stored as `quarantined`.

        Problems: a file over `OPENBEKCI_MAX_UPLOAD_BYTES` (25 MiB by default) is 413 `payload_too_large`; a type that
        is not allowed or does not match its extension is 415 `unsupported_media_type`; an image that cannot be
        decoded or has more than `OPENBEKCI_MAX_IMAGE_PIXELS` pixels (25 million by default) is 422
        `validation_failed`; a scanner that cannot be reached is 503 `scan_unavailable`; a resource that already
        has its maximum number of files (ticket photos: 10) is 409 `conflict`; a user may upload 30 files a minute,
        then 429 `rate_limited`.

        `Idempotency-Key` is honoured and compares content: the first upload under a key is stored, a retry with
        the same form (same fields, same file bytes and name, whatever the multipart boundary or transfer
        encoding) replays the first response, and a different file under the same key is 422
        `idempotency_mismatch`, also when it has the same length. Nothing is stored for a replay or a mismatch.
      tags:
        - operations
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - files.upload
      x-idempotent: optional
      x-openbekci-stream: true
      x-stability: stable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          description: The stored file.
          headers:
            Location:
              description: The file's metadata URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: operations.listFiles
      summary: List files
      description: |
        **Release 0.1.** Newest first. With `scope`, the files attached to that resource; the caller needs read
        access to it (the module that owns the resource decides; administrators with `files.manage` always have
        it). Without a scope, an administrator sees every file of the organization and anyone else the files
        they uploaded. Needs `files.read`.

        Not in the first draft of the contract: added with the module, because the web app needs the files of a
        resource and an administrator needs to see what is stored.
      tags:
        - operations
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - files.read
      x-stability: stable
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: scope
          in: query
          description: Only files attached to this resource, `<type>:<id>`, for example `ticket:2f9c...`.
          schema:
            type: string
      responses:
        '200':
          description: One page of files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: operations.downloadFile
      summary: Download a file
      description: |
        **Release 0.1.** Streams the file. Images (`image/jpeg`, `image/png`, `image/webp`) are sent `inline`;
        everything else is sent with `Content-Disposition: attachment`. All responses carry
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox` and `Cache-Control: private, no-store`.
        `variant=thumb|medium` selects an image variant (404 for a file that has none). With the S3 driver the
        answer is a 302 to a short-lived presigned URL instead of the bytes.

        Two ways in. With a session: needs `files.read` and the file visible to the caller: a draft (not attached to
        a resource) to its uploader and to `files.manage`; an attached file to whoever the owning module's
        resolver lets read it, and to `files.manage`; anything else is 404, so file ids do not leak. Or without
        a session, with the `exp` and `sig` query parameters of a `links` URL from the file's metadata (local
        storage; with S3 the links point at the bucket); the signature is checked first, a session cookie
        or token that comes with it is ignored. A missing or invalid signature and an expired one are 401. A
        quarantined file has no downloadable content (404).
      tags:
        - operations
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - files.read
      x-openbekci-stream: true
      x-stability: stable
      parameters:
        - name: variant
          in: query
          description: Image variant, `thumb` or `medium`. Absent for the original.
          schema:
            type: string
            enum:
              - thumb
              - medium
        - name: exp
          in: query
          description: Expiry of a signed URL, Unix seconds. Sent with `sig`.
          schema:
            type: integer
            format: int64
        - name: sig
          in: query
          description: Signature of a signed URL. Sent with `exp`.
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: The file's bytes, with the stored type as `Content-Type`.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '302':
          description: Short-lived signed URL (S3 driver).
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: operations.deleteFile
      summary: Delete an unattached file
      description: |
        **Release 0.1.** Discards a file that is not attached to a resource: its uploader may (needs `files.upload`),
        and so may a holder of `files.manage`, who may also delete an attached file. The uploader of an attached
        file gets 409 `conflict`: it belongs to the resource now and its owning module detaches it. Anyone else
        who cannot see the file gets 404. The file disappears at once; its blobs are removed by the hourly
        `maintenance.prune_files` job. Recorded in the audit trail.
      tags:
        - operations
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - files.upload
      x-idempotent: optional
      x-stability: stable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orgs/{org_id}/files/{file_id}/meta:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: operations.getFileMeta
      summary: Get file metadata
      description: |
        **Release 0.1.** Needs `files.read` and the file visible to the caller (see `operations.downloadFile`);
        anything else is 404, so file ids do not leak. `links` carries fresh short-lived download URLs.
        `uploaded_by` is the uploader's user id for the uploader and for `files.manage`, and null for everyone else.
      tags:
        - operations
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - files.read
      x-stability: stable
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/audit:
    get:
      operationId: platform.listAudit
      summary: List the instance-level audit events
      description: |
        Events that belong to no organization: password changes, session revocation,
        platform-administrator promotion. Newest first. Needs the `platform.manage`
        permission (platform administrators only). Cursor pagination over `(at, id)`.

        Personal data in a `diff` appears only as hashes, and `ip` is truncated to
        its /24 (IPv4) or /48 (IPv6) network. Erasing a person does not change these
        events: they hold ids and hashes, no personal values. `site_id` is always null.
      tags:
        - platform
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-openbekci-roles:
        - platform.manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: action
          in: query
          description: Only events with this action, such as `session.revoke`.
          schema:
            type: string
        - name: actor
          in: query
          description: Only events caused by this user id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only events at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only events before this time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: obk_session
      description: Browser session cookie issued by the login endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (mobile app sessions, later API keys).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays within 7 days return the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    OrgId:
      name: org_id
      in: path
      required: true
      description: The organization id.
      schema:
        type: string
        format: uuid
    FileId:
      name: file_id
      in: path
      required: true
      description: The file id.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error. RFC 9457 problem details with a stable `code`.
      headers:
        X-Request-Id:
          schema:
            type: string
        WWW-Authenticate:
          description: On 401, the accepted scheme (`Bearer`).
          schema:
            type: string
        Allow:
          description: On 405, the methods the resource supports.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as application/problem+json. Clients
        translate by `code`. `code` is an open enum: clients must tolerate unknown values.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` unless documented.
          example: about:blank
        title:
          type: string
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          x-open-enum: true
          description: Stable machine-readable error code. Open enum.
          enum:
            - validation_failed
            - bad_request
            - unauthenticated
            - not_found
            - conflict
            - version_conflict
            - idempotency_mismatch
            - locked_period
            - insufficient_permission
            - reauth_required
            - mfa_required
            - invalid_grant
            - rate_limited
            - pack_error
            - site_offboarded
            - internal_error
            - csrf_failed
            - sms_unavailable
            - mail_unavailable
            - payload_too_large
            - method_not_allowed
            - unsupported_media_type
            - timeout
            - scan_unavailable
        detail:
          type: string
          description: Human-readable explanation, not for machine parsing.
        instance:
          type: string
          description: The request id (also in the `X-Request-Id` response header), for support and logs.
        request_id:
          type: string
          description: Same value as `instance`.
        errors:
          type: array
          description: Per-field errors (with `validation_failed`).
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: Dotted path of the offending request field, query or header parameter.
        code:
          type: string
          description: Field-level error code, for example `required`, `invalid`, `too_long`.
        params:
          type: object
          additionalProperties: true
          description: Values for the client message template, such as the maximum length.
    Money:
      type: object
      description: Integer minor units with an ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          example: 123450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TRY
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page.
    DiscoveryDocument:
      type: object
      description: Unauthenticated instance discovery document (overview section 6.8).
      required:
        - instance_id
        - instance_name
        - api_base_url
        - api_versions
        - server_version
        - sdk_version
        - min_app_version
        - auth_methods
        - push
        - packs
        - branding
        - relay_enrollment
      properties:
        instance_id:
          type: string
          format: uuid
          description: Stable for the life of the instance.
        instance_name:
          type: string
        api_base_url:
          type: string
          example: https://example.org/v1
        api_versions:
          type: array
          items:
            type: string
          example:
            - v1
        server_version:
          type: string
          example: 0.1.0
        sdk_version:
          type: string
          nullable: true
          description: Pack SDK version, null until packs exist.
        min_app_version:
          $ref: '#/components/schemas/MinAppVersion'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethod'
        push:
          $ref: '#/components/schemas/PushInfo'
        packs:
          type: array
          items:
            type: string
        branding:
          $ref: '#/components/schemas/Branding'
        relay_enrollment:
          $ref: '#/components/schemas/RelayEnrollment'
    MinAppVersion:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          example: 1.0.0
        ios:
          type: string
          example: 1.0.0
    AuthMethod:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Open string. Known: `password`, `sms_otp`, `magic_link`, `oidc:<provider>`.
          x-known-values:
            - password
            - sms_otp
            - magic_link
            - oidc:<provider>
        label_key:
          type: string
        icon:
          type: string
    PushInfo:
      type: object
      required:
        - relay_ids
        - unified_push
      properties:
        relay_ids:
          type: array
          items:
            type: string
        unified_push:
          type: boolean
    Branding:
      type: object
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#1a73e8'
    RelayEnrollment:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string
          nullable: true
          description: Ephemeral challenge for push relay enrollment; null when not enrolling.
    InstancePolicies:
      type: object
      description: Instance policies. Empty until later phases add some.
      additionalProperties: true
    Instance:
      description: Authenticated twin of the discovery document, with policies.
      allOf:
        - $ref: '#/components/schemas/DiscoveryDocument'
        - type: object
          required:
            - policies
          properties:
            policies:
              $ref: '#/components/schemas/InstancePolicies'
    AuthUser:
      type: object
      description: The signed-in account (instance-wide, not per organization).
      required:
        - id
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: E.164.
        locale:
          type: string
          example: tr
        is_platform_admin:
          type: boolean
    Credentials:
      type: object
      required:
        - method
        - identifier
      description: |
        What the caller proves. `method` is `password`, `sms_otp` or
        `magic_link` (open on input; known values listed). `identifier` is an
        email address or a phone number (E.164 or national format). `password`
        is required for `password`; `code` is the six-digit SMS code for
        `sms_otp` (without it the server sends one). Field errors are reported
        for `identifier`, `password` and `code`.
      properties:
        method:
          type: string
          x-known-values:
            - password
            - sms_otp
            - magic_link
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        code:
          type: string
          maxLength: 16
          description: The code sent by SMS.
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes an emailed link use the `openbekci://` scheme.'
        device_name:
          type: string
          maxLength: 128
          description: Label of the session in the session list.
    SessionResponse:
      type: object
      description: A browser session was created; the token is in the `obk_session` cookie.
      required:
        - session_id
        - expires_at
        - user
      properties:
        session_id:
          type: string
          format: uuid
          description: Id of the session in `GET /v1/me/sessions`.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenResponse:
      type: object
      description: |
        A mobile or integration session. The access token is short-lived and
        checked on every request; the refresh token rotates on every use, and
        presenting a rotated one revokes the whole session.
      required:
        - token_type
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_id
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResult:
      type: object
      description: |
        Result of consuming a magic link. For `client=web` the token is in the
        `obk_session` cookie and `expires_at` is the session expiry; for
        `client=mobile` the token fields are present and `expires_at` is the
        access token expiry.
      required:
        - client
        - session_id
        - expires_at
        - user
      properties:
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Which kind of session was created (open enum).
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: Only for `client=mobile`.
        refresh_token:
          type: string
          description: Only for `client=mobile`.
        refresh_expires_at:
          type: string
          format: date-time
          description: Only for `client=mobile`.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 200
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 32
          description: E.164 or national format.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes the link use the `openbekci://` scheme instead of the web URL.'
    MagicLinkConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 200
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`web` sets the session cookie, `mobile` returns tokens.'
        device_name:
          type: string
          maxLength: 128
    ReauthPassword:
      type: object
      required:
        - method
        - password
      properties:
        method:
          type: string
          description: Always `password`.
        password:
          type: string
          maxLength: 256
    ReauthSmsOtp:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `sms_otp`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own phone by `auth.requestOtp`.
    ReauthRequest:
      oneOf:
        - $ref: '#/components/schemas/ReauthPassword'
        - $ref: '#/components/schemas/ReauthSmsOtp'
        - $ref: '#/components/schemas/ReauthEmailCode'
      discriminator:
        propertyName: method
        mapping:
          password: '#/components/schemas/ReauthPassword'
          sms_otp: '#/components/schemas/ReauthSmsOtp'
          email_code: '#/components/schemas/ReauthEmailCode'
    ReauthResponse:
      type: object
      required:
        - reauth_until
      properties:
        reauth_until:
          type: string
          format: date-time
          description: End of the re-authentication window of this session (10 minutes).
    ChangePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    RoleGrant:
      type: object
      description: An active membership of the caller's person in the organization.
      required:
        - role
        - scope_type
        - scope_id
        - site_owned
      properties:
        role:
          type: string
          x-open-enum: true
          description: 'Open enum: org_admin, site_manager, board_member, auditor, accountant, staff, guard.'
          enum:
            - org_admin
            - site_manager
            - board_member
            - auditor
            - accountant
            - staff
            - guard
        scope_type:
          type: string
          x-open-enum: true
          description: Open enum.
          enum:
            - org
            - site
            - block
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: The site or block id; null for `org` scope.
        site_owned:
          type: boolean
    OrgAccess:
      type: object
      required:
        - id
        - slug
        - name
        - default_locale
        - roles
        - permissions
        - sites
      properties:
        default_locale:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        permissions:
          type: array
          description: Effective permissions in this organization, from the caller's active memberships and the role to permission matrix.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        sites:
          type: array
          description: Sites of the organization the caller can see (empty until the tenancy module lands).
          items:
            $ref: '#/components/schemas/MeSite'
    Me:
      type: object
      required:
        - user
        - organizations
        - occupancies
        - policies
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrgAccess'
        occupancies:
          type: array
          description: The caller's unit occupancies (owner, tenant, household); empty until the people module lands.
          items:
            type: object
            additionalProperties: true
        policies:
          type: object
          additionalProperties: true
    Session:
      type: object
      description: One open session of the caller. Mobile sessions keep their id across token rotation.
      required:
        - id
        - client
        - device_name
        - ip
        - user_agent
        - created_at
        - last_used_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Open enum.
        device_name:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
          description: Address the session was created from.
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session that made this request.
    SessionList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          nullable: true
          description: Always null; the list is short and returned whole.
    MeUser:
      type: object
      description: The signed-in account as `GET /v1/me` shows it.
      required:
        - id
        - display_name
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The name of the person linked to the account (first organization), else the email or phone.
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        locale:
          type: string
        is_platform_admin:
          type: boolean
    PermissionGrant:
      type: object
      description: |
        An effective permission. Without `site_ids` and `block_ids` it holds
        organization-wide; otherwise only for the listed sites and blocks.
      required:
        - permission
      properties:
        permission:
          $ref: '#/components/schemas/Permission'
        site_ids:
          type: array
          items:
            type: string
            format: uuid
        block_ids:
          type: array
          items:
            type: string
            format: uuid
    MeSite:
      type: object
      required:
        - id
        - name
        - timezone
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
    Permission:
      type: string
      x-open-enum: true
      description: 'Open enum: every permission a role can hold (backend plan section 7).'
      enum:
        - audit.read
        - audit.report
        - files.manage
        - files.read
        - files.upload
        - me.read
        - org.manage
        - org.read
        - platform.manage
        - sessions.manage_own
    Organization:
      type: object
      required:
        - id
        - slug
        - name
        - status
        - country_code
        - default_locale
        - timezone
