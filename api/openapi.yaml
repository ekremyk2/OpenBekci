openapi: 3.0.3
info:
  title: OpenBekci API
  version: 0.1.0
  description: |
    HTTP API of an OpenBekci instance (residential site management).
    Conventions: see api/README.md. /v1 is not frozen until 1.0.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
paths:
  /.well-known/openbekci.json:
    get:
      operationId: instance.getDiscovery
      summary: Instance discovery document
      description: Unauthenticated; used by apps to find the API and the available login methods.
      tags:
        - instance
      security: []
      x-stability: stable
      responses:
        '200':
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instance:
    get:
      operationId: instance.getInstance
      summary: Instance information (authenticated)
      tags:
        - instance
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-stability: stable
      x-openbekci-roles:
        any_authenticated: []
      responses:
        '200':
          description: The discovery document plus policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/session:
    post:
      operationId: auth.createSession
      summary: Sign in and start a browser session
      description: |
        `method` is `password`, `sms_otp` or `magic_link`; `identifier` is the
        email address or phone number. For `password` and for `sms_otp` with a
        `code` this verifies the credentials and sets the session cookie `obk_session`
        (httpOnly, SameSite=Lax, Secure except in development). `sms_otp` without
        `code` sends a code by SMS and `magic_link` emails a link (`client`
        selects the web or `openbekci://` link); both answer 202 whether or not
        the account exists. Wrong credentials
        of any kind answer 401 `invalid_grant`; repeated failures lock the
        identifier out (429 `rate_limited` with `Retry-After`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in. The cookie is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '202':
          description: A code or link was sent if the account exists. No body.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: auth.deleteSession
      summary: Sign out the current session
      description: Revokes the current session and clears the cookie (same as `DELETE /v1/me/sessions/current`).
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token:
    post:
      operationId: auth.createToken
      summary: Sign in and get access and refresh tokens (mobile, integrations)
      description: |
        Same credentials as `auth.createSession` (`password`, or `sms_otp` with a `code`; no `magic_link`), but returns opaque tokens
        instead of a cookie: an access token (15 minutes) for `Authorization:
        Bearer` and a rotating refresh token (60 days).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/token/refresh:
    post:
      operationId: auth.refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        The refresh token is single use: the response carries a new one. Presenting
        a refresh token that was already used revokes the whole session (the
        family) and answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/otp:
    post:
      operationId: auth.requestOtp
      summary: Send a sign-in code by SMS
      description: |
        Sends a six-digit code (valid 5 minutes, 5 attempts) when an account has
        this phone number. The answer is the same whether or not it does.
        503 `sms_unavailable` when the instance has no SMS gateway. Limited per
        phone number and per client address (429 `rate_limited`).
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Accepted; a code was sent if the number is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link:
    post:
      operationId: auth.requestMagicLink
      summary: Email a single-use sign-in link
      description: |
        Emails a link valid for 15 minutes when an account has this address. The
        answer is the same whether or not it does. The link is
        `{BASE_URL}/login/magic?token=...`, or `openbekci://login/magic?token=...`
        for `client=mobile`. 503 `mail_unavailable` when the instance has no email
        configuration. Limited per address and per client address.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Accepted; a link was sent if the address is registered.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/magic-link/consume:
    post:
      operationId: auth.consumeMagicLink
      summary: Sign in with a magic-link token
      description: |
        Exchanges the token from a magic link (single use) for a session: a cookie
        for `client=web`, tokens for `client=mobile`. An unknown, used or expired
        token answers 401 `invalid_grant`.
      tags:
        - auth
      security: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsumeRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth:
    post:
      operationId: auth.reauth
      summary: Re-authenticate the current session for sensitive operations
      description: |
        Proves the caller is still the user with the password or a fresh SMS code,
        and marks the current session as re-authenticated for 10 minutes. Sensitive
        operations answer 403 `reauth_required` outside that window.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/password:
    post:
      operationId: auth.changePassword
      summary: Set or change the password
      description: |
        Requires a recent re-authentication (`auth.reauth`, else 403
        `reauth_required`). The password must have at least 10 characters. Every
        other session of the user is signed out.
      tags:
        - auth
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: me.get
      summary: The signed-in user, organizations, roles and permissions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions:
    get:
      operationId: me.listSessions
      summary: List the caller's open sessions
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Open sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: me.revokeAllSessions
      summary: Sign out everywhere
      description: Revokes every session of the caller, the current one included.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      responses:
        '204':
          description: All sessions were revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/sessions/{id}:
    delete:
      operationId: me.revokeSession
      summary: Sign out one session
      description: |
        Revokes the session with this id (from `me.listSessions`), or the current
        one for `current` (log out). For a mobile session the refresh token and
        every access token of the session are revoked.
      tags:
        - me
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-idempotent: optional
      parameters:
        - name: id
          in: path
          required: true
          description: A session id, or `current`.
          schema:
            type: string
            pattern: ^(current|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      responses:
        '204':
          description: The session was revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: obk_session
      description: Browser session cookie issued by the login endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (mobile app sessions, later API keys).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays within 7 days return the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Problem:
      description: Error. RFC 9457 problem details with a stable `code`.
      headers:
        X-Request-Id:
          schema:
            type: string
        WWW-Authenticate:
          description: On 401, the accepted scheme (`Bearer`).
          schema:
            type: string
        Allow:
          description: On 405, the methods the resource supports.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as application/problem+json. Clients
        translate by `code`. `code` is an open enum: clients must tolerate unknown values.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` unless documented.
          example: about:blank
        title:
          type: string
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          x-open-enum: true
          description: Stable machine-readable error code. Open enum.
          enum:
            - validation_failed
            - bad_request
            - unauthenticated
            - not_found
            - conflict
            - version_conflict
            - idempotency_mismatch
            - locked_period
            - insufficient_permission
            - reauth_required
            - mfa_required
            - invalid_grant
            - rate_limited
            - pack_error
            - site_offboarded
            - internal_error
            - csrf_failed
            - sms_unavailable
            - mail_unavailable
            - payload_too_large
            - method_not_allowed
            - unsupported_media_type
            - timeout
        detail:
          type: string
          description: Human-readable explanation, not for machine parsing.
        instance:
          type: string
          description: The request id (also in the `X-Request-Id` response header), for support and logs.
        request_id:
          type: string
          description: Same value as `instance`.
        errors:
          type: array
          description: Per-field errors (with `validation_failed`).
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: Dotted path of the offending request field, query or header parameter.
        code:
          type: string
          description: Field-level error code, for example `required`, `invalid`, `too_long`.
        params:
          type: object
          additionalProperties: true
          description: Values for the client message template, such as the maximum length.
    Money:
      type: object
      description: Integer minor units with an ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          example: 123450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TRY
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page.
    DiscoveryDocument:
      type: object
      description: Unauthenticated instance discovery document (overview section 6.8).
      required:
        - instance_id
        - instance_name
        - api_base_url
        - api_versions
        - server_version
        - sdk_version
        - min_app_version
        - auth_methods
        - push
        - packs
        - branding
        - relay_enrollment
      properties:
        instance_id:
          type: string
          format: uuid
          description: Stable for the life of the instance.
        instance_name:
          type: string
        api_base_url:
          type: string
          example: https://example.org/v1
        api_versions:
          type: array
          items:
            type: string
          example:
            - v1
        server_version:
          type: string
          example: 0.1.0
        sdk_version:
          type: string
          nullable: true
          description: Pack SDK version, null until packs exist.
        min_app_version:
          $ref: '#/components/schemas/MinAppVersion'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethod'
        push:
          $ref: '#/components/schemas/PushInfo'
        packs:
          type: array
          items:
            type: string
        branding:
          $ref: '#/components/schemas/Branding'
        relay_enrollment:
          $ref: '#/components/schemas/RelayEnrollment'
    MinAppVersion:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          example: 1.0.0
        ios:
          type: string
          example: 1.0.0
    AuthMethod:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Open string. Known: `password`, `sms_otp`, `magic_link`, `oidc:<provider>`.
          x-known-values:
            - password
            - sms_otp
            - magic_link
            - oidc:<provider>
        label_key:
          type: string
        icon:
          type: string
    PushInfo:
      type: object
      required:
        - relay_ids
        - unified_push
      properties:
        relay_ids:
          type: array
          items:
            type: string
        unified_push:
          type: boolean
    Branding:
      type: object
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#1a73e8'
    RelayEnrollment:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string
          nullable: true
          description: Ephemeral challenge for push relay enrollment; null when not enrolling.
    InstancePolicies:
      type: object
      description: Instance policies. Empty until later phases add some.
      additionalProperties: true
    Instance:
      description: Authenticated twin of the discovery document, with policies.
      allOf:
        - $ref: '#/components/schemas/DiscoveryDocument'
        - type: object
          required:
            - policies
          properties:
            policies:
              $ref: '#/components/schemas/InstancePolicies'
    AuthUser:
      type: object
      description: The signed-in account (instance-wide, not per organization).
      required:
        - id
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: E.164.
        locale:
          type: string
          example: tr
        is_platform_admin:
          type: boolean
    Credentials:
      type: object
      required:
        - method
        - identifier
      description: |
        What the caller proves. `method` is `password`, `sms_otp` or
        `magic_link` (open on input; known values listed). `identifier` is an
        email address or a phone number (E.164 or national format). `password`
        is required for `password`; `code` is the six-digit SMS code for
        `sms_otp` (without it the server sends one). Field errors are reported
        for `identifier`, `password` and `code`.
      properties:
        method:
          type: string
          x-known-values:
            - password
            - sms_otp
            - magic_link
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        code:
          type: string
          maxLength: 16
          description: The code sent by SMS.
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes an emailed link use the `openbekci://` scheme.'
        device_name:
          type: string
          maxLength: 128
          description: Label of the session in the session list.
    SessionResponse:
      type: object
      description: A browser session was created; the token is in the `obk_session` cookie.
      required:
        - session_id
        - expires_at
        - user
      properties:
        session_id:
          type: string
          format: uuid
          description: Id of the session in `GET /v1/me/sessions`.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenResponse:
      type: object
      description: |
        A mobile or integration session. The access token is short-lived and
        checked on every request; the refresh token rotates on every use, and
        presenting a rotated one revokes the whole session.
      required:
        - token_type
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_id
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResult:
      type: object
      description: |
        Result of consuming a magic link. For `client=web` the token is in the
        `obk_session` cookie and `expires_at` is the session expiry; for
        `client=mobile` the token fields are present and `expires_at` is the
        access token expiry.
      required:
        - client
        - session_id
        - expires_at
        - user
      properties:
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Which kind of session was created (open enum).
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: Only for `client=mobile`.
        refresh_token:
          type: string
          description: Only for `client=mobile`.
        refresh_expires_at:
          type: string
          format: date-time
          description: Only for `client=mobile`.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 200
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 32
          description: E.164 or national format.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes the link use the `openbekci://` scheme instead of the web URL.'
    MagicLinkConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 200
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`web` sets the session cookie, `mobile` returns tokens.'
        device_name:
          type: string
          maxLength: 128
    ReauthPassword:
      type: object
      required:
        - method
        - password
      properties:
        method:
          type: string
          description: Always `password`.
        password:
          type: string
          maxLength: 256
    ReauthSmsOtp:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `sms_otp`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own phone by `auth.requestOtp`.
    ReauthRequest:
      oneOf:
        - $ref: '#/components/schemas/ReauthPassword'
        - $ref: '#/components/schemas/ReauthSmsOtp'
      discriminator:
        propertyName: method
        mapping:
          password: '#/components/schemas/ReauthPassword'
          sms_otp: '#/components/schemas/ReauthSmsOtp'
    ReauthResponse:
      type: object
      required:
        - reauth_until
      properties:
        reauth_until:
          type: string
          format: date-time
          description: End of the re-authentication window of this session (10 minutes).
    ChangePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    RoleGrant:
      type: object
      description: An active membership of the caller's person in the organization.
      required:
        - role
        - scope_type
        - scope_id
        - site_owned
      properties:
        role:
          type: string
          x-open-enum: true
          description: 'Open enum: org_admin, site_manager, board_member, auditor, accountant, staff, guard.'
          enum:
            - org_admin
            - site_manager
            - board_member
            - auditor
            - accountant
            - staff
            - guard
        scope_type:
          type: string
          x-open-enum: true
          description: Open enum.
          enum:
            - org
            - site
            - block
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: The site or block id; null for `org` scope.
        site_owned:
          type: boolean
    OrgAccess:
      type: object
      required:
        - id
        - slug
        - name
        - default_locale
        - roles
        - permissions
        - sites
      properties:
        default_locale:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        permissions:
          type: array
          description: Effective permissions in this organization (filled by the authorization module; empty until then).
          items:
            $ref: '#/components/schemas/PermissionGrant'
        sites:
          type: array
          description: Sites of the organization the caller can see (empty until the tenancy module lands).
          items:
            $ref: '#/components/schemas/MeSite'
    Me:
      type: object
      required:
        - user
        - organizations
        - occupancies
        - policies
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrgAccess'
        occupancies:
          type: array
          description: The caller's unit occupancies across organizations (owner, tenant, household; former ones only inside their dates). Empty until the people module lands.
          items:
            $ref: '#/components/schemas/MeOccupancy'
        policies:
          $ref: '#/components/schemas/MePolicies'
    MeOccupancy:
      type: object
      description: One unit occupancy of the caller, enough for the web and mobile apps to build their unit switcher and decide what to show at boot.
      required:
        - id
        - org_id
        - site_id
        - unit_id
        - unit_label
        - kind
        - side
        - may_see_money
        - valid_from
        - valid_to
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        unit_label:
          type: string
          description: What people say, for example `A Blok D:12`.
        kind:
          type: string
          description: Open enum.
          enum:
            - owner
            - tenant
            - household
            - former_occupant
          x-open-enum: true
        side:
          type: string
          nullable: true
          description: The debtor side the occupant belongs to (`owner` or `tenant`); null for household members. Open enum.
          enum:
            - owner
            - tenant
          x-open-enum: true
        may_see_money:
          type: boolean
          description: Always true for owners and tenants; for household members whether the owner or tenant granted money visibility (S3).
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
          description: Null while the occupancy is current.
      example:
        id: 0192a3f0-1000-7000-8000-000000000005
        org_id: 0192a3f0-1000-7000-8000-000000000001
        site_id: 0192a3f0-1000-7000-8000-000000000002
        unit_id: 0192a3f0-1000-7000-8000-000000000003
        unit_label: A Blok D:12
        kind: tenant
        side: tenant
        may_see_money: true
        valid_from: '2025-09-01'
        valid_to: null
    MePolicies:
      type: object
      description: Instance policies that apply to the signed-in user, so clients can enforce them without a second call.
      required:
        - app_lock_required
        - reauth_window_minutes
      properties:
        app_lock_required:
          type: boolean
          description: The mobile app must be protected by a device lock (biometrics or passcode) before it shows money or personal data.
        reauth_window_minutes:
          type: integer
          format: int64
          description: How long a re-authentication (`POST /v1/auth/reauth`) stays valid for sensitive operations (default 10).
      example:
        app_lock_required: false
        reauth_window_minutes: 10
    Session:
      type: object
      description: One open session of the caller. Mobile sessions keep their id across token rotation.
      required:
        - id
        - client
        - device_name
        - ip
        - user_agent
        - created_at
        - last_used_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Open enum.
        device_name:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
          description: Address the session was created from.
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session that made this request.
      example:
        id: 0192a3f0-1000-7000-8000-000000000002
        client: web
        device_name: null
        ip: null
        user_agent: null
        created_at: '2026-03-01T09:00:00Z'
        last_used_at: null
        expires_at: '2026-03-01T09:00:00Z'
        current: false
    SessionList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          nullable: true
          description: Always null; the list is short and returned whole.
      example:
        items:
          - id: 0192a3f0-1000-7000-8000-000000000002
            client: web
            device_name: null
            ip: null
            user_agent: null
            created_at: '2026-03-01T09:00:00Z'
            last_used_at: null
            expires_at: '2026-03-01T09:00:00Z'
            current: false
        next_cursor: null
    MeUser:
      type: object
      description: The signed-in account as `GET /v1/me` shows it.
      required:
        - id
        - display_name
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The name of the person linked to the account (first organization), else the email or phone.
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        locale:
          type: string
        is_platform_admin:
          type: boolean
    PermissionGrant:
      type: object
      description: An effective permission, optionally limited to sites or blocks.
      required:
        - permission
      properties:
        permission:
          type: string
        site_ids:
          type: array
          items:
            type: string
            format: uuid
        block_ids:
          type: array
          items:
            type: string
            format: uuid
    MeSite:
      type: object
      required:
        - id
        - name
        - timezone
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
