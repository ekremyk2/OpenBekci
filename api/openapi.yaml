              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: obk_session
      description: Browser session cookie issued by the login endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (mobile app sessions, later API keys).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays within 7 days return the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DryRun:
      name: dry_run
      in: query
      description: When true, validate and return the row-level report without saving anything.
      schema:
        type: boolean
        default: false
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (8..128 chars); mandatory on this operation. A replay within 7 days returns the stored response; the same key with a different request is 422 `idempotency_mismatch`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the resource the client last read, as a quoted integer (`"3"`). A stale value is 409 `version_conflict`; a missing one is 422 `validation_failed`.
      schema:
        type: string
        example: '"3"'
    OrgId:
      name: org_id
      in: path
      required: true
      description: Organization id.
      schema:
        type: string
        format: uuid
    SiteId:
      name: site_id
      in: query
      description: 'Restrict to one site. Omitted: all sites the caller may see in the organization.'
      schema:
        type: string
        format: uuid
    SiteIdRequired:
      name: site_id
      in: query
      required: true
      description: The site this resource belongs to.
      schema:
        type: string
        format: uuid
    Format:
      name: format
      in: query
      description: 'Representation: `json` (default), or a download as `csv`, `xlsx` or `pdf` where the operation offers it.'
      schema:
        type: string
        enum:
          - json
          - csv
          - xlsx
          - pdf
        default: json
  responses:
    Problem:
      description: Error. RFC 9457 problem details with a stable `code`.
      headers:
        X-Request-Id:
          schema:
            type: string
        WWW-Authenticate:
          description: On 401, the accepted scheme (`Bearer`).
          schema:
            type: string
        Allow:
          description: On 405, the methods the resource supports.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as application/problem+json. Clients
        translate by `code`. `code` is an open enum: clients must tolerate unknown values.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` unless documented.
          example: about:blank
        title:
          type: string
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          x-open-enum: true
          description: Stable machine-readable error code. Open enum.
          enum:
            - validation_failed
            - bad_request
            - unauthenticated
            - not_found
            - conflict
            - version_conflict
            - idempotency_mismatch
            - locked_period
            - insufficient_permission
            - reauth_required
            - mfa_required
            - invalid_grant
            - rate_limited
            - pack_error
            - site_offboarded
            - internal_error
            - csrf_failed
            - sms_unavailable
            - mail_unavailable
            - payload_too_large
            - method_not_allowed
            - unsupported_media_type
            - timeout
        detail:
          type: string
          description: Human-readable explanation, not for machine parsing.
        instance:
          type: string
          description: The request id (also in the `X-Request-Id` response header), for support and logs.
        request_id:
          type: string
          description: Same value as `instance`.
        errors:
          type: array
          description: Per-field errors (with `validation_failed`).
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: Dotted path of the offending request field, query or header parameter.
        code:
          type: string
          description: Field-level error code, for example `required`, `invalid`, `too_long`.
        params:
          type: object
          additionalProperties: true
          description: Values for the client message template, such as the maximum length.
    Money:
      type: object
      description: Integer minor units with an ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          example: 123450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TRY
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page.
    DiscoveryDocument:
      type: object
      description: Unauthenticated instance discovery document (overview section 6.8).
      required:
        - instance_id
        - instance_name
        - api_base_url
        - api_versions
        - server_version
        - sdk_version
        - min_app_version
        - auth_methods
        - push
        - packs
        - branding
        - relay_enrollment
      properties:
        instance_id:
          type: string
          format: uuid
          description: Stable for the life of the instance.
        instance_name:
          type: string
        api_base_url:
          type: string
          example: https://example.org/v1
        api_versions:
          type: array
          items:
            type: string
          example:
            - v1
        server_version:
          type: string
          example: 0.1.0
        sdk_version:
          type: string
          nullable: true
          description: Pack SDK version, null until packs exist.
        min_app_version:
          $ref: '#/components/schemas/MinAppVersion'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethod'
        push:
          $ref: '#/components/schemas/PushInfo'
        packs:
          type: array
          items:
            type: string
        branding:
          $ref: '#/components/schemas/Branding'
        relay_enrollment:
          $ref: '#/components/schemas/RelayEnrollment'
    MinAppVersion:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          example: 1.0.0
        ios:
          type: string
          example: 1.0.0
    AuthMethod:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Open string. Known: `password`, `sms_otp`, `magic_link`, `oidc:<provider>`.
          x-known-values:
            - password
            - sms_otp
            - magic_link
            - oidc:<provider>
        label_key:
          type: string
        icon:
          type: string
    PushInfo:
      type: object
      required:
        - relay_ids
        - unified_push
      properties:
        relay_ids:
          type: array
          items:
            type: string
        unified_push:
          type: boolean
    Branding:
      type: object
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#1a73e8'
    RelayEnrollment:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string
          nullable: true
          description: Ephemeral challenge for push relay enrollment; null when not enrolling.
    InstancePolicies:
      type: object
      description: Instance policies. Empty until later phases add some.
      additionalProperties: true
    Instance:
      description: Authenticated twin of the discovery document, with policies.
      allOf:
        - $ref: '#/components/schemas/DiscoveryDocument'
        - type: object
          required:
            - policies
          properties:
            policies:
              $ref: '#/components/schemas/InstancePolicies'
    AuthUser:
      type: object
      description: The signed-in account (instance-wide, not per organization).
      required:
        - id
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: E.164.
        locale:
          type: string
          example: tr
        is_platform_admin:
          type: boolean
    Credentials:
      type: object
      required:
        - method
        - identifier
      description: |
        What the caller proves. `method` is `password`, `sms_otp` or
        `magic_link` (open on input; known values listed). `identifier` is an
        email address or a phone number (E.164 or national format). `password`
        is required for `password`; `code` is the six-digit SMS code for
        `sms_otp` (without it the server sends one). Field errors are reported
        for `identifier`, `password` and `code`.
      properties:
        method:
          type: string
          x-known-values:
            - password
            - sms_otp
            - magic_link
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        code:
          type: string
          maxLength: 16
          description: The code sent by SMS.
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes an emailed link use the `openbekci://` scheme.'
        device_name:
          type: string
          maxLength: 128
          description: Label of the session in the session list.
    SessionResponse:
      type: object
      description: A browser session was created; the token is in the `obk_session` cookie.
      required:
        - session_id
        - expires_at
        - user
      properties:
        session_id:
          type: string
          format: uuid
          description: Id of the session in `GET /v1/me/sessions`.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenResponse:
      type: object
      description: |
        A mobile or integration session. The access token is short-lived and
        checked on every request; the refresh token rotates on every use, and
        presenting a rotated one revokes the whole session.
      required:
        - token_type
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_id
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResult:
      type: object
      description: |
        Result of consuming a magic link. For `client=web` the token is in the
        `obk_session` cookie and `expires_at` is the session expiry; for
        `client=mobile` the token fields are present and `expires_at` is the
        access token expiry.
      required:
        - client
        - session_id
        - expires_at
        - user
      properties:
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Which kind of session was created (open enum).
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: Only for `client=mobile`.
        refresh_token:
          type: string
          description: Only for `client=mobile`.
        refresh_expires_at:
          type: string
          format: date-time
          description: Only for `client=mobile`.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 200
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 32
          description: E.164 or national format.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes the link use the `openbekci://` scheme instead of the web URL.'
    MagicLinkConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 200
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`web` sets the session cookie, `mobile` returns tokens.'
        device_name:
          type: string
          maxLength: 128
    ReauthPassword:
      type: object
      required:
        - method
        - password
      properties:
        method:
          type: string
          description: Always `password`.
        password:
          type: string
          maxLength: 256
    ReauthSmsOtp:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `sms_otp`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own phone by `auth.requestOtp`.
    ReauthRequest:
      oneOf:
        - $ref: '#/components/schemas/ReauthPassword'
        - $ref: '#/components/schemas/ReauthSmsOtp'
        - $ref: '#/components/schemas/ReauthEmailCode'
      discriminator:
        propertyName: method
        mapping:
          password: '#/components/schemas/ReauthPassword'
          sms_otp: '#/components/schemas/ReauthSmsOtp'
          email_code: '#/components/schemas/ReauthEmailCode'
    ReauthResponse:
      type: object
      required:
        - reauth_until
      properties:
        reauth_until:
          type: string
          format: date-time
          description: End of the re-authentication window of this session (10 minutes).
    ChangePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    RoleGrant:
      type: object
      description: An active membership of the caller's person in the organization.
      required:
        - role
        - scope_type
        - scope_id
        - site_owned
      properties:
        role:
          type: string
          x-open-enum: true
          description: 'Open enum: org_admin, site_manager, board_member, auditor, accountant, staff, guard.'
          enum:
            - org_admin
            - site_manager
            - board_member
            - auditor
            - accountant
            - staff
            - guard
        scope_type:
          type: string
          x-open-enum: true
          description: Open enum.
          enum:
            - org
            - site
            - block
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: The site or block id; null for `org` scope.
        site_owned:
          type: boolean
    OrgAccess:
      type: object
      required:
        - id
        - slug
        - name
        - default_locale
        - roles
        - permissions
        - sites
      properties:
        default_locale:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        permissions:
          type: array
          description: Effective permissions in this organization, from the caller's active memberships and the role to permission matrix.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        sites:
          type: array
          description: Sites of the organization the caller can see through a membership or an occupancy.
          items:
            $ref: '#/components/schemas/MeSite'
    Me:
      type: object
      required:
        - user
        - organizations
        - occupancies
        - policies
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrgAccess'
        occupancies:
          type: array
          description: The caller's unit occupancies across organizations (owner, tenant, household; former ones only inside their dates). Empty until the people module lands.
          items:
            $ref: '#/components/schemas/MeOccupancy'
        policies:
          $ref: '#/components/schemas/MePolicies'
    Session:
      type: object
      description: One open session of the caller. Mobile sessions keep their id across token rotation.
      required:
        - id
        - client
        - device_name
        - ip
        - user_agent
        - created_at
        - last_used_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Open enum.
        device_name:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
          description: Address the session was created from.
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session that made this request.
      example:
        id: 0192a3f0-1000-7000-8000-000000000002
        client: web
        device_name: null
        ip: null
        user_agent: null
        created_at: '2026-03-01T09:00:00Z'
        last_used_at: null
        expires_at: '2026-03-01T09:00:00Z'
        current: false
    SessionList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          nullable: true
          description: Always null; the list is short and returned whole.
      example:
        items:
          - id: 0192a3f0-1000-7000-8000-000000000002
            client: web
            device_name: null
            ip: null
            user_agent: null
            created_at: '2026-03-01T09:00:00Z'
            last_used_at: null
            expires_at: '2026-03-01T09:00:00Z'
            current: false
        next_cursor: null
    MeUser:
      type: object
      description: The signed-in account as `GET /v1/me` shows it.
      required:
        - id
        - display_name
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The name of the person linked to the account (first organization), else the email or phone.
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        locale:
          type: string
        is_platform_admin:
          type: boolean
    PermissionGrant:
      type: object
      description: |
        An effective permission. Without `site_ids` and `block_ids` it holds
        organization-wide; otherwise only for the listed sites and blocks.
      required:
        - permission
      properties:
        permission:
          $ref: '#/components/schemas/Permission'
        site_ids:
          type: array
          items:
            type: string
            format: uuid
        block_ids:
          type: array
          items:
            type: string
            format: uuid
    MeSite:
      type: object
      required:
        - id
        - name
        - timezone
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
    Permission:
      type: string
      x-open-enum: true
      description: 'Open enum: every permission a role can hold (backend plan section 7).'
      enum:
        - audit.read
        - audit.report
        - claims.decide
        - codes.read
        - collections.manage
        - directory.read
        - exports.create
        - invitations.household
        - invitations.manage
        - jobs.read
        - me.manage
        - me.read
        - memberships.manage
        - memberships.read
        - money.lock
        - money.manage
        - money.post
        - money.read
        - occupancies.grant_money
        - occupancies.household
        - occupancies.manage
        - occupancies.read
        - org.manage
