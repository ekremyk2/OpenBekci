components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: obk_session
      description: Browser session cookie issued by the login endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (mobile app sessions, later API keys).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays within 7 days return the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    OrgId:
      name: org_id
      in: path
      required: true
      description: The organization id.
      schema:
        type: string
        format: uuid
    OrgId-2:
      name: org_id
      in: path
      required: true
      description: Organization id.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: |
        The resource's `version` (as sent in `ETag` or the `version` field), optionally quoted (`"3"`). Required: without it the answer is 422
        `validation_failed`; a stale value is 409 `version_conflict`. Declared optional only so an unauthenticated caller gets 401 first
        (served convention; the draft declared it required).
      schema:
        type: string
        example: '"3"'
    SiteIdRequired:
      name: site_id
      in: query
      description: 'The site this resource belongs to. Required: without it the answer is 422 validation_failed (declared optional so an unauthenticated caller gets 401 first).'
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      description: 'Client-generated unique key (8..128 chars); mandatory on this operation (`x-idempotent: required`, enforced by the request pipeline after authentication, so an unauthenticated caller gets 401 first). A replay within 7 days returns the stored response; the same key with a different request is 422 `idempotency_mismatch`.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DryRun:
      name: dry_run
      in: query
      description: When true, validate and return the row-level report without saving anything.
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: Error. RFC 9457 problem details with a stable `code`.
      headers:
        X-Request-Id:
          schema:
            type: string
        WWW-Authenticate:
          description: On 401, the accepted scheme (`Bearer`).
          schema:
            type: string
        Allow:
          description: On 405, the methods the resource supports.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as application/problem+json. Clients
        translate by `code`. `code` is an open enum: clients must tolerate unknown values.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` unless documented.
          example: about:blank
        title:
          type: string
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          x-open-enum: true
          description: Stable machine-readable error code. Open enum.
          enum:
            - validation_failed
            - bad_request
            - unauthenticated
            - not_found
            - conflict
            - version_conflict
            - idempotency_mismatch
            - locked_period
            - insufficient_permission
            - reauth_required
            - mfa_required
            - invalid_grant
            - rate_limited
            - pack_error
            - site_offboarded
            - internal_error
            - csrf_failed
            - sms_unavailable
            - mail_unavailable
            - payload_too_large
            - method_not_allowed
            - unsupported_media_type
            - timeout
        detail:
          type: string
          description: Human-readable explanation, not for machine parsing.
        instance:
          type: string
          description: The request id (also in the `X-Request-Id` response header), for support and logs.
        request_id:
          type: string
          description: Same value as `instance`.
        errors:
          type: array
          description: Per-field errors (with `validation_failed`).
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: Dotted path of the offending request field, query or header parameter.
        code:
          type: string
          description: Field-level error code, for example `required`, `invalid`, `too_long`.
        params:
          type: object
          additionalProperties: true
          description: Values for the client message template, such as the maximum length.
    Money:
      type: object
      description: Integer minor units with an ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          example: 123450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TRY
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page.
    DiscoveryDocument:
      type: object
      description: Unauthenticated instance discovery document (overview section 6.8).
      required:
        - instance_id
        - instance_name
        - api_base_url
        - api_versions
        - server_version
        - sdk_version
        - min_app_version
        - auth_methods
        - push
        - packs
        - branding
        - relay_enrollment
      properties:
        instance_id:
          type: string
          format: uuid
          description: Stable for the life of the instance.
        instance_name:
          type: string
        api_base_url:
          type: string
          example: https://example.org/v1
        api_versions:
          type: array
          items:
            type: string
          example:
            - v1
        server_version:
          type: string
          example: 0.1.0
        sdk_version:
          type: string
          nullable: true
          description: Pack SDK version, null until packs exist.
        min_app_version:
          $ref: '#/components/schemas/MinAppVersion'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethod'
        push:
          $ref: '#/components/schemas/PushInfo'
        packs:
          type: array
          items:
            type: string
        branding:
          $ref: '#/components/schemas/Branding'
        relay_enrollment:
          $ref: '#/components/schemas/RelayEnrollment'
    MinAppVersion:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          example: 1.0.0
        ios:
          type: string
          example: 1.0.0
    AuthMethod:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Open string. Known: `password`, `sms_otp`, `magic_link`, `oidc:<provider>`.
          x-known-values:
            - password
            - sms_otp
            - magic_link
            - oidc:<provider>
        label_key:
          type: string
        icon:
          type: string
    PushInfo:
      type: object
      required:
        - relay_ids
        - unified_push
      properties:
        relay_ids:
          type: array
          items:
            type: string
        unified_push:
          type: boolean
    Branding:
      type: object
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#1a73e8'
    RelayEnrollment:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string
          nullable: true
          description: Ephemeral challenge for push relay enrollment; null when not enrolling.
    InstancePolicies:
      type: object
      description: Instance policies. Empty until later phases add some.
      additionalProperties: true
    Instance:
      description: Authenticated twin of the discovery document, with policies.
      allOf:
        - $ref: '#/components/schemas/DiscoveryDocument'
        - type: object
          required:
            - policies
          properties:
            policies:
              $ref: '#/components/schemas/InstancePolicies'
    AuthUser:
      type: object
      description: The signed-in account (instance-wide, not per organization).
      required:
        - id
        - email
        - phone
        - locale
        - is_platform_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: E.164.
        locale:
          type: string
          example: tr
        is_platform_admin:
          type: boolean
    Credentials:
      type: object
      required:
        - method
        - identifier
      description: |
        What the caller proves. `method` is `password`, `sms_otp` or
        `magic_link` (open on input; known values listed). `identifier` is an
        email address or a phone number (E.164 or national format). `password`
        is required for `password`; `code` is the six-digit SMS code for
        `sms_otp` (without it the server sends one). Field errors are reported
        for `identifier`, `password` and `code`.
      properties:
        method:
          type: string
          x-known-values:
            - password
            - sms_otp
            - magic_link
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        code:
          type: string
          maxLength: 16
          description: The code sent by SMS.
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes an emailed link use the `openbekci://` scheme.'
        device_name:
          type: string
          maxLength: 128
          description: Label of the session in the session list.
    SessionResponse:
      type: object
      description: A browser session was created; the token is in the `obk_session` cookie.
      required:
        - session_id
        - expires_at
        - user
      properties:
        session_id:
          type: string
          format: uuid
          description: Id of the session in `GET /v1/me/sessions`.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenResponse:
      type: object
      description: |
        A mobile or integration session. The access token is short-lived and
        checked on every request; the refresh token rotates on every use, and
        presenting a rotated one revokes the whole session.
      required:
        - token_type
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_id
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResult:
      type: object
      description: |
        Result of consuming a magic link. For `client=web` the token is in the
        `obk_session` cookie and `expires_at` is the session expiry; for
        `client=mobile` the token fields are present and `expires_at` is the
        access token expiry.
      required:
        - client
        - session_id
        - expires_at
        - user
      properties:
        client:
          type: string
          enum:
            - web
            - mobile
          x-open-enum: true
          description: Which kind of session was created (open enum).
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: Only for `client=mobile`.
        refresh_token:
          type: string
          description: Only for `client=mobile`.
        refresh_expires_at:
          type: string
          format: date-time
          description: Only for `client=mobile`.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 200
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 32
          description: E.164 or national format.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`mobile` makes the link use the `openbekci://` scheme instead of the web URL.'
    MagicLinkConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 200
        client:
          type: string
          enum:
            - web
            - mobile
          default: web
          description: '`web` sets the session cookie, `mobile` returns tokens.'
        device_name:
          type: string
          maxLength: 128
    ReauthPassword:
      type: object
      required:
        - method
        - password
      properties:
        method:
          type: string
          description: Always `password`.
        password:
          type: string
          maxLength: 256
    ReauthSmsOtp:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `sms_otp`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own phone by `auth.requestOtp`.
    ReauthRequest:
      oneOf:
        - $ref: '#/components/schemas/ReauthPassword'
        - $ref: '#/components/schemas/ReauthSmsOtp'
        - $ref: '#/components/schemas/ReauthEmailCode'
      discriminator:
        propertyName: method
        mapping:
          password: '#/components/schemas/ReauthPassword'
          sms_otp: '#/components/schemas/ReauthSmsOtp'
          email_code: '#/components/schemas/ReauthEmailCode'
    ReauthResponse:
      type: object
      required:
        - reauth_until
      properties:
        reauth_until:
          type: string
          format: date-time
          description: End of the re-authentication window of this session (10 minutes).
    ChangePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    RoleGrant:
      type: object
      description: An active membership of the caller's person in the organization.
      required:
        - role
        - scope_type
        - scope_id
        - site_owned
      properties:
        role:
          type: string
          x-open-enum: true
          description: 'Open enum: org_admin, site_manager, board_member, auditor, accountant, staff, guard.'
          enum:
            - org_admin
            - site_manager
            - board_member
            - auditor
            - accountant
            - staff
            - guard
        scope_type:
          type: string
          x-open-enum: true
          description: Open enum.
          enum:
            - org
            - site
            - block
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: The site or block id; null for `org` scope.
        site_owned:
          type: boolean
    OrgAccess:
      type: object
      required:
        - id
        - slug
        - name
        - default_locale
        - roles
        - permissions
        - sites
      properties:
        default_locale:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        permissions:
          type: array
          description: Effective permissions in this organization, from the caller's active memberships and the role to permission matrix.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        sites:
          type: array
          description: Sites of the organization the caller can see through a membership or an occupancy.
          items:
            $ref: '#/components/schemas/MeSite'
    Me:
      type: object
      required:
        - user
