          nullable: true
    WalkInCreate:
      type: object
      required:
        - site_id
        - unit_id
        - name
      properties:
        site_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        name:
          type: string
        plate:
          type: string
    VisitorArrive:
      type: object
      properties:
        point_id:
          type: string
          format: uuid
    CallContact:
      type: object
      required:
        - display_name
        - phone
      properties:
        display_name:
          type: string
          nullable: true
        phone:
          type: string
          description: E.164.
      description: 'The one contact a guard can reach: the number to call to ask a resident whether to admit a visitor. Returned only by `community.getGateVisitorCallContact`, for an open entry, and audited. It is the resident''s number the visitor entry points to, with no other contact data.'
    GuardSessionCreate:
      type: object
      description: 'Quick PIN switch at the booth: the guard picks their name from `gate.listGuards`, then types the PIN. The PIN is checked against that one person, so PINs need not be unique per site.'
      required:
        - site_id
        - person_id
        - pin
      properties:
        site_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
          description: The guard, from `gate.listGuards`.
        pin:
          type: string
          pattern: ^\d{4,8}$
          description: 4 to 8 digits (`community.setGuardPin`).
      example:
        site_id: 0192a3f0-1000-7000-8000-000000000002
        person_id: 0192a3f0-1000-7000-8000-000000000004
        pin: '1234'
    GuardSession:
      type: object
      required:
        - token
        - expires_at
        - person_id
        - display_name
      properties:
        token:
          type: string
          description: Opaque bearer for the `X-Guard-Session` header. Valid until `expires_at` (12 hours), bound to the console login session and the site it was created for; ends earlier on logout of the console, on a new `createGuardSession` by the same console, or when the guard membership ends.
        expires_at:
          type: string
          format: date-time
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
      description: 'A short-lived guard session. Send `token` as `X-Guard-Session` on guard operations (semantics: the header parameter).'
    GatePinSet:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          description: 4 to 8 digits.
    GuardRef:
      type: object
      description: 'A guard of the site as the booth shows it: name and id only, no contact data.'
      required:
        - person_id
        - display_name
        - has_pin
      properties:
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
        has_pin:
          type: boolean
          description: False until a manager has set a PIN (`community.setGuardPin`); such a guard cannot switch in.
      example:
        person_id: 0192a3f0-1000-7000-8000-000000000004
        display_name: Ali Veli
        has_pin: true
    GuardList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuardRef'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.
      example:
        items:
          - person_id: 0192a3f0-1000-7000-8000-000000000004
            display_name: Ali Veli
            has_pin: true
        next_cursor: null
    ReauthEmailCode:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          description: Always `email_code`.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: A code sent to the account's own email address by `auth.requestReauthEmailCode`.
