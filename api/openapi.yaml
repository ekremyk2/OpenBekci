        org_admin:
          - reports.debtors
        site_manager:
          - reports.debtors
        board_member:
          - reports.debtors
        auditor:
          - reports.debtors
        accountant:
          - reports.debtors
      x-stability: stable
      parameters:
        - $ref: '#/components/parameters/SiteIdRequired'
        - name: as_of
          in: query
          schema:
