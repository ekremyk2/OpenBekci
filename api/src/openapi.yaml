openapi: 3.0.3
info:
  title: OpenBekci API
  version: 0.1.0
  description: |
    HTTP API of an OpenBekci instance (residential site management).
    Conventions: see api/README.md. /v1 is not frozen until 1.0.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
  - name: audit
    description: The append-only audit trail.
  - name: tenancy
    description: Organizations, sites, blocks, units, allocation keys, imports, site transfer, vehicles.
  - name: people
    description: Persons, occupancies, memberships, invitations, join codes and claims, move-out, directory, vendors.
  - name: codes
    description: Labels for open enums and site-defined statuses.
  - name: operations
    description: Everyday operation of the building; for now the files (uploaded and generated, streamed through the server).
  - name: platform
    description: Instance operation (platform administrators).
# Role to permission matrix, generated from the Go permission registry (task gen:permissions).
x-openbekci-roles:
  $ref: './components/permissions.yaml#/x-openbekci-roles'
