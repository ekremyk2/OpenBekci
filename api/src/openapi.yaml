openapi: 3.0.3
info:
  title: OpenBekci API
  version: 0.1.0
  description: |
    HTTP API of an OpenBekci instance (residential site management).
    Conventions: see api/README.md. /v1 is not frozen until 1.0.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
  - name: audit
    description: The append-only audit trail.
  - name: tenancy
    description: Organizations, sites, blocks, units, allocation keys, imports, site transfer, vehicles.
  - name: people
    description: Persons, occupancies, memberships, invitations, join codes and claims, move-out, directory, vendors.
  - name: codes
    description: Labels for open enums and site-defined statuses.
  - name: operations
    description: Everyday operation of the building; files, tickets, announcements, documents, notifications.
  - name: dashboards
    description: Site, portfolio and resident dashboards.
  - name: access
    description: Agents, access points, credentials, access events and manual open (release 0.3).
  - name: integrations
    description: Organization API keys and signed outbound webhooks (release 0.4).
  - name: agent
    description: "Agent transport: enrolment, WebSocket, long-poll, token rotation (release 0.3; message schemas in api/agent-protocol/v1)."
  - name: money
    description: Ledger, billing, payments, expenses, collections, statements and reports.
  - name: packs
    description: Packs compiled into the server and their per-organization enablement and settings (release 0.4).
  - name: platform
    description: Instance operation (platform administrators).
