schemas:
  QuorumRule:
    type: object
    required:
      - first_call_by_count_pct
      - first_call_by_share_pct
      - second_call_requires_quorum
    properties:
      first_call_by_count_pct:
        type: number
        description: "Law 634 default: a majority by number of owners."
      first_call_by_share_pct:
        type: number
        description: ...and by arsa payi (land share).
      second_call_requires_quorum:
        type: boolean
        description: "Default false: decisions by majority of those present (verify)."
  DecisionThreshold:
    type: object
    required:
      - topic
      - rule
      - note
    properties:
      topic:
        type: string
      rule:
        type: string
        description: Open enum.
        enum:
          - simple_majority_present
          - majority_count_and_share
          - four_fifths
          - unanimity
        x-open-enum: true
      note:
        type: string
        nullable: true
  PresetNote:
    type: object
    required:
      - key
      - note
      - verify
    properties:
      key:
        type: string
      note:
        type: string
      verify:
        type: boolean
        description: The legal claim must be confirmed by a person with Turkish practice before it is relied on.
  GovernanceSettingsSet:
    type: object
    description: "Quorum, thresholds, vote weight and proxy caps: site settings with Law 634 defaults, editable where the yonetim plani allows."
    required:
      - quorum
      - thresholds
      - max_votes_per_person_pct
      - proxy_cap_pct
      - proxy_cap_small_building_max
      - small_building_unit_limit
      - call_min_days
      - second_call_min_days
      - second_call_max_days
      - term_reminder_days
    properties:
      quorum:
        $ref: "#/schemas/QuorumRule"
      thresholds:
        type: array
        items:
          $ref: "#/schemas/DecisionThreshold"
      max_votes_per_person_pct:
        type: number
        description: Default one third (verify).
      proxy_cap_pct:
        type: number
        description: Default 5 percent of total votes (verify).
      proxy_cap_small_building_max:
        type: integer
        format: int64
        description: In buildings up to `small_building_unit_limit` units, at most this many others (default 2, verify).
      small_building_unit_limit:
        type: integer
        format: int64
      call_min_days:
        type: integer
        format: int64
        description: Default 15 (verify).
      second_call_min_days:
        type: integer
        format: int64
      second_call_max_days:
        type: integer
        format: int64
      term_reminder_days:
        type: integer
        format: int64
        description: Reminder lead time before a term ends.
  GovernanceSettings:
    type: object
    required:
      - site_id
      - preset
      - settings
      - preset_notes
      - version
    properties:
      site_id:
        type: string
        format: uuid
      preset:
        type: string
        nullable: true
      settings:
        $ref: "#/schemas/GovernanceSettingsSet"
      preset_notes:
        type: array
        items:
          $ref: "#/schemas/PresetNote"
      version:
        type: integer
        format: int64
  GovernancePreset:
    type: object
    required:
      - id
      - country_code
      - name
      - settings
      - notes
    properties:
      id:
        type: string
      country_code:
        type: string
      name:
        type: string
      settings:
        $ref: "#/schemas/GovernanceSettingsSet"
      notes:
        type: array
        items:
          $ref: "#/schemas/PresetNote"
    example:
      id: id
      country_code: country code
      name: Ali Veli
      settings:
        quorum:
          first_call_by_count_pct: 1.5
          first_call_by_share_pct: 1.5
          second_call_requires_quorum: false
        thresholds:
          - topic: topic
            rule: simple_majority_present
            note: null
        max_votes_per_person_pct: 1.5
        proxy_cap_pct: 1.5
        proxy_cap_small_building_max: 1
        small_building_unit_limit: 1
        call_min_days: 1
        second_call_min_days: 1
        second_call_max_days: 1
        term_reminder_days: 1
      notes:
        - key: key
          note: note
          verify: false
  GovernancePresetList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/GovernancePreset"
      next_cursor:
        type: string
        nullable: true
    example:
      items:
        - id: id
          country_code: country code
          name: Ali Veli
          settings:
            quorum:
              first_call_by_count_pct: 1.5
              first_call_by_share_pct: 1.5
              second_call_requires_quorum: false
            thresholds:
              - topic: topic
                rule: simple_majority_present
                note: null
            max_votes_per_person_pct: 1.5
            proxy_cap_pct: 1.5
            proxy_cap_small_building_max: 1
            small_building_unit_limit: 1
            call_min_days: 1
            second_call_min_days: 1
            second_call_max_days: 1
            term_reminder_days: 1
          notes:
            - key: key
              note: note
              verify: false
      next_cursor: null
  Meeting:
    type: object
    description: An owners' assembly (kat malikleri kurulu).
    required:
      - id
      - org_id
      - site_id
      - kind
      - scope
      - title
      - scheduled_at
      - second_call_at
      - location
      - status
      - eligibility_snapshot
      - call_letter_document_id
      - minutes_document_id
      - called_at
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      kind:
        type: string
        description: Open enum.
        enum:
          - general_assembly
          - extraordinary
        x-open-enum: true
      scope:
        type: string
        description: Only `site` is supported in 0.2; block and council are reserved (G7). Open enum.
        enum:
          - site
          - block
          - council
        x-open-enum: true
      title:
        type: string
        nullable: true
      scheduled_at:
        type: string
        format: date-time
      second_call_at:
        type: string
        format: date-time
      location:
        type: string
      status:
        type: string
        description: Open enum.
        enum:
          - draft
          - called
          - in_session
          - closed
          - cancelled
        x-open-enum: true
      eligibility_snapshot:
        type: object
        additionalProperties: true
        nullable: true
        description: Who could vote and with what weight as of the call date; fixed at `:call`.
      call_letter_document_id:
        type: string
        format: uuid
        nullable: true
      minutes_document_id:
        type: string
        format: uuid
        nullable: true
      called_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      kind: general_assembly
      scope: site
      title: null
      scheduled_at: 2026-01-18T10:00:00Z
      second_call_at: 2026-01-28T10:00:00Z
      location: location
      status: called
      eligibility_snapshot: null
      call_letter_document_id: null
      minutes_document_id: null
      called_at: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  MeetingCreate:
    type: object
    required:
      - site_id
      - kind
      - scheduled_at
      - second_call_at
      - location
    properties:
      site_id:
        type: string
        format: uuid
      kind:
        type: string
        description: Open enum.
        enum:
          - general_assembly
          - extraordinary
        x-open-enum: true
      scope:
        type: string
        description: Open enum.
        enum:
          - site
          - block
          - council
        x-open-enum: true
      title:
        type: string
        nullable: true
      scheduled_at:
        type: string
        format: date-time
      second_call_at:
        type: string
        format: date-time
      location:
        type: string
  MeetingUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      title:
        type: string
        nullable: true
      scheduled_at:
        type: string
        format: date-time
      second_call_at:
        type: string
        format: date-time
      location:
        type: string
  MeetingList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Meeting"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          kind: general_assembly
          scope: site
          title: null
          scheduled_at: 2026-01-18T10:00:00Z
          second_call_at: 2026-01-28T10:00:00Z
          location: location
          status: called
          eligibility_snapshot: null
          call_letter_document_id: null
          minutes_document_id: null
          called_at: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  MeetingCall:
    type: object
    properties:
      notify_channels:
        type: array
        items:
          type: string
          enum:
            - in_app
            - email
            - sms
        description: Optional announcement of the call through the notification system; the legal delivery is tracked per owner in the notices.
  MeetingCancel:
    type: object
    required:
      - reason
    properties:
      reason:
        type: string
  Quorum:
    type: object
    description: Live quorum under the site rules; polled.
    required:
      - meeting_id
      - call
      - present_count
      - eligible_count
      - present_share
      - eligible_share
      - required_by_count_pct
      - required_by_share_pct
      - reached
      - as_of
    properties:
      meeting_id:
        type: string
        format: uuid
      call:
        type: string
        description: Which call the numbers are checked against. Open enum.
        enum:
          - first
          - second
        x-open-enum: true
      present_count:
        type: integer
        format: int64
      eligible_count:
        type: integer
        format: int64
      present_share:
        type: number
        description: Arsa payi present.
      eligible_share:
        type: number
      required_by_count_pct:
        type: number
        nullable: true
      required_by_share_pct:
        type: number
        nullable: true
      reached:
        type: boolean
      as_of:
        type: string
        format: date-time
  MyPoll:
    type: object
    required:
      - agenda_item_id
      - title
      - answered_units
    properties:
      agenda_item_id:
        type: string
        format: uuid
      title:
        type: string
      answered_units:
        type: array
