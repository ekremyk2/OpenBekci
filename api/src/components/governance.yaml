          format: uuid
  MyMeeting:
    type: object
    required:
      - meeting
      - eligible_unit_ids
      - notice
      - attendance_token
      - attendance_qr
      - checked_in
      - polls
    properties:
      meeting:
        $ref: "#/schemas/Meeting"
      eligible_unit_ids:
        type: array
        items:
          type: string
          format: uuid
      notice:
        type: object
        allOf:
          - $ref: "#/schemas/MeetingNotice"
        nullable: true
      attendance_token:
        type: string
        nullable: true
        description: The per-person check-in token; the QR encodes `attendance_qr`.
      attendance_qr:
        type: string
        nullable: true
      checked_in:
        type: boolean
      polls:
        type: array
        items:
          $ref: "#/schemas/MyPoll"
  MinutesResult:
    type: object
    required:
      - meeting_id
      - document_id
      - file_id
    properties:
      meeting_id:
        type: string
        format: uuid
      document_id:
        type: string
        format: uuid
      file_id:
        type: string
        format: uuid
  MeetingNotice:
    type: object
    description: Per-owner delivery record of the call or of the decisions (G3).
    required:
