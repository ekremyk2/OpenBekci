      - meeting_id
      - person_id
      - person_display_name
      - phase
      - method
      - status
      - sent_at
      - tracking_no
      - proof_file_id
      - note
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      meeting_id:
        type: string
        format: uuid
      person_id:
        type: string
        format: uuid
      person_display_name:
        type: string
      phase:
        type: string
        description: "`decisions`: the post-meeting notification of absent owners. Open enum."
