          - recorded
        x-open-enum: true
      sent_at:
        type: string
        format: date-time
        nullable: true
      tracking_no:
        type: string
        nullable: true
      proof_file_id:
        type: string
        format: uuid
        nullable: true
      note:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
