          - decisions
        x-open-enum: true
      method:
        type: string
        description: Open enum.
        enum:
          - registered_mail
          - signed
          - email
          - sms
          - other
        x-open-enum: true
        nullable: true
      status:
        type: string
        description: Open enum.
        enum:
