    required:
      - reason
    properties:
      reason:
        type: string
        description: Why the opening position is void; audited.
    example:
      reason: Imported twice
  BudgetLinesSet:
    type: object
    required:
      - lines
    properties:
      lines:
        type: array
        items:
          $ref: "#/schemas/BudgetLine"
  AgingBucketAmount:
    type: object
    description: One aging bucket of a row or of the totals.
    required:
      - bucket
      - amount
    properties:
      bucket:
        type: string
        description: The bucket key, one of the report's `buckets`, for example `0-30`.
      amount:
        $ref: ./common.yaml#/schemas/Money
    example:
      bucket: 0-30
      amount:
        amount: 200000
        currency: TRY
