schemas:
  ChargeScope:
    type: object
    required:
      - type
      - id
    properties:
      type:
        type: string
        enum:
          - site
          - block
          - unit_tag
      id:
        type: string
        format: uuid
        nullable: true
        description: Block or unit tag id; null for `site`.
  AllocationInput:
    type: object
    required:
      - charge_id
      - amount
    properties:
      charge_id:
        type: string
        format: uuid
      amount:
        $ref: ./common.yaml#/schemas/Money
  AllocationBasis:
    type: object
    description: Snapshot of how an allocated amount was derived (M2).
    required:
      - key_code
      - weight
      - total_weight
      - remainder_adjusted
    properties:
      key_code:
        type: string
      weight:
        type: number
      total_weight:
        type: number
      remainder_adjusted:
        type: boolean
  Account:
    type: object
    description: Chart-of-accounts entry of a site.
    required:
      - id
      - org_id
      - site_id
      - code
      - name
      - type
      - subtype
      - fund_id
      - is_system
      - archived
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
        description: "Open: bank, cash_box, receivable_owner, receivable_tenant, person_receivable, prepayment_liability, deposit_liability, dues_contribution, late_fee_income, other_income, expense_category, opening_equity, prior_year_surplus, provision_severance, withholding_receivable and pack-defined values."
      fund_id:
        type: string
        format: uuid
        nullable: true
      is_system:
        type: boolean
      archived:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  AccountCreate:
    type: object
    required:
      - site_id
      - code
      - name
      - type
    properties:
      site_id:
        type: string
        format: uuid
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
      fund_id:
        type: string
        format: uuid
        nullable: true
      archived:
        type: boolean
  AccountUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
      fund_id:
        type: string
        format: uuid
        nullable: true
      archived:
        type: boolean
  AccountList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Account"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  Fund:
    type: object
    description: Operating, reserve (demirbas / yedek akce) or custom fund; every journal line carries one.
    required:
      - id
      - org_id
      - site_id
      - name
      - kind
      - is_default
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
      is_default:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  FundCreate:
    type: object
    required:
      - site_id
      - name
      - kind
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
  FundUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
  FundList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Fund"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  CashBox:
    type: object
    description: An asset account bound to a collector (M5).
    required:
      - id
      - org_id
      - site_id
      - name
      - account_id
      - collector_person_id
      - collector_display_name
      - balance
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      account_id:
        type: string
        format: uuid
        description: The asset account created with the box.
      collector_person_id:
        type: string
        format: uuid
        nullable: true
      collector_display_name:
        type: string
        nullable: true
      balance:
        $ref: ./common.yaml#/schemas/Money
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  CashBoxCreate:
    type: object
    required:
      - site_id
      - name
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      collector_person_id:
        type: string
        format: uuid
        nullable: true
  CashBoxUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      collector_person_id:
        type: string
        format: uuid
        nullable: true
  CashBoxList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/CashBox"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  FiscalYear:
    type: object
    description: A reporting group with an approval status; the lock date, not the year, blocks postings.
    required:
      - id
      - org_id
      - site_id
      - start
      - end
      - status
      - approved_by_decision_id
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      start:
        type: string
        format: date
      end:
        type: string
        format: date
      status:
        type: string
        description: Open enum.
        enum:
          - open
          - closed
          - approved
        x-open-enum: true
      approved_by_decision_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  FiscalYearCreate:
    type: object
    required:
      - site_id
      - start
      - end
    properties:
      site_id:
        type: string
        format: uuid
      start:
        type: string
        format: date
      end:
        type: string
        format: date
  FiscalYearUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      start:
        type: string
        format: date
      end:
        type: string
        format: date
  FiscalYearList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/FiscalYear"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  FiscalYearClose:
    type: object
    properties:
      decision_id:
        type: string
        format: uuid
        description: Approving decision (0.2).
  LockDate:
    type: object
    required:
      - site_id
      - lock_date
      - changed_by
      - changed_at
    properties:
      site_id:
        type: string
        format: uuid
      lock_date:
        type: string
        format: date
        nullable: true
      changed_by:
        type: string
        format: uuid
        nullable: true
      changed_at:
        type: string
        format: date-time
        nullable: true
  LockDateSet:
    type: object
    required:
      - lock_date
    properties:
      lock_date:
        type: string
        format: date
        nullable: true
        description: Postings with `entry_date` on or before this date are rejected.
  JournalLine:
    type: object
    required:
      - id
      - account_id
      - account_code
      - fund_id
      - debit
      - credit
      - unit_id
      - debtor_kind
      - person_id
      - block_id
      - vendor_id
    properties:
      id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      account_code:
        type: string
      fund_id:
        type: string
        format: uuid
      debit:
        $ref: ./common.yaml#/schemas/Money
      credit:
        $ref: ./common.yaml#/schemas/Money
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      block_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
  JournalEntry:
    type: object
    description: Append-only; a correction is a new entry dated today that reverses this one.
    required:
      - id
      - org_id
      - site_id
      - entry_date
      - document_date
      - fiscal_year_id
      - memo
      - source_type
      - source_id
      - posted_by
      - posted_at
      - reverses_entry_id
      - reversed_by_entry_id
      - lines
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      entry_date:
        type: string
        format: date
      document_date:
        type: string
        format: date
      fiscal_year_id:
        type: string
        format: uuid
      memo:
        type: string
        nullable: true
      source_type:
        type: string
        description: charge, payment, expense, transfer, refund, opening_balance, late_fee, reversal ...
      source_id:
        type: string
        format: uuid
        nullable: true
      posted_by:
        type: string
        format: uuid
        nullable: true
      posted_at:
        type: string
        format: date-time
      reverses_entry_id:
        type: string
        format: uuid
        nullable: true
      reversed_by_entry_id:
        type: string
        format: uuid
        nullable: true
      lines:
        type: array
        items:
          $ref: "#/schemas/JournalLine"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  JournalEntryList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/JournalEntry"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  JournalReverse:
    type: object
    required:
      - reason
    properties:
      reason:
        type: string
  OpeningBalance:
    type: object
    description: Opening position against the opening-equity account (M7).
    required:
      - id
      - org_id
      - site_id
      - as_of
      - kind
      - unit_id
      - debtor_kind
      - person_id
      - account_id
      - vendor_id
      - principal
      - late_fee
      - journal_entry_id
      - locked
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      kind:
        type: string
        description: Open enum.
        enum:
          - unit_receivable
          - bank
          - cash
          - vendor
        x-open-enum: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      account_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
      journal_entry_id:
        type: string
        format: uuid
      locked:
        type: boolean
        description: True once `as_of` is on or before the lock date.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  OpeningBalanceCreate:
    type: object
    required:
      - site_id
      - as_of
      - kind
      - principal
    properties:
      site_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      kind:
        type: string
        description: Open enum.
        enum:
          - unit_receivable
          - bank
          - cash
          - vendor
        x-open-enum: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      account_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
  OpeningBalanceUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      as_of:
        type: string
        format: date
      kind:
        type: string
        description: Open enum.
        enum:
          - unit_receivable
          - bank
          - cash
          - vendor
        x-open-enum: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      account_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
  OpeningBalanceList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/OpeningBalance"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  Budget:
    type: object
    description: Light, optional category budget (M3); it does not drive dues.
    required:
      - id
      - org_id
      - site_id
      - fiscal_year_id
      - status
      - decision_id
      - total
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      fiscal_year_id:
        type: string
        format: uuid
      status:
        type: string
        description: Open enum.
        enum:
          - draft
          - final
        x-open-enum: true
      decision_id:
        type: string
        format: uuid
        nullable: true
      total:
        $ref: ./common.yaml#/schemas/Money
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  BudgetCreate:
    type: object
    required:
      - site_id
      - fiscal_year_id
    properties:
      site_id:
        type: string
        format: uuid
      fiscal_year_id:
        type: string
        format: uuid
      decision_id:
        type: string
        format: uuid
        nullable: true
  BudgetUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      decision_id:
        type: string
        format: uuid
        nullable: true
  BudgetList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Budget"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  BudgetLine:
    type: object
    required:
      - expense_category_account_id
      - fund_id
      - amount
    properties:
      expense_category_account_id:
        type: string
        format: uuid
      fund_id:
        type: string
        format: uuid
      amount:
        $ref: ./common.yaml#/schemas/Money
  BudgetLines:
    type: object
    required:
      - lines
    properties:
      lines:
        type: array
        items:
          $ref: "#/schemas/BudgetLine"
  BudgetFinalize:
    type: object
    properties:
      decision_id:
        type: string
        format: uuid
  ChargePlanRate:
    type: object
    description: Effective-dated amount of a plan (M3).
    required:
      - id
      - org_id
      - plan_id
      - from
      - to
      - amount
      - decision_id
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      plan_id:
        type: string
        format: uuid
      from:
        type: string
        format: date
      to:
        type: string
        format: date
        nullable: true
      amount:
        $ref: ./common.yaml#/schemas/Money
      decision_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  ChargePlanRateCreate:
    type: object
    required:
      - from
      - amount
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
        nullable: true
      amount:
        $ref: ./common.yaml#/schemas/Money
      decision_id:
        type: string
        format: uuid
        nullable: true
  ChargePlanRateUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
        nullable: true
      amount:
        $ref: ./common.yaml#/schemas/Money
      decision_id:
        type: string
        format: uuid
        nullable: true
  ChargePlanRateList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/ChargePlanRate"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  ChargePlan:
    type: object
    description: A dues or one-off charge plan. Charges are generated by an hourly, idempotent catch-up job on (plan, unit, period). Amounts change through rates.
    required:
      - id
      - org_id
      - site_id
      - name
      - kind
      - charge_type
      - default_debtor
      - frequency
      - due_day
      - start
      - end
      - amount_mode
      - allocation_key_id
      - scope
      - fund_id
      - income_account_id
      - status
      - decision_id
      - current_rate
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - recurring
          - one_off
        x-open-enum: true
      charge_type:
        type: string
        description: Open enum.
        enum:
          - dues
          - special_assessment
          - reserve_contribution
          - utility
          - booking_fee
          - legal_cost
          - deposit
          - adjustment
          - settlement
        x-open-enum: true
      default_debtor:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
      frequency:
        type: string
        description: Open enum.
        enum:
          - monthly
          - quarterly
          - yearly
          - once
        x-open-enum: true
      due_day:
        type: integer
        format: int64
        nullable: true
        description: Day of month.
      start:
        type: string
        format: date
      end:
        type: string
        format: date
        nullable: true
      amount_mode:
        type: string
        description: Open enum.
        enum:
          - per_unit
          - total_allocated
        x-open-enum: true
      allocation_key_id:
        type: string
        format: uuid
      scope:
        $ref: "#/schemas/ChargeScope"
      fund_id:
        type: string
        format: uuid
      income_account_id:
        type: string
