      debtor_kind: owner
      person_id: null
      account_id: null
      vendor_id: null
      principal:
        amount: 200000
        currency: TRY
      late_fee:
        amount: 200000
        currency: TRY
      journal_entry_id: 0192a3f0-1000-7000-8000-000000000005
      locked: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      status: active
      voided_at: null
      void_reason: null
  OpeningBalanceCreate:
