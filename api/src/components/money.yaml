      - as_of
      - kind
      - principal
    properties:
      site_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      kind:
        type: string
        description: Open enum.
        enum:
          - unit_receivable
          - bank
          - cash
          - vendor
        x-open-enum: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      account_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
  OpeningBalanceList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/OpeningBalance"
      next_cursor:
        type: string
        nullable: true
