schemas:
  ChargeScope:
    type: object
    required:
      - type
      - id
    properties:
      type:
        type: string
        enum:
          - site
          - block
          - unit_tag
      id:
        type: string
        format: uuid
        nullable: true
        description: Block or unit tag id; null for `site`.
  AllocationInput:
    type: object
    required:
      - charge_id
      - amount
    properties:
      charge_id:
        type: string
        format: uuid
      amount:
        $ref: ./common.yaml#/schemas/Money
  AllocationBasis:
    type: object
    description: Snapshot of how an allocated amount was derived (M2).
    required:
      - key_code
      - weight
      - total_weight
      - remainder_adjusted
    properties:
      key_code:
        type: string
      weight:
        type: number
      total_weight:
        type: number
      remainder_adjusted:
        type: boolean
  Account:
    type: object
    description: Chart-of-accounts entry of a site.
    required:
      - id
      - org_id
      - site_id
      - code
      - name
      - type
      - subtype
      - fund_id
      - is_system
      - archived
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
        description: "Open: bank, cash_box, receivable_owner, receivable_tenant, person_receivable, prepayment_liability, deposit_liability, dues_contribution, late_fee_income, other_income, expense_category, opening_equity, prior_year_surplus, provision_severance, withholding_receivable and pack-defined values."
      fund_id:
        type: string
        format: uuid
        nullable: true
      is_system:
        type: boolean
      archived:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      code: code
      name: Ali Veli
      type: asset
      subtype: null
      fund_id: null
      is_system: false
      archived: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  AccountCreate:
    type: object
    required:
      - site_id
      - code
      - name
      - type
    properties:
      site_id:
        type: string
        format: uuid
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
      fund_id:
        type: string
        format: uuid
        nullable: true
      archived:
        type: boolean
  AccountUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      code:
        type: string
      name:
        type: string
      type:
        type: string
        description: Open enum.
        enum:
          - asset
          - liability
          - equity
          - income
          - expense
        x-open-enum: true
      subtype:
        type: string
        nullable: true
      fund_id:
        type: string
        format: uuid
        nullable: true
      archived:
        type: boolean
  AccountList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Account"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          code: code
          name: Ali Veli
          type: asset
          subtype: null
          fund_id: null
          is_system: false
          archived: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  Fund:
    type: object
    description: Operating, reserve (demirbas / yedek akce) or custom fund; every journal line carries one.
    required:
      - id
      - org_id
      - site_id
      - name
      - kind
      - is_default
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
      is_default:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      name: Ali Veli
      kind: operating
      is_default: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  FundCreate:
    type: object
    required:
      - site_id
      - name
      - kind
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
  FundUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - operating
          - reserve
          - custom
        x-open-enum: true
  FundList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Fund"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          name: Ali Veli
          kind: operating
          is_default: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  CashBox:
    type: object
    description: An asset account bound to a collector (M5).
    required:
      - id
      - org_id
      - site_id
      - name
      - account_id
      - collector_person_id
      - collector_display_name
      - balance
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      account_id:
        type: string
        format: uuid
        description: The asset account created with the box.
      collector_person_id:
        type: string
        format: uuid
        nullable: true
      collector_display_name:
        type: string
        nullable: true
      balance:
        $ref: ./common.yaml#/schemas/Money
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      name: Ali Veli
      account_id: 0192a3f0-1000-7000-8000-000000000005
      collector_person_id: null
      collector_display_name: null
      balance:
        amount: 200000
        currency: TRY
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  CashBoxCreate:
    type: object
    required:
      - site_id
      - name
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      collector_person_id:
        type: string
        format: uuid
        nullable: true
  CashBoxUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      collector_person_id:
        type: string
        format: uuid
        nullable: true
  CashBoxList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/CashBox"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          name: Ali Veli
          account_id: 0192a3f0-1000-7000-8000-000000000005
          collector_person_id: null
          collector_display_name: null
          balance:
            amount: 200000
            currency: TRY
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  FiscalYear:
    type: object
    description: A reporting group with an approval status; the lock date, not the year, blocks postings.
    required:
      - id
      - org_id
      - site_id
      - start
      - end
      - status
      - approved_by_decision_id
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      start:
        type: string
        format: date
      end:
        type: string
        format: date
      status:
        type: string
        description: Open enum.
        enum:
          - open
          - closed
          - approved
        x-open-enum: true
      approved_by_decision_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      start: 2026-03-01
      end: 2026-03-01
      status: open
      approved_by_decision_id: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  FiscalYearCreate:
    type: object
    required:
      - site_id
      - start
      - end
    properties:
      site_id:
        type: string
        format: uuid
      start:
        type: string
        format: date
      end:
        type: string
        format: date
  FiscalYearList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/FiscalYear"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          start: 2026-03-01
          end: 2026-03-01
          status: open
          approved_by_decision_id: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  FiscalYearClose:
    type: object
    properties:
      decision_id:
        type: string
        format: uuid
        description: Approving decision (0.2).
  LockDate:
    type: object
    required:
      - site_id
      - lock_date
      - changed_by
      - changed_at
      - version
    properties:
      site_id:
        type: string
        format: uuid
      lock_date:
        type: string
        format: date
        nullable: true
      changed_by:
        type: string
        format: uuid
        nullable: true
      changed_at:
        type: string
        format: date-time
        nullable: true
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on the next write.
  LockDateSet:
    type: object
    required:
      - lock_date
    properties:
      lock_date:
        type: string
        format: date
        nullable: true
        description: Postings with `entry_date` on or before this date are rejected.
  JournalLine:
    type: object
    required:
      - id
      - account_id
      - account_code
      - fund_id
      - debit
      - credit
      - unit_id
      - debtor_kind
      - person_id
      - block_id
      - vendor_id
    properties:
      id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      account_code:
        type: string
      fund_id:
        type: string
        format: uuid
      debit:
        $ref: ./common.yaml#/schemas/Money
      credit:
        $ref: ./common.yaml#/schemas/Money
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      block_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
  JournalEntry:
    type: object
    description: Append-only; a correction is a new entry dated today that reverses this one.
    required:
      - id
      - org_id
      - site_id
      - entry_date
      - document_date
      - fiscal_year_id
      - memo
      - source_type
      - source_id
      - posted_by
      - posted_at
      - reverses_entry_id
      - reversed_by_entry_id
      - lines
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      entry_date:
        type: string
        format: date
      document_date:
        type: string
        format: date
      fiscal_year_id:
        type: string
        format: uuid
      memo:
        type: string
        nullable: true
      source_type:
        type: string
        description: charge, payment, expense, transfer, refund, opening_balance, late_fee, reversal ...
      source_id:
        type: string
        format: uuid
        nullable: true
      posted_by:
        type: string
        format: uuid
        nullable: true
      posted_at:
        type: string
        format: date-time
      reverses_entry_id:
        type: string
        format: uuid
        nullable: true
      reversed_by_entry_id:
        type: string
        format: uuid
        nullable: true
      lines:
        type: array
        items:
          $ref: "#/schemas/JournalLine"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      entry_date: 2026-03-01
      document_date: 2026-03-01
      fiscal_year_id: 0192a3f0-1000-7000-8000-000000000005
      memo: null
      source_type: source type
      source_id: null
      posted_by: null
      posted_at: 2026-03-01T09:00:00Z
      reverses_entry_id: null
      reversed_by_entry_id: null
      lines:
        - id: 0192a3f0-1000-7000-8000-000000000006
          account_id: 0192a3f0-1000-7000-8000-000000000007
          account_code: account code
          fund_id: 0192a3f0-1000-7000-8000-000000000008
          debit:
            amount: 200000
            currency: TRY
          credit:
            amount: 200000
            currency: TRY
          unit_id: null
          debtor_kind: owner
          person_id: null
          block_id: null
          vendor_id: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  JournalEntryList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/JournalEntry"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          entry_date: 2026-03-01
          document_date: 2026-03-01
          fiscal_year_id: 0192a3f0-1000-7000-8000-000000000005
          memo: null
          source_type: source type
          source_id: null
          posted_by: null
          posted_at: 2026-03-01T09:00:00Z
          reverses_entry_id: null
          reversed_by_entry_id: null
          lines:
            - id: 0192a3f0-1000-7000-8000-000000000006
              account_id: 0192a3f0-1000-7000-8000-000000000007
              account_code: account code
              fund_id: 0192a3f0-1000-7000-8000-000000000008
              debit:
                amount: 200000
                currency: TRY
              credit:
                amount: 200000
                currency: TRY
              unit_id: null
              debtor_kind: owner
              person_id: null
              block_id: null
              vendor_id: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  JournalReverse:
    type: object
    required:
      - reason
    properties:
      reason:
        type: string
  OpeningBalance:
    type: object
    description: Opening position against the opening-equity account (M7).
    required:
      - id
      - org_id
      - site_id
      - as_of
      - kind
      - unit_id
      - debtor_kind
      - person_id
      - account_id
      - vendor_id
      - principal
      - late_fee
      - journal_entry_id
      - locked
      - created_at
      - updated_at
      - status
      - voided_at
      - void_reason
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      kind:
        type: string
        description: Open enum.
        enum:
          - unit_receivable
          - bank
          - cash
          - vendor
        x-open-enum: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      debtor_kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
        x-open-enum: true
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      account_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
      journal_entry_id:
        type: string
        format: uuid
      locked:
        type: boolean
        description: True once `as_of` is on or before the lock date.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      status:
        type: string
        enum:
          - active
          - voided
        description: Open enum. A voided opening balance stays in the ledger with its reversal.
        x-open-enum: true
      voided_at:
        type: string
        format: date-time
        nullable: true
      void_reason:
        type: string
        nullable: true
