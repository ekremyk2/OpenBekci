schemas:
  Money:
    type: object
    description: Integer minor units with an ISO 4217 currency code.
    required: [amount, currency]
    properties:
      amount:
        type: integer
        format: int64
        example: 123450
      currency:
        type: string
        minLength: 3
        maxLength: 3
        example: TRY
  PageInfo:
    type: object
    required: [next_cursor]
    properties:
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` to fetch the next page; null on the last page.
parameters:
  Limit:
    name: limit
    in: query
    description: Page size.
    schema:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
  Cursor:
    name: cursor
    in: query
    description: Opaque cursor from a previous page `next_cursor`.
    schema:
      type: string
  OrgId:
    name: org_id
    in: path
    required: true
    description: The organization id.
    schema:
      type: string
      format: uuid
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    description: Client-generated unique key; replays within 7 days return the stored response.
    schema:
      type: string
      minLength: 8
      maxLength: 128
  IdempotencyKeyRequired:
    name: Idempotency-Key
    in: header
    required: false
    description: Client-generated unique key (8..128 chars); mandatory on this operation (422 without it; declared optional only so an unauthenticated caller gets 401 first). A replay within 7 days returns the stored response; the same key with a different request is 422 `idempotency_mismatch`.
    schema:
      type: string
      minLength: 8
      maxLength: 128
  SiteId:
    name: site_id
    in: query
    description: "Restrict to one site. Omitted: all sites the caller may see in the organization."
    schema:
      type: string
      format: uuid
  SiteIdRequired:
    name: site_id
    in: query
    required: false
    description: The site this resource belongs to. Required (422 `validation_failed`, field `site_id`, code `required` without it); declared optional only so an unauthenticated caller gets 401 first.
    schema:
      type: string
      format: uuid
  IfMatch:
    name: If-Match
    in: header
    required: false
    description: |
      The resource's `version` (as sent in `ETag`/`version`), as a quoted or bare integer (`"3"`). Required: without it the answer
      is 422 `validation_failed`; a stale value is 409 `version_conflict`. Declared optional only so an unauthenticated caller gets 401 first.
    schema:
      type: string
      pattern: '^"?[0-9]{1,9}"?$'
      example: '"3"'
