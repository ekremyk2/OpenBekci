# Header parameters of the money operations as served. The draft marks them
# `required: true`; the served API reads them after authentication instead
# (a required header would be validated before the caller is known): a missing
# If-Match is 422 from the service, a missing Idempotency-Key on an operation
# with `x-idempotent: required` is 422 from the idempotency step.
parameters:
  IfMatch:
    name: If-Match
    in: header
    description: The `version` of the resource the client last read, as a quoted integer (`"3"`). A stale value is 409 `version_conflict`; a missing one is 422 `validation_failed`.
    schema:
      type: string
      example: '"3"'
  IdempotencyKeyRequired:
    name: Idempotency-Key
    in: header
    description: Client-generated unique key (8..128 chars); mandatory on this operation. A replay within 7 days returns the stored response; the same key with a different request is 422 `idempotency_mismatch`.
    schema:
      type: string
      minLength: 8
      maxLength: 128
  SiteIdRequired:
    name: site_id
    in: query
    description: The site this resource belongs to. Required; a missing value is 422 `validation_failed` (checked after authentication).
    schema:
      type: string
      format: uuid
