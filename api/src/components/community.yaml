      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/FacilityBlock"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  Availability:
    type: object
    required:
      - facility_id
      - from
      - to
      - taken
      - blocked
    properties:
      facility_id:
        type: string
        format: uuid
      from:
        type: string
        format: date-time
      to:
        type: string
        format: date-time
      taken:
        type: array
        items:
          $ref: "#/schemas/TimeRange"
        description: Residents see slots only as taken; names stay with the manager (KVKK).
      blocked:
        type: array
        items:
          $ref: "#/schemas/TimeRange"
  Booking:
    type: object
    description: A facility booking; confirmed instantly when it satisfies the rules.
    required:
      - id
      - org_id
      - site_id
      - facility_id
      - facility_name
      - unit_id
      - unit_door_number
      - person_id
      - person_display_name
      - start
      - end
      - status
      - charge_id
      - fee
      - refund
      - cancelled_reason
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      facility_id:
        type: string
        format: uuid
      facility_name:
        type: string
      unit_id:
        type: string
        format: uuid
      unit_door_number:
        type: string
      person_id:
        type: string
        format: uuid
        nullable: true
      person_display_name:
        type: string
        nullable: true
        description: Managers and the booker only.
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      status:
        type: string
        description: Open enum.
        enum:
          - confirmed
          - cancelled
        x-open-enum: true
      charge_id:
        type: string
        format: uuid
        nullable: true
      fee:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
      refund:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
      cancelled_reason:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      facility_id: 0192a3f0-1000-7000-8000-000000000003
      facility_name: Community hall
      unit_id: 0192a3f0-1000-7000-8000-000000000002
      unit_door_number: unit door number
      person_id: null
      person_display_name: null
      start: 2026-03-14T18:00:00Z
      end: 2026-03-14T22:00:00Z
      status: confirmed
      charge_id: null
      fee: null
      refund: null
      cancelled_reason: null
