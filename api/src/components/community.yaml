  GateConsole:
    type: object
    description: Everything the booth page shows at once; auto-refreshed.
    required:
      - server_time
      - expected_visitors
      - pending_approvals
      - waiting_deliveries
      - agent
    properties:
      server_time:
        type: string
        format: date-time
      expected_visitors:
        type: array
        items:
          $ref: "#/schemas/GuardVisitor"
      pending_approvals:
        type: array
        items:
          $ref: "#/schemas/GuardVisitor"
      waiting_deliveries:
        type: array
        items:
          $ref: "#/schemas/GateDelivery"
      agent:
        type: object
        allOf:
          - $ref: "#/schemas/GateAgentStatus"
        nullable: true
        description: Absent when the site has no access agent.
  GateDelivery:
    type: object
    required:
      - id
      - unit_door_number
      - received_at
      - description
      - status
      - collected_by_name
    properties:
      id:
        type: string
        format: uuid
      unit_door_number:
        type: string
      received_at:
        type: string
        format: date-time
      description:
        type: string
        nullable: true
      status:
        type: string
        description: Open enum.
        enum:
          - waiting
          - collected
        x-open-enum: true
      collected_by_name:
        type: string
        nullable: true
  GateDeliveryList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/GateDelivery"
      next_cursor:
        type: string
        nullable: true
  GatePlate:
    type: object
    required:
      - plate
      - unit_door_number
    properties:
      plate:
        type: string
      unit_door_number:
        type: string
  GatePlateList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/GatePlate"
      next_cursor:
        type: string
        nullable: true
  ScanRequest:
    type: object
    required:
      - token
    properties:
      token:
        type: string
        description: The scanned QR value, `obk1.<token>`.
      point_id:
        type: string
        format: uuid
  ScanResult:
    type: object
    required:
      - valid
      - reason
      - entry
    properties:
      valid:
        type: boolean
      reason:
        type: string
        description: Open enum.
        enum:
          - match
          - unknown
          - outside_window
          - used_up
          - revoked
          - wrong_site
        x-open-enum: true
      entry:
        type: object
        allOf:
          - $ref: "#/schemas/GuardVisitor"
        nullable: true
  WalkInCreate:
    type: object
    required:
      - site_id
      - unit_id
      - name
    properties:
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      name:
        type: string
      plate:
        type: string
  VisitorArrive:
    type: object
    properties:
      point_id:
        type: string
        format: uuid
  CallContact:
    type: object
    required:
      - display_name
      - phone
    properties:
      display_name:
        type: string
        nullable: true
      phone:
        type: string
        description: E.164.
    description: "The one contact a guard can reach: the number to call to ask a resident whether to admit a visitor. Returned only by `community.getGateVisitorCallContact`, for an open entry, and audited. It is the resident's number the visitor entry points to, with no other contact data."
  GuardSessionCreate:
    type: object
    required:
      - site_id
      - pin
    properties:
      site_id:
        type: string
        format: uuid
      pin:
        type: string
  GuardSession:
    type: object
    required:
      - token
      - expires_at
      - person_id
      - display_name
    properties:
      token:
        type: string
        description: Send as `X-Guard-Session` on guard operations.
      expires_at:
        type: string
        format: date-time
      person_id:
        type: string
        format: uuid
      display_name:
        type: string
  GatePinSet:
    type: object
    required:
      - pin
    properties:
      pin:
        type: string
        description: 4 to 8 digits.
