schemas:
  OpeningHours:
    type: object
    required:
      - days
      - start
      - end
    properties:
      days:
        type: array
        items:
          type: integer
          format: int64
        description: ISO weekdays, 1 = Monday.
      start:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
      end:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
  FacilityRules:
    type: object
    description: Rules checked when booking; a booking inside the rules confirms instantly, with no approval queue.
    required:
      - opening_hours
      - max_duration_minutes
      - max_days_ahead
      - min_notice_minutes
      - quota_per_unit
      - quota_period
      - who_may_book
      - fee
      - cancel_refund_cutoff_hours
    properties:
      opening_hours:
        type: array
        items:
          $ref: "#/schemas/OpeningHours"
        description: Site timezone.
      max_duration_minutes:
        type: integer
        format: int64
      max_days_ahead:
        type: integer
        format: int64
        description: How far ahead a booking may be made.
      min_notice_minutes:
        type: integer
        format: int64
        nullable: true
      quota_per_unit:
        type: integer
        format: int64
        nullable: true
      quota_period:
        type: string
        description: Open enum.
        enum:
          - week
          - month
        x-open-enum: true
        nullable: true
      who_may_book:
        type: array
        items:
          type: string
          enum:
            - owner
            - tenant
            - household
      fee:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
        description: "Becomes a charge on the unit side when the booking is confirmed (default: the side of whoever booked)."
      cancel_refund_cutoff_hours:
        type: integer
        format: int64
        nullable: true
        description: A fee is refunded automatically when cancelled earlier than this.
  Facility:
    type: object
    description: "A bookable thing: hall, barbecue area, court, guest flat."
    required:
      - id
      - org_id
      - site_id
      - name
      - description
      - rules
      - enabled
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      name: Ali Veli
      description: null
      rules:
        opening_hours:
          - days: []
            start: 09:00
            end: 09:00
        max_duration_minutes: 1
        max_days_ahead: 1
        min_notice_minutes: null
        quota_per_unit: null
        quota_period: week
        who_may_book:
          - owner
        fee:
          amount: 200000
          currency: TRY
        cancel_refund_cutoff_hours: null
      enabled: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  FacilityCreate:
    type: object
    required:
      - site_id
      - name
      - rules
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
  FacilityUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
  FacilityList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Facility"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          name: Ali Veli
          description: null
          rules:
            opening_hours:
              - days: []
                start: 09:00
                end: 09:00
            max_duration_minutes: 1
            max_days_ahead: 1
            min_notice_minutes: null
            quota_per_unit: null
            quota_period: week
            who_may_book:
              - owner
            fee:
              amount: 200000
              currency: TRY
            cancel_refund_cutoff_hours: null
          enabled: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  TimeRange:
    type: object
    required:
      - start
      - end
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
  FacilityBlock:
    type: object
    description: Dates the manager blocks.
    required:
      - id
      - org_id
      - facility_id
      - start
      - end
      - reason
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      facility_id:
        type: string
        format: uuid
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      reason:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      facility_id: 0192a3f0-1000-7000-8000-000000000004
      start: 2026-03-01T09:00:00Z
      end: 2026-03-01T09:00:00Z
      reason: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  FacilityBlockCreate:
    type: object
    required:
      - start
      - end
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      reason:
        type: string
        nullable: true
  FacilityBlockList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/FacilityBlock"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          facility_id: 0192a3f0-1000-7000-8000-000000000004
          start: 2026-03-01T09:00:00Z
          end: 2026-03-01T09:00:00Z
          reason: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  Availability:
    type: object
    required:
      - facility_id
      - from
      - to
      - taken
      - blocked
    properties:
      facility_id:
        type: string
        format: uuid
      from:
        type: string
        format: date-time
      to:
        type: string
        format: date-time
      taken:
        type: array
        items:
          $ref: "#/schemas/TimeRange"
        description: Residents see slots only as taken; names stay with the manager (KVKK).
      blocked:
        type: array
        items:
          $ref: "#/schemas/TimeRange"
  Booking:
    type: object
    description: A facility booking; confirmed instantly when it satisfies the rules.
    required:
      - id
      - org_id
      - site_id
      - facility_id
      - facility_name
      - unit_id
      - unit_door_number
      - person_id
      - person_display_name
      - start
      - end
      - status
      - charge_id
      - fee
      - refund
      - cancelled_reason
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      facility_id:
        type: string
        format: uuid
      facility_name:
        type: string
      unit_id:
        type: string
        format: uuid
      unit_door_number:
        type: string
      person_id:
        type: string
        format: uuid
        nullable: true
      person_display_name:
        type: string
        nullable: true
        description: Managers and the booker only.
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      status:
        type: string
        description: Open enum.
        enum:
          - confirmed
          - cancelled
        x-open-enum: true
      charge_id:
        type: string
        format: uuid
        nullable: true
      fee:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
      refund:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
      cancelled_reason:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      facility_id: 0192a3f0-1000-7000-8000-000000000003
      facility_name: Community hall
      unit_id: 0192a3f0-1000-7000-8000-000000000002
      unit_door_number: unit door number
      person_id: null
      person_display_name: null
      start: 2026-03-14T18:00:00Z
      end: 2026-03-14T22:00:00Z
      status: confirmed
      charge_id: null
      fee: null
      refund: null
      cancelled_reason: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  BookingList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Booking"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          facility_id: 0192a3f0-1000-7000-8000-000000000003
          facility_name: Community hall
          unit_id: 0192a3f0-1000-7000-8000-000000000002
          unit_door_number: unit door number
          person_id: null
          person_display_name: null
          start: 2026-03-14T18:00:00Z
          end: 2026-03-14T22:00:00Z
          status: confirmed
          charge_id: null
          fee: null
          refund: null
          cancelled_reason: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  BookingCreate:
    type: object
    required:
      - facility_id
      - unit_id
      - start
      - end
    properties:
      facility_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      person_id:
        type: string
        format: uuid
        description: Managers may book on behalf of a unit.
      debtor_kind:
        type: string
        enum:
          - owner
          - tenant
        description: Side charged for the fee.
  BookingCancel:
    type: object
    properties:
      reason:
        type: string
  BookingPreview:
    type: object
    description: What creating the booking would do, computed without writing anything.
    required:
      - facility_id
      - unit_id
      - start
      - end
      - fee
      - refund_rule
      - quota
      - violations
      - conflict
      - bookable
    properties:
      facility_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      fee:
        type: object
        nullable: true
        description: The fee create would post as a charge; null when the facility is free.
        required:
          - amount
          - currency
          - debtor_kind
        properties:
          amount:
            type: integer
            format: int64
            description: Minor units.
          currency:
            type: string
          debtor_kind:
            type: string
            description: Side the charge would go to (owner or tenant).
            x-open-enum: true
            enum:
              - owner
              - tenant
      refund_rule:
        type: object
        required:
          - cancel_refund_cutoff_hours
          - refundable_until
        properties:
          cancel_refund_cutoff_hours:
            type: integer
            nullable: true
            description: The facility's cutoff; null when cancelling never refunds a resident (a manager's cancel always does).
          refundable_until:
            type: string
            format: date-time
            nullable: true
            description: A resident cancelling up to this instant gets the fee back; null without a fee or a cutoff.
      quota:
        type: object
        required:
          - limit
          - period
          - used
          - remaining
          - period_from
          - period_to
        properties:
          limit:
            type: integer
            nullable: true
            description: Bookings per unit per period; null when the facility has no quota.
          period:
            type: string
            nullable: true
            description: week or month; the period that contains `start`.
          used:
            type: integer
            description: Confirmed bookings of the unit in that period.
          remaining:
            type: integer
            nullable: true
            description: Bookings left before this one; 0 means the quota is used up.
          period_from:
            type: string
            format: date-time
            nullable: true
          period_to:
            type: string
            format: date-time
            nullable: true
      violations:
        type: array
        description: The rules this request breaks, as create would answer 422 `validation_failed` (same codes). Managers are not held to the lead time, the horizon or the quota.
        items:
          $ref: ./problem.yaml#/schemas/ProblemFieldError
      conflict:
        type: string
        nullable: true
        description: The 409 create would answer with, if any. Open enum.
        x-open-enum: true
        enum:
          - facility_blocked
          - slot_taken
      bookable:
        type: boolean
        description: True when create would succeed right now.
  VisitorEntry:
    type: object
    description: A visitor. Valid for the window plus 30 minutes either side; single entry unless recurring.
    required:
      - id
      - org_id
      - site_id
      - unit_id
      - unit_door_number
      - name
      - plate
      - window_from
      - window_to
      - approval_status
      - source
      - qr_token
      - decided_by
      - decided_at
      - arrived_at
      - left_at
      - cancelled
      - recurring_visitor_id
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      unit_door_number:
        type: string
      name:
        type: string
      plate:
        type: string
        nullable: true
      window_from:
        type: string
        format: date-time
      window_to:
        type: string
        format: date-time
      approval_status:
        type: string
        description: Open enum.
        enum:
          - pre_approved
          - requested
          - approved
          - denied
          - expired
        x-open-enum: true
      source:
        type: string
        description: Open enum.
        enum:
          - pre_registered
          - walk_in
          - recurring
        x-open-enum: true
      qr_token:
        type: string
        nullable: true
        description: The QR token, always including the `obk1.` prefix (the value is `obk1.<token>`, exactly what the QR encodes and what `community.scanGateVisitor` takes). Returned only to the unit's current occupants (owner, tenant, household), never to managers, board members, auditors or guards (`null` for them); a manager issues a new one to the occupants with the `rotate-qr` operation. It is also served by the `.../qr` operations.
      decided_by:
        type: string
        format: uuid
        nullable: true
      decided_at:
        type: string
        format: date-time
        nullable: true
      arrived_at:
        type: string
        format: date-time
        nullable: true
      left_at:
        type: string
        format: date-time
        nullable: true
      cancelled:
        type: boolean
      recurring_visitor_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      unit_id: 0192a3f0-1000-7000-8000-000000000002
      unit_door_number: unit door number
      name: Mehmet Kaya
      plate: 34ABC123
      window_from: 2026-03-01T09:00:00Z
      window_to: 2026-03-01T09:00:00Z
      approval_status: pre_approved
      source: pre_registered
      qr_token: null
      decided_by: null
      decided_at: null
      arrived_at: null
      left_at: null
      cancelled: false
      recurring_visitor_id: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  VisitorEntryCreate:
    type: object
    required:
      - site_id
      - unit_id
      - name
      - window_from
      - window_to
    properties:
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      name:
        type: string
      plate:
        type: string
        nullable: true
      window_from:
        type: string
        format: date-time
      window_to:
        type: string
        format: date-time
  VisitorEntryUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      plate:
        type: string
        nullable: true
      window_from:
        type: string
        format: date-time
      window_to:
        type: string
        format: date-time
  VisitorEntryList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/VisitorEntry"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          unit_id: 0192a3f0-1000-7000-8000-000000000002
          unit_door_number: unit door number
          name: Mehmet Kaya
          plate: 34ABC123
          window_from: 2026-03-01T09:00:00Z
          window_to: 2026-03-01T09:00:00Z
          approval_status: pre_approved
          source: pre_registered
          qr_token: null
          decided_by: null
          decided_at: null
          arrived_at: null
          left_at: null
          cancelled: false
          recurring_visitor_id: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  RecurringVisitor:
    type: object
    description: A standing permission (cleaner, nanny, carer) with its own long-lived QR; times are in the site timezone.
    required:
      - id
      - org_id
      - site_id
      - unit_id
      - name
      - plate
      - days
      - start
      - end
      - valid_from
      - valid_to
      - status
      - qr_token
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      name:
        type: string
      plate:
        type: string
        nullable: true
      days:
        type: array
        items:
          type: integer
          format: int64
        description: ISO weekdays.
      start:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
      end:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
      valid_from:
        type: string
        format: date
      valid_to:
        type: string
        format: date
        nullable: true
      status:
        type: string
        description: Open enum.
        enum:
          - active
          - revoked
          - expired
        x-open-enum: true
      qr_token:
        type: string
        nullable: true
        description: The QR token, always including the `obk1.` prefix (the value is `obk1.<token>`, exactly what the QR encodes and what `community.scanGateVisitor` takes). Returned only to the unit's current occupants (owner, tenant, household), never to managers, board members, auditors or guards (`null` for them); a manager issues a new one to the occupants with the `rotate-qr` operation. It is also served by the `.../qr` operations.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      unit_id: 0192a3f0-1000-7000-8000-000000000005
      name: Ali Veli
      plate: null
      days:
        - 1
      start: 09:00
      end: 09:00
      valid_from: 2026-03-01
      valid_to: null
      status: active
      qr_token: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  RecurringVisitorCreate:
    type: object
    required:
      - site_id
      - unit_id
      - name
      - days
      - start
      - end
      - valid_from
    properties:
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
      name:
        type: string
      plate:
        type: string
        nullable: true
      days:
        type: array
        items:
          type: integer
