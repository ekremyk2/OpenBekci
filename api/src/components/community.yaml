schemas:
  OpeningHours:
    type: object
    required:
      - days
      - start
      - end
    properties:
      days:
        type: array
        items:
          type: integer
          format: int64
        description: ISO weekdays, 1 = Monday.
      start:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
      end:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
  FacilityRules:
    type: object
    description: Rules checked when booking; a booking inside the rules confirms instantly, with no approval queue.
    required:
      - opening_hours
      - max_duration_minutes
      - max_days_ahead
      - min_notice_minutes
      - quota_per_unit
      - quota_period
      - who_may_book
      - fee
      - cancel_refund_cutoff_hours
    properties:
      opening_hours:
        type: array
        items:
          $ref: "#/schemas/OpeningHours"
        description: Site timezone.
      max_duration_minutes:
        type: integer
        format: int64
      max_days_ahead:
        type: integer
        format: int64
        description: How far ahead a booking may be made.
      min_notice_minutes:
        type: integer
        format: int64
        nullable: true
      quota_per_unit:
        type: integer
        format: int64
        nullable: true
      quota_period:
        type: string
        description: Open enum.
        enum:
          - week
          - month
        x-open-enum: true
        nullable: true
      who_may_book:
        type: array
        items:
          type: string
          enum:
            - owner
            - tenant
            - household
      fee:
        type: object
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        nullable: true
        description: "Becomes a charge on the unit side when the booking is confirmed (default: the side of whoever booked)."
      cancel_refund_cutoff_hours:
        type: integer
        format: int64
        nullable: true
        description: A fee is refunded automatically when cancelled earlier than this.
  Facility:
    type: object
    description: "A bookable thing: hall, barbecue area, court, guest flat."
    required:
      - id
      - org_id
      - site_id
      - name
      - description
      - rules
      - enabled
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
  FacilityCreate:
    type: object
    required:
      - site_id
      - name
      - rules
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
  FacilityUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      description:
        type: string
        nullable: true
      rules:
        $ref: "#/schemas/FacilityRules"
      enabled:
        type: boolean
  FacilityList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Facility"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
  TimeRange:
    type: object
    required:
      - start
      - end
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
  FacilityBlock:
    type: object
    description: Dates the manager blocks.
    required:
      - id
      - org_id
      - facility_id
      - start
      - end
      - reason
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      facility_id:
        type: string
        format: uuid
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      reason:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  FacilityBlockCreate:
    type: object
    required:
      - start
      - end
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      reason:
        type: string
        nullable: true
  FacilityBlockUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      reason:
        type: string
        nullable: true
  FacilityBlockList:
    type: object
    required:
