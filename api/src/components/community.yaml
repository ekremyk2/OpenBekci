      decided_at:
        type: string
        format: date-time
        nullable: true
      arrived_at:
        type: string
        format: date-time
        nullable: true
      left_at:
        type: string
        format: date-time
        nullable: true
      cancelled:
        type: boolean
      recurring_visitor_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
