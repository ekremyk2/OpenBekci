    properties:
      may_see_money:
        type: boolean
  MoveOutPreview:
    type: object
    required:
      - occupancy_id
      - as_of
      - principal
      - late_fee
      - credit
      - total
      - default_open_charges
      - carried
    properties:
      occupancy_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      principal:
        $ref: ./common.yaml#/schemas/Money
      late_fee:
        $ref: ./common.yaml#/schemas/Money
      credit:
        $ref: ./common.yaml#/schemas/Money
      total:
        allOf:
          - $ref: ./common.yaml#/schemas/Money
        description: Principal plus fee minus credit.
      default_open_charges:
        type: string
        enum:
          - carry_to_person
          - keep_on_unit
          - write_off
        description: Open enum.
        x-open-enum: true
      carried:
        type: array
        items:
          $ref: "#/schemas/CarriedCharge"
        description: Open charges the move-out would handle under the default.
  MoveOut:
    type: object
    description: A move-out or sale (S7).
    required:
      - id
      - org_id
      - occupancy_id
      - as_of
      - closing_statement_file_id
      - certificate_file_id
      - open_charges
      - carried
      - disposition_reason
      - transferred_to_person_id
      - decided_by
      - balance
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      occupancy_id:
        type: string
        format: uuid
      as_of:
        type: string
        format: date
      closing_statement_file_id:
        type: string
        format: uuid
        nullable: true
      certificate_file_id:
        type: string
        format: uuid
        nullable: true
      open_charges:
        type: string
        enum:
          - carry_to_person
          - keep_on_unit
          - write_off
        description: The decision taken. Open enum.
        x-open-enum: true
      carried:
        type: array
        items:
          $ref: "#/schemas/CarriedCharge"
        description: Every open charge the move-out handled and where it went; sums to `balance.principal` plus fee.
      disposition_reason:
        type: string
        nullable: true
      transferred_to_person_id:
        type: string
        format: uuid
        nullable: true
      decided_by:
        type: string
        format: uuid
      balance:
        $ref: "#/schemas/MoveOutPreview"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      occupancy_id: 0192a3f0-1000-7000-8000-000000000004
      as_of: 2026-03-01
      closing_statement_file_id: null
      certificate_file_id: null
      open_charges: carry_to_person
      carried:
        - charge_id: 0192a3f0-1000-7000-8000-000000000001
          charge_type: dues
          period: 2026-02
          balance:
            amount: 200000
            currency: TRY
          outcome: carried_to_person
          person_id: 0192a3f0-1000-7000-8000-000000000001
      disposition_reason: null
      transferred_to_person_id: null
      decided_by: 0192a3f0-1000-7000-8000-000000000005
      balance:
        occupancy_id: 0192a3f0-1000-7000-8000-000000000006
        as_of: 2026-03-01
        principal:
          amount: 200000
          currency: TRY
        late_fee:
          amount: 200000
          currency: TRY
        credit:
          amount: 200000
          currency: TRY
        total:
          amount: 200000
          currency: TRY
        default_open_charges: carry_to_person
        carried:
          - charge_id: 0192a3f0-1000-7000-8000-000000000001
            charge_type: dues
            period: 2026-02
            balance:
              amount: 200000
              currency: TRY
            outcome: carried_to_person
            person_id: 0192a3f0-1000-7000-8000-000000000001
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  MoveOutList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/MoveOut"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          occupancy_id: 0192a3f0-1000-7000-8000-000000000004
          as_of: 2026-03-01
          closing_statement_file_id: null
          certificate_file_id: null
          open_charges: carry_to_person
          carried:
            - charge_id: 0192a3f0-1000-7000-8000-000000000001
              charge_type: dues
              period: 2026-02
              balance:
                amount: 200000
                currency: TRY
              outcome: carried_to_person
              person_id: 0192a3f0-1000-7000-8000-000000000001
          disposition_reason: null
          transferred_to_person_id: null
          decided_by: 0192a3f0-1000-7000-8000-000000000005
          balance:
            occupancy_id: 0192a3f0-1000-7000-8000-000000000006
            as_of: 2026-03-01
            principal:
              amount: 200000
              currency: TRY
            late_fee:
              amount: 200000
              currency: TRY
            credit:
              amount: 200000
              currency: TRY
            total:
              amount: 200000
              currency: TRY
            default_open_charges: carry_to_person
            carried:
              - charge_id: 0192a3f0-1000-7000-8000-000000000001
                charge_type: dues
                period: 2026-02
                balance:
                  amount: 200000
                  currency: TRY
                outcome: carried_to_person
                person_id: 0192a3f0-1000-7000-8000-000000000001
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  MoveOutCreate:
    type: object
    required:
      - as_of
    properties:
      as_of:
        type: string
        format: date
      open_charges:
        type: string
        enum:
          - carry_to_person
          - keep_on_unit
          - write_off
        default: carry_to_person
        description: "What happens to the leaving person's open charges (S7). `carry_to_person` (default): they become that person's personal receivable and the next occupant starts at zero, collectible through `DebtorRef.person_id`. `keep_on_unit`: they stay on the unit side. `write_off`: written off (needs `disposition_reason`; audited)."
      disposition_reason:
        type: string
        description: Required for `write_off` and `keep_on_unit` (an override of the default).
      transferred_to_person_id:
        type: string
        format: uuid
        description: "With `carry_to_person`: carry to this person instead of the leaving one (for example the seller's estate); audited."
