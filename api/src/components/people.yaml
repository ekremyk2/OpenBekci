schemas:
  PersonContact:
    type: object
    properties:
      email:
        type: string
        format: email
        nullable: true
      phone:
        type: string
        description: E.164.
        nullable: true
      preferred_channel:
        type: string
        description: Open enum.
        enum:
          - sms
          - email
        x-open-enum: true
        nullable: true
      address:
        type: object
        allOf:
          - $ref: ./draft-common.yaml#/schemas/Address
        nullable: true
  DirectoryConsent:
    type: object
    required:
      - site_id
      - consent
      - show_phone
    properties:
      site_id:
        type: string
        format: uuid
      consent:
        type: boolean
      show_phone:
        type: boolean
  Person:
    type: object
    description: A person of the organization; exists before an account.
    required:
      - id
      - org_id
      - user_id
      - display_name
      - contact
      - national_id_masked
      - national_id_country
      - gate_contact_phone
      - notes
      - join_status
      - directory_consent
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      user_id:
        type: string
        format: uuid
        nullable: true
        description: The linked sign-in account, once the person joined.
      display_name:
        type: string
      contact:
        $ref: "#/schemas/PersonContact"
      national_id_masked:
        type: string
        nullable: true
        description: Only for callers with `people.national_id`; for example `*******1234`. Never returned in full and never in audit diffs.
      national_id_country:
        type: string
        nullable: true
      gate_contact_phone:
        type: string
        description: E.164.
        nullable: true
      notes:
        type: string
        nullable: true
      join_status:
        type: string
        description: Open enum.
        enum:
          - no_account
          - invited
          - joined
        x-open-enum: true
      directory_consent:
        type: array
        items:
          $ref: "#/schemas/DirectoryConsent"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      user_id: null
      display_name: Ayse Yilmaz
      contact: {}
      national_id_masked: "*******1234"
      national_id_country: TR
      gate_contact_phone: null
      notes: null
      join_status: no_account
      directory_consent:
        - site_id: 0192a3f0-1000-7000-8000-000000000002
          consent: false
          show_phone: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  PersonCreate:
    type: object
    required:
      - display_name
    properties:
      display_name:
        type: string
      contact:
        $ref: "#/schemas/PersonContact"
      gate_contact_phone:
        type: string
        description: E.164.
        nullable: true
      notes:
        type: string
        nullable: true
  PersonUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      display_name:
        type: string
      contact:
        $ref: "#/schemas/PersonContact"
      gate_contact_phone:
        type: string
        description: E.164.
        nullable: true
      notes:
        type: string
        nullable: true
  PersonList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Person"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          user_id: null
          display_name: Ayse Yilmaz
          contact: {}
          national_id_masked: "*******1234"
          national_id_country: TR
          gate_contact_phone: null
          notes: null
          join_status: no_account
          directory_consent:
            - site_id: 0192a3f0-1000-7000-8000-000000000002
              consent: false
              show_phone: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  NationalId:
    type: object
    required:
      - set
      - country_code
      - masked
    properties:
      set:
        type: boolean
      country_code:
        type: string
        nullable: true
      masked:
        type: string
        nullable: true
  NationalIdSet:
    type: object
    required:
      - country_code
      - value
    properties:
      country_code:
        type: string
        description: ISO 3166-1 alpha-2; `TR` validates the TCKN checksum.
      value:
        type: string
  Occupancy:
    type: object
    description: Who is related to which unit, and for how long. Portal rights derive from this resource only.
    required:
      - id
      - org_id
      - person_id
      - person_display_name
      - unit_id
      - unit_door_number
      - kind
      - side
      - share_pct
      - is_correspondent
      - may_see_money
      - valid_from
      - valid_to
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      person_id:
        type: string
        format: uuid
      person_display_name:
        type: string
      unit_id:
        type: string
        format: uuid
      unit_door_number:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - owner
          - tenant
          - household
        x-open-enum: true
      side:
        type: string
        description: "Debtor side: owner for owners, tenant for tenants; for a household member the side whose money they may see. Open enum."
        enum:
          - owner
          - tenant
        x-open-enum: true
      share_pct:
        type: number
        nullable: true
        description: Co-owner share.
      is_correspondent:
        type: boolean
        description: One per unit side.
      may_see_money:
        type: boolean
        description: Household only; default false.
      valid_from:
        type: string
        format: date
      valid_to:
        type: string
        format: date
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      person_id: 0192a3f0-1000-7000-8000-000000000001
      person_display_name: Ayse Yilmaz
      unit_id: 0192a3f0-1000-7000-8000-000000000002
      unit_door_number: A-12
      kind: owner
      side: owner
      share_pct: 100
      is_correspondent: false
      may_see_money: false
      valid_from: 2024-01-01
      valid_to: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  OccupancyCreate:
