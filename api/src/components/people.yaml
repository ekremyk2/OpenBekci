  Invitation:
    type: object
    description: "An invitation to join. Links: `{BASE_URL}/invite/{token}`."
    required:
      - id
      - org_id
      - kind
      - site_id
      - person_id
      - unit_id
      - channel
      - destination
      - status
      - expires_at
      - accepted_at
      - invited_by
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      kind:
        type: string
        description: Open enum.
        enum:
          - manager
          - site_code
          - household
        x-open-enum: true
      site_id:
        type: string
        format: uuid
      person_id:
        type: string
        format: uuid
        nullable: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      channel:
        type: string
        description: Open enum.
        enum:
          - sms
          - email
        x-open-enum: true
      destination:
        type: string
        description: Masked phone or email.
