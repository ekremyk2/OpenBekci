schemas:
  DriverRef:
    type: object
    required:
      - instance
    properties:
      instance:
        type: string
        description: Names a driver instance in the agent's local config file; hardware details and secrets never live on the server.
      channel:
        type: string
        description: Relay or lane within the instance.
  DriverState:
    type: object
    required:
      - instance
      - state
      - mock
    properties:
      instance:
        type: string
      state:
        type: string
        description: Open enum.
        enum:
          - ok
          - degraded
          - down
          - missing
        x-open-enum: true
      detail:
        type: string
      mock:
        type: boolean
        description: A mock driver is configured; the UI shows it.
  AccessPoint:
    type: object
    description: A gate or door driven by an agent.
    required:
      - id
      - org_id
      - site_id
      - name
      - kind
      - direction
      - agent_id
      - driver_ref
      - enabled
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - vehicle_gate
          - pedestrian_door
        x-open-enum: true
      direction:
        type: string
        description: Informational and for filtering the guard feed; no anti-passback. Open enum.
        enum:
          - in
          - out
          - both
        x-open-enum: true
      agent_id:
        type: string
        format: uuid
        nullable: true
      driver_ref:
        type: object
        allOf:
          - $ref: "#/schemas/DriverRef"
        nullable: true
      enabled:
        type: boolean
        description: Disabled points are omitted from snapshots and refuse open.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      name: Ali Veli
      kind: vehicle_gate
      direction: in
      agent_id: null
      driver_ref:
        instance: instance
        channel: channel
      enabled: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  AccessPointCreate:
    type: object
    required:
      - site_id
      - name
      - kind
      - direction
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - vehicle_gate
          - pedestrian_door
        x-open-enum: true
      direction:
        type: string
        description: Open enum.
        enum:
          - in
          - out
          - both
        x-open-enum: true
      agent_id:
        type: string
        format: uuid
        nullable: true
      driver_ref:
        type: object
        allOf:
          - $ref: "#/schemas/DriverRef"
        nullable: true
      enabled:
        type: boolean
  AccessPointUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      kind:
        type: string
        description: Open enum.
        enum:
          - vehicle_gate
          - pedestrian_door
        x-open-enum: true
      direction:
        type: string
        description: Open enum.
        enum:
          - in
          - out
          - both
        x-open-enum: true
      agent_id:
        type: string
        format: uuid
        nullable: true
      driver_ref:
        type: object
        allOf:
          - $ref: "#/schemas/DriverRef"
        nullable: true
      enabled:
        type: boolean
  AccessPointList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/AccessPoint"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          name: Ali Veli
          kind: vehicle_gate
          direction: in
          agent_id: null
          driver_ref:
            instance: instance
            channel: channel
          enabled: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  Agent:
    type: object
    description: An on-site agent. The agent token is scoped to this one site; the server stores only its hash.
    required:
      - id
      - org_id
      - site_id
      - name
      - status
      - connected
      - version
      - platform
      - protocol_version
      - last_seen
      - snapshot_version
      - queue_depth
      - drivers
      - clock_offset_ms
      - clock_suspect
      - rotate_by
      - enrol_expires_at
      - revoked_at
      - created_by
      - created_at
      - updated_at
      - lost_events
      - store_error
      - dead_letters
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      status:
        type: string
        description: Open enum.
        enum:
          - pending
          - active
          - revoked
        x-open-enum: true
      connected:
        type: boolean
        description: A live session exists or a frame arrived within 90 seconds.
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
      platform:
        type: string
        nullable: true
      protocol_version:
        type: integer
        format: int64
        nullable: true
      last_seen:
        type: string
        format: date-time
        nullable: true
      snapshot_version:
        type: integer
        format: int64
        nullable: true
      queue_depth:
        type: integer
        format: int64
        nullable: true
      drivers:
        type: array
        items:
          $ref: "#/schemas/DriverState"
      clock_offset_ms:
        type: integer
        format: int64
        nullable: true
      clock_suspect:
        type: boolean
        description: True when the offset exceeds 120 seconds or the agent reports a clock jump; a manual open is refused beyond 24 hours.
      rotate_by:
        type: string
        format: date-time
        nullable: true
      enrol_expires_at:
        type: string
        format: date-time
        nullable: true
      revoked_at:
        type: string
        format: date-time
        nullable: true
      created_by:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      lost_events:
        type: integer
        format: int64
        nullable: true
        description: "From the last heartbeat: events the agent had to discard."
      store_error:
        type: string
        nullable: true
        description: "From the last heartbeat: the agent's local store error, null when healthy."
      dead_letters:
        type: integer
        format: int64
        nullable: true
        description: "From the last heartbeat: events set aside after final rejection."
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      name: Main gate Pi
      status: active
      connected: true
      version: 1
      platform: null
      protocol_version: null
      last_seen: null
      snapshot_version: null
      queue_depth: null
      drivers:
        - instance: instance
          state: ok
          mock: false
      clock_offset_ms: null
      clock_suspect: false
      rotate_by: null
      enrol_expires_at: null
      revoked_at: null
      created_by: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      lost_events: null
      store_error: null
      dead_letters: null
  AgentCreate:
    type: object
    required:
      - site_id
      - name
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
  AgentUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
  AgentList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Agent"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          name: Main gate Pi
          status: active
          connected: true
          version: 1
          platform: null
          protocol_version: null
          last_seen: null
          snapshot_version: null
          queue_depth: null
          drivers:
            - instance: instance
              state: ok
              mock: false
          clock_offset_ms: null
          clock_suspect: false
          rotate_by: null
          enrol_expires_at: null
          revoked_at: null
          created_by: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          lost_events: null
          store_error: null
          dead_letters: null
      next_cursor: null
  AgentEnrolment:
    type: object
    required:
      - agent
      - enrolment_token
      - enrolment_expires_at
    properties:
      agent:
        $ref: "#/schemas/Agent"
      enrolment_token:
        type: string
        description: "`obk_enr_...`, shown once; valid 15 minutes, single use."
      enrolment_expires_at:
        type: string
        format: date-time
  AllowlistRebuild:
    type: object
    required:
      - site_id
    properties:
      site_id:
        type: string
        format: uuid
  RecurringWindow:
    type: object
    required:
      - days
      - start
      - end
    properties:
      days:
        type: array
        items:
          type: integer
          format: int64
        description: ISO weekdays, 1 = Monday.
      start:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
      end:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        example: 09:00
        description: "`start > end` crosses midnight and belongs to the start day."
  Credential:
    type: object
    description: "A credential the agent can match. Plates and visitor QR codes are derived from vehicles and visitor entries and never edited by hand; `tag` and `pin` credentials are created manually (`access.createCredential`, `source_type: manual`)."
    required:
      - id
      - org_id
      - site_id
      - kind
      - value
      - source_type
      - source_id
      - unit_id
      - unit_door_number
      - person_id
      - point_scope
      - point_ids
      - valid_from
      - valid_to
      - recurring
      - max_uses
      - uses
      - status
      - status_reason
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      kind:
        type: string
        description: Open enum.
        enum:
          - plate
          - visitor_qr
          - tag
          - pin
        x-open-enum: true
      value:
        type: string
        description: Normalized plate; for `visitor_qr` the sha-256 of the token, for tag and pin a salted hash. Never the secret itself.
      source_type:
        type: string
        description: Open enum.
        enum:
          - vehicle
          - visitor_entry
          - manual
        x-open-enum: true
      source_id:
        type: string
        format: uuid
        nullable: true
      unit_id:
        type: string
        format: uuid
        nullable: true
      unit_door_number:
        type: string
        nullable: true
      person_id:
        type: string
        format: uuid
        nullable: true
      point_scope:
        type: string
        description: Open enum.
        enum:
          - all_vehicle
          - all_pedestrian
          - all
          - ids
        x-open-enum: true
      point_ids:
        type: array
        items:
          type: string
          format: uuid
      valid_from:
        type: string
        format: date-time
      valid_to:
        type: string
        format: date-time
        nullable: true
      recurring:
        type: object
        allOf:
          - $ref: "#/schemas/RecurringWindow"
        nullable: true
      max_uses:
        type: integer
        format: int64
        nullable: true
      uses:
        type: integer
        format: int64
      status:
        type: string
        description: Open enum.
        enum:
          - active
          - suspended
          - revoked
          - expired
        x-open-enum: true
      status_reason:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      kind: plate
      value: value
      source_type: vehicle
      source_id: null
      unit_id: null
      unit_door_number: null
      person_id: null
      point_scope: all_vehicle
      point_ids:
        - 0192a3f0-1000-7000-8000-000000000005
      valid_from: 2026-03-01T09:00:00Z
      valid_to: null
      recurring:
        days:
          - 1
        start: 09:00
        end: 09:00
      max_uses: null
      uses: 1
      status: active
      status_reason: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  CredentialList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Credential"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          kind: plate
          value: value
          source_type: vehicle
          source_id: null
          unit_id: null
          unit_door_number: null
          person_id: null
          point_scope: all_vehicle
          point_ids:
            - 0192a3f0-1000-7000-8000-000000000005
          valid_from: 2026-03-01T09:00:00Z
          valid_to: null
          recurring:
            days:
              - 1
            start: 09:00
            end: 09:00
          max_uses: null
          uses: 1
          status: active
          status_reason: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  AccessEvent:
    type: object
    description: Append-only. Retention follows the site visitor-log setting (default 90 days).
    required:
      - id
      - org_id
      - site_id
      - point_id
      - point_name
      - agent_id
      - credential_id
      - decision
      - reason
      - presented_kind
      - observed_plate
      - unit_door_number
      - actor_user_id
      - actor_display_name
      - command_id
      - visitor_entry_id
      - occurred_at
      - synced_at
      - sync_seq
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      point_id:
        type: string
        format: uuid
      point_name:
        type: string
        nullable: true
      agent_id:
        type: string
        format: uuid
        nullable: true
      credential_id:
        type: string
        format: uuid
        nullable: true
      decision:
        type: string
        description: Open enum.
        enum:
          - allow
          - deny
          - manual_open
        x-open-enum: true
      reason:
        type: string
        description: Open enum.
        enum:
          - match
          - unknown
          - outside_window
          - wrong_point
          - revoked
          - used_up
          - agent_stopped
          - guard
          - manager
          - remote
          - driver_error
        x-open-enum: true
      presented_kind:
        type: string
        nullable: true
      observed_plate:
        type: string
        nullable: true
        description: Normalized; QR and tag values are never stored.
      unit_door_number:
        type: string
        nullable: true
      actor_user_id:
        type: string
        format: uuid
        nullable: true
      actor_display_name:
        type: string
        nullable: true
      command_id:
        type: string
        format: uuid
        nullable: true
      visitor_entry_id:
        type: string
        format: uuid
        nullable: true
      occurred_at:
        type: string
        format: date-time
        description: Agent clock, corrected for the reported offset.
      synced_at:
        type: string
        format: date-time
      sync_seq:
        type: integer
        format: int64
        description: Feed cursor.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      point_id: 0192a3f0-1000-7000-8000-000000000003
      point_name: null
      agent_id: null
      credential_id: null
      decision: allow
      reason: match
      presented_kind: null
      observed_plate: 34ABC123
      unit_door_number: null
      actor_user_id: null
      actor_display_name: null
      command_id: null
      visitor_entry_id: null
      occurred_at: 2026-03-01T09:00:00Z
      synced_at: 2026-03-01T09:00:00Z
      sync_seq: 1
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  AccessEventList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/AccessEvent"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          point_id: 0192a3f0-1000-7000-8000-000000000003
          point_name: null
          agent_id: null
          credential_id: null
          decision: allow
          reason: match
          presented_kind: null
          observed_plate: 34ABC123
          unit_door_number: null
          actor_user_id: null
          actor_display_name: null
          command_id: null
          visitor_entry_id: null
          occurred_at: 2026-03-01T09:00:00Z
          synced_at: 2026-03-01T09:00:00Z
          sync_seq: 1
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  GuardEventPoint:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
  GuardEventWho:
    type: object
    required:
      - kind
      - unit_label
      - visitor_name
    properties:
      kind:
        type: string
        description: Open enum.
        enum:
          - resident
          - visitor
          - unknown
        x-open-enum: true
      unit_label:
        type: string
        nullable: true
      visitor_name:
        type: string
        nullable: true
  GuardAccessEvent:
    type: object
    description: "Data-minimized for the guard console: door number and visitor name only, never contacts or balances."
    required:
      - sync_seq
      - occurred_at
      - point
      - decision
      - reason
      - plate
      - who
    properties:
      sync_seq:
        type: integer
        format: int64
      occurred_at:
        type: string
        format: date-time
      point:
        $ref: "#/schemas/GuardEventPoint"
      decision:
        type: string
        description: Open enum.
        enum:
          - allow
          - deny
          - manual_open
        x-open-enum: true
      reason:
        type: string
      plate:
        type: string
        nullable: true
      who:
        $ref: "#/schemas/GuardEventWho"
    example:
      sync_seq: 1
      occurred_at: 2026-03-01T09:00:00Z
      point:
        id: 0192a3f0-1000-7000-8000-000000000002
        name: Ali Veli
      decision: allow
      reason: reason
      plate: null
      who:
        kind: resident
        unit_label: null
        visitor_name: null
  GuardAccessEventList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/GuardAccessEvent"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - sync_seq: 1
          occurred_at: 2026-03-01T09:00:00Z
          point:
            id: 0192a3f0-1000-7000-8000-000000000002
            name: Ali Veli
          decision: allow
          reason: reason
          plate: null
          who:
            kind: resident
            unit_label: null
            visitor_name: null
      next_cursor: null
  OpenPointRequest:
    type: object
    properties:
      visitor_entry_id:
        type: string
        format: uuid
        description: Links the opening to an expected visitor.
      credential_id:
        type: string
        format: uuid
  AgentCommand:
    type: object
    required:
      - id
      - point_id
      - command
      - status
      - reason
      - issued_at
      - expires_at
      - completed_at
    properties:
      id:
        type: string
        format: uuid
      point_id:
        type: string
        format: uuid
        nullable: true
      command:
        type: string
        description: Open enum.
        enum:
          - open_point
          - revoke_credential
          - request_snapshot
          - update_config
          - revoked
        x-open-enum: true
      status:
        type: string
        description: Open enum.
        enum:
          - pending
          - delivered
          - done
          - failed
          - expired
        x-open-enum: true
      reason:
        type: string
        nullable: true
        description: For example driver_error.
      issued_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
        nullable: true
  AgentEnvelope:
    type: object
    description: "One JSON message of the agent protocol. Payload schemas per type: api/agent-protocol/v1/*.schema.json."
    required:
      - v
      - type
      - id
      - ts
      - payload
    properties:
      v:
        type: integer
        format: int64
        description: Protocol version, 1.
      type:
        type: string
        description: hello, snapshot, delta, event, ack, command or heartbeat; unknown types are answered with an ack `unsupported`.
      id:
        type: string
        format: uuid
        description: UUIDv7, referenced by `ack.ref`.
      ts:
        type: string
        format: date-time
        description: Sender clock.
      payload:
        type: object
        additionalProperties: true
  AgentEnrolRequest:
    type: object
    required:
      - enrolment_token
      - hostname
      - platform
      - agent_version
    properties:
      enrolment_token:
        type: string
      hostname:
        type: string
      platform:
        type: string
      agent_version:
        type: string
  AgentEnrolResponse:
    type: object
    required:
      - agent_id
      - agent_token
      - org_id
      - site_id
      - server_time
      - ws_url
      - poll_url
      - protocol_versions
    properties:
      agent_id:
        type: string
        format: uuid
      agent_token:
        type: string
        description: "`obk_agt_<agent_id>.<secret>`; stored by the agent before it reports success."
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      server_time:
        type: string
        format: date-time
      ws_url:
        type: string
        description: wss only.
      poll_url:
        type: string
        description: https only.
      protocol_versions:
        type: array
        items:
          type: integer
          format: int64
  AgentPollRequest:
    type: object
    required:
      - messages
      - wait_seconds
    properties:
      messages:
        type: array
        items:
          $ref: "#/schemas/AgentEnvelope"
      wait_seconds:
        type: integer
        format: int64
        minimum: 0
        maximum: 30
        description: 0 to 30 seconds to hold the request open when the server has nothing to send.
      session:
        type: string
        description: "Optional handle from the server hello. A call whose first message is `hello` always starts a new session (it replaces the agent's previous one). Any other call belongs to the agent's current session; when the agent has none, or the handle sent here is not the current one, the answer is 410 `agent_session_expired` and the agent starts over with `hello`."
    example:
      session: sess_0192a3f0100070008000000000000001
      messages: []
      wait_seconds: 25
  AgentPollResponse:
    type: object
    description: "Messages for the agent. An empty poll is still 200 with `messages: []` (it also refreshes the agent's contact clock)."
    required:
      - session
      - seq
      - messages
    properties:
      session:
        type: string
        description: The session handle (also in the server hello).
      seq:
        type: integer
        format: int64
        minimum: 1
        description: "Per-session counter of the responses that carry messages, starting at 1 and incremented by one for each of them. An empty response (200, `messages: []`) does not consume a number and repeats the last one issued, so it never opens a hole in the sequence. Two polls may be in flight, so the agent delivers responses in `seq` order and restarts the session (new `hello`) when a `seq` is missing for 10 seconds."
      messages:
        type: array
        items:
          $ref: "#/schemas/AgentEnvelope"
    example:
      session: sess_0192a3f0100070008000000000000001
      seq: 1
      messages: []
  AgentTokenRotated:
    type: object
    required:
      - agent_token
      - rotate_by
      - previous_valid_until
    description: "Rotation is idempotent for the retired token: calling again with the previous token inside the 10 minute window returns the same new token."
    properties:
      agent_token:
        type: string
        description: The new token, `obk_agt_<agent_id>.<secret>`; stored by the agent before it reports success.
      rotate_by:
        type: string
        format: date-time
        description: Rotate again before this time (default 180 days from now).
      previous_valid_until:
        type: string
        format: date-time
        description: The retired token keeps working until then (10 minutes after the first rotation) so a crash between steps recovers.
    example:
      agent_token: obk_agt_0192a3f0-1000-7000-8000-000000000001.secret
      rotate_by: 2026-09-01T00:00:00Z
      previous_valid_until: 2026-03-05T10:10:00Z
  CredentialCreate:
    type: object
    description: "A manual credential: an RFID/BLE tag or a keypad PIN. Plates and QR codes are not created here."
    required:
      - site_id
      - kind
      - value
      - point_scope
    properties:
      site_id:
        type: string
        format: uuid
      kind:
        type: string
        enum:
          - tag
          - pin
      value:
        type: string
        minLength: 3
        maxLength: 128
        description: "The tag id as the reader reports it, or the PIN digits. Write-only: stored as a salted hash and never returned; the agent compares the lowercased, trimmed raw value from its snapshot."
        x-secret: true
      person_id:
        type: string
        format: uuid
        nullable: true
        description: Whose credential it is, for display and the audit.
      unit_id:
        type: string
        format: uuid
        nullable: true
      label:
        type: string
        nullable: true
        description: For example "Kapici tag".
      point_scope:
        type: string
        enum:
          - all_vehicle
          - all_pedestrian
          - all
          - ids
        description: Open on input; see `Credential.point_scope`.
      point_ids:
        type: array
        items:
          type: string
          format: uuid
        description: "Required with `point_scope: ids`."
      valid_from:
        type: string
        format: date-time
        description: Default now.
      valid_to:
        type: string
        format: date-time
        nullable: true
      recurring:
        type: object
        allOf:
          - $ref: "#/schemas/RecurringWindow"
        nullable: true
      max_uses:
        type: integer
        format: int64
        nullable: true
    example:
      site_id: 0192a3f0-1000-7000-8000-000000000002
      kind: tag
      value: 04a224b1c2
      label: Kapici tag
      point_scope: all_pedestrian
