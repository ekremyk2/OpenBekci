schemas:
  NotificationType:
    type: string
    description: "Notification type vocabulary (backend section 12), shared by push titles and Android channels. Open: clients tolerate unknown values."
    x-known-values:
      - announcement.published
      - charge.due_soon
      - charge.overdue
      - dunning.reminder
      - payment.receipt
      - payment.declared
      - payment.confirmed
      - payment.rejected
      - statement.sent
      - ticket.updated
      - ticket.commented
      - claim.requested
      - claim.decided
      - meeting.called
      - meeting.decisions
      - meeting.assembly_due
      - delivery.waiting
      - visitor.qr_rotated
      - term.expiring
      - visitor.approval_requested
      - visitor.arrived
      - booking.confirmed
      - booking.cancelled
      - delivery.received
      - access.agent_silent
      - access.agent_clock_skew
      - access.agent_stopped
      - webhook.endpoint_failing
      - privacy.export_ready
  TicketSemantic:
    type: string
    description: Whether a status counts as open work or as finished. Open enum.
    enum:
      - open_like
      - closed_like
    x-open-enum: true
  TicketStatus:
    type: object
    required:
      - id
      - name
      - semantic
      - position
      - key
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      semantic:
        type: string
        description: Open enum.
        enum:
          - open_like
          - closed_like
        x-open-enum: true
      position:
        type: integer
        format: int64
      key:
        type: string
        nullable: true
        description: "Stable key of the built-in statuses: open, in_progress, done."
  TicketWorkflow:
    type: object
    description: Ordered statuses per site (O1). A site inherits the default until it edits it.
    required:
      - site_id
      - statuses
      - is_default
      - version
    properties:
      site_id:
        type: string
        format: uuid
      statuses:
        type: array
        items:
          $ref: "#/schemas/TicketStatus"
      is_default:
        type: boolean
        description: The site still uses the default open, in progress, done flow.
      version:
        type: integer
        format: int64
  TicketStatusInput:
    type: object
    required:
      - name
      - semantic
    properties:
      id:
        type: string
        format: uuid
        description: "Existing status; omitted: a new one."
      name:
        type: string
      semantic:
        type: string
        enum:
          - open_like
          - closed_like
  TicketWorkflowRestore:
    type: object
    description: Puts the built-in open, in progress, done flow back. Custom statuses are removed, so tickets in them need replacements, under the same rules as `TicketWorkflowUpdate`.
    properties:
      replacements:
        type: object
        additionalProperties:
          type: string
          format: uuid
        description: "For every custom status that tickets use: the built-in status (by id) its tickets move to. An entry for a status that is not removed, or not in use, is 422 `unexpected`."
  TicketWorkflowUpdate:
    type: object
    required:
      - statuses
    properties:
      statuses:
        type: array
        items:
          $ref: "#/schemas/TicketStatusInput"
        description: The complete ordered list.
      replacements:
        type: object
        additionalProperties:
          type: string
          format: uuid
        description: "Keyed by a removed status that tickets use: the kept status (by id) its tickets move to. Required for every such status (422 `required`); an entry for any other status, one that is kept or removed but unused, is 422 `unexpected`; a target that is not kept is 422 `invalid_value`."
  TicketCategory:
    type: object
    description: "Starter list: plumbing, electrical, elevator, cleaning, security, noise/neighbor, other."
    required:
      - id
      - org_id
      - site_id
      - name
      - default_visibility
      - default_assignee_role
      - position
      - archived
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      name:
        type: string
      default_visibility:
        type: string
        description: Open enum.
        enum:
          - private
          - common
        x-open-enum: true
      default_assignee_role:
        type: string
        description: Open enum.
        enum:
          - site_manager
          - staff
          - board_member
        x-open-enum: true
        nullable: true
      position:
        type: integer
        format: int64
      archived:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      site_id: 0192a3f0-1000-7000-8000-000000000004
      name: Ali Veli
      default_visibility: private
      default_assignee_role: site_manager
      position: 1
      archived: false
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  TicketCategoryCreate:
    type: object
    required:
      - site_id
      - name
    properties:
      site_id:
        type: string
        format: uuid
      name:
        type: string
      default_visibility:
        type: string
        description: Open enum.
        enum:
          - private
          - common
        x-open-enum: true
      default_assignee_role:
        type: string
        description: Open enum.
        enum:
          - site_manager
          - staff
          - board_member
        x-open-enum: true
        nullable: true
      position:
        type: integer
        format: int64
      archived:
        type: boolean
  TicketCategoryUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      name:
        type: string
      default_visibility:
        type: string
        description: Open enum.
        enum:
          - private
          - common
        x-open-enum: true
      default_assignee_role:
        type: string
        description: Open enum.
        enum:
          - site_manager
          - staff
          - board_member
        x-open-enum: true
        nullable: true
      position:
        type: integer
        format: int64
      archived:
        type: boolean
  TicketCategoryList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/TicketCategory"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          site_id: 0192a3f0-1000-7000-8000-000000000004
          name: Ali Veli
          default_visibility: private
          default_assignee_role: site_manager
          position: 1
          archived: false
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  TicketAssignee:
    type: object
    required:
      - kind
      - person_id
      - vendor_id
      - display_name
    properties:
      kind:
        type: string
        description: Open enum.
        enum:
          - person
          - vendor
        x-open-enum: true
      person_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      display_name:
        type: string
  TicketAttachment:
    type: object
    description: A photo or file on a ticket (up to 10 per ticket or comment).
    required:
      - id
      - org_id
      - ticket_id
      - comment_id
      - file_id
      - mime
      - size
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      ticket_id:
        type: string
        format: uuid
      comment_id:
        type: string
        format: uuid
        nullable: true
      file_id:
        type: string
        format: uuid
      mime:
        type: string
      size:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  TicketAttachmentCreate:
    type: object
    required:
      - file_id
    properties:
      file_id:
        type: string
        format: uuid
      comment_id:
        type: string
        format: uuid
  Ticket:
    type: object
    description: A ticket. Every request is a ticket; there is no chat (O6).
    required:
      - id
      - org_id
      - site_id
      - unit_id
      - unit_door_number
      - reporter_person_id
      - reporter_display_name
      - category_id
      - title
      - description
      - status_id
      - status_name
      - status_semantic
      - visibility
      - assignee
      - vote_count
      - voted_by_me
      - merged_into_id
      - comment_count
      - attachments
      - closed_at
      - created_at
      - updated_at
      - version
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
        nullable: true
      unit_door_number:
        type: string
        nullable: true
      reporter_person_id:
        type: string
        format: uuid
      reporter_display_name:
        type: string
      category_id:
        type: string
        format: uuid
      title:
        type: string
      description:
        type: string
      status_id:
        type: string
        format: uuid
      status_name:
        type: string
      status_semantic:
        $ref: "#/schemas/TicketSemantic"
      visibility:
        type: string
        description: "Private: that unit and management. Common: the whole site or block. Open enum."
        enum:
          - private
          - common
        x-open-enum: true
      assignee:
        type: object
        allOf:
          - $ref: "#/schemas/TicketAssignee"
        nullable: true
      vote_count:
        type: integer
        format: int64
        description: '"+1" count; visible to residents.'
      voted_by_me:
        type: boolean
      merged_into_id:
        type: string
        format: uuid
        nullable: true
      comment_count:
        type: integer
        format: int64
      attachments:
        type: array
        items:
          $ref: "#/schemas/TicketAttachment"
      closed_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        format: int64
        description: Optimistic-lock counter; send it back as If-Match on updates.
    example:
      id: 0192a3f0-1000-7000-8000-000000000003
      org_id: 0192a3f0-1000-7000-8000-000000000001
      site_id: 0192a3f0-1000-7000-8000-000000000002
      unit_id: null
      unit_door_number: null
      reporter_person_id: 0192a3f0-1000-7000-8000-000000000001
      reporter_display_name: reporter display name
      category_id: 0192a3f0-1000-7000-8000-000000000003
      title: Elevator stuck on floor 3
      description: description
      status_id: 0192a3f0-1000-7000-8000-000000000001
      status_name: Open
      status_semantic: open_like
      visibility: common
      assignee: null
      vote_count: 4
      voted_by_me: false
      merged_into_id: null
      comment_count: 1
      attachments:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          ticket_id: 0192a3f0-1000-7000-8000-000000000001
          comment_id: null
          file_id: 0192a3f0-1000-7000-8000-000000000002
          mime: mime
          size: 1
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      closed_at: null
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
      version: 1
  TicketCreate:
    type: object
    required:
      - site_id
      - category_id
      - title
      - description
    properties:
      site_id:
        type: string
        format: uuid
      unit_id:
        type: string
        format: uuid
        nullable: true
      category_id:
        type: string
        format: uuid
      title:
        type: string
      description:
        type: string
      visibility:
        type: string
        description: |
          Open enum. The creator chooses (O3): `private` is about one unit (a resident needs `unit_id` of a unit they occupy, or exactly one), `common` about the shared parts of the site or block. Left out, the category's default applies. Managers may set it for any ticket they open.
        enum:
          - private
          - common
        x-open-enum: true
      reporter_person_id:
        type: string
        format: uuid
      attachment_file_ids:
        type: array
        items:
          type: string
          format: uuid
  TicketUpdate:
    type: object
    description: "Partial update: send only the fields to change. The resource `version` goes in If-Match."
    properties:
      unit_id:
        type: string
        format: uuid
        nullable: true
      category_id:
        type: string
        format: uuid
      title:
        type: string
      description:
        type: string
      visibility:
        type: string
        description: Open enum.
        enum:
          - private
          - common
        x-open-enum: true
      assignee_person_id:
        type: string
        format: uuid
        nullable: true
        description: "A staff person. Absent: unchanged. `null`: clears the person assignee. A value: assigns the person and, unless `assignee_vendor_id` is sent too, clears the vendor."
      assignee_vendor_id:
        type: string
        format: uuid
        nullable: true
        description: "A vendor label. Same rules as `assignee_person_id`. Sending both with values is 422 `conflicts_with_assignee_person_id`; `null` for both unassigns."
  TicketList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Ticket"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000003
          org_id: 0192a3f0-1000-7000-8000-000000000001
          site_id: 0192a3f0-1000-7000-8000-000000000002
          unit_id: null
          unit_door_number: null
          reporter_person_id: 0192a3f0-1000-7000-8000-000000000001
          reporter_display_name: reporter display name
          category_id: 0192a3f0-1000-7000-8000-000000000003
          title: Elevator stuck on floor 3
          description: description
          status_id: 0192a3f0-1000-7000-8000-000000000001
          status_name: Open
          status_semantic: open_like
          visibility: common
          assignee: null
          vote_count: 4
          voted_by_me: false
          merged_into_id: null
          comment_count: 1
          attachments:
            - id: 0192a3f0-1000-7000-8000-000000000003
              org_id: 0192a3f0-1000-7000-8000-000000000001
              ticket_id: 0192a3f0-1000-7000-8000-000000000001
              comment_id: null
              file_id: 0192a3f0-1000-7000-8000-000000000002
              mime: mime
              size: 1
              created_at: 2026-03-01T09:00:00Z
              updated_at: 2026-03-01T09:00:00Z
          closed_at: null
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
          version: 1
      next_cursor: null
  TicketTransition:
    type: object
    required:
      - status_id
    properties:
      status_id:
        type: string
        format: uuid
      comment:
        type: string
      comment_visibility:
        type: string
        enum:
          - public
          - internal
  TicketMerge:
    type: object
    required:
      - into_ticket_id
    properties:
      into_ticket_id:
        type: string
        format: uuid
  TicketVote:
    type: object
    required:
      - ticket_id
      - vote_count
      - voted
    properties:
      ticket_id:
        type: string
        format: uuid
      vote_count:
        type: integer
        format: int64
      voted:
        type: boolean
  TicketComment:
    type: object
    description: A comment. Internal notes are hidden from residents.
    required:
      - id
      - org_id
      - ticket_id
      - author_person_id
      - author_display_name
      - body
      - visibility
      - attachments
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      ticket_id:
        type: string
        format: uuid
      author_person_id:
        type: string
        format: uuid
      author_display_name:
        type: string
      body:
        type: string
      visibility:
        type: string
        description: Open enum.
        enum:
          - public
          - internal
        x-open-enum: true
      attachments:
        type: array
        items:
          $ref: "#/schemas/TicketAttachment"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
