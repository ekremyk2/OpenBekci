      from_status_name: null
      to_status_id: 0192a3f0-1000-7000-8000-000000000005
      to_status_name: Open
      changed_by:
        id: 0192a3f0-1000-7000-8000-000000000006
        display_name: Ayse Yilmaz
      comment: null
      at: 2026-03-01T09:00:00Z
      created_at: 2026-03-01T09:00:00Z
      updated_at: 2026-03-01T09:00:00Z
  TicketStatusChangeList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/TicketStatusChange"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
          ticket_id: 0192a3f0-1000-7000-8000-000000000004
          from_status_id: null
          from_status_name: null
          to_status_id: 0192a3f0-1000-7000-8000-000000000005
          to_status_name: Open
          changed_by:
            id: 0192a3f0-1000-7000-8000-000000000006
            display_name: Ayse Yilmaz
          comment: null
          at: 2026-03-01T09:00:00Z
          created_at: 2026-03-01T09:00:00Z
          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  AnnouncementAudience:
    type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum:
          - site
          - block
          - owners
          - tenants
          - units
      block_id:
        type: string
        format: uuid
      unit_ids:
        type: array
        items:
          type: string
          format: uuid
  Announcement:
    type: object
    description: "A one-way announcement (O4): no comments, reactions or polls."
    required:
      - id
      - org_id
      - site_id
      - title
      - body_md
      - status
      - audience
      - publish_at
      - expires_at
