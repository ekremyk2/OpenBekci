          updated_at: 2026-03-01T09:00:00Z
      next_cursor: null
  TicketStatusChange:
    type: object
    description: Append-only status history.
    required:
      - id
      - org_id
      - ticket_id
      - from_status_id
      - from_status_name
      - to_status_id
      - to_status_name
      - changed_by
      - comment
      - at
      - created_at
      - updated_at
    properties:
      id:
        type: string
        format: uuid
      org_id:
        type: string
        format: uuid
      ticket_id:
        type: string
        format: uuid
      from_status_id:
        type: string
        format: uuid
        nullable: true
      from_status_name:
        type: string
        nullable: true
        description: Name of the status at the time of reading; statuses removed from the workflow keep their name.
      to_status_id:
        type: string
        format: uuid
      to_status_name:
        type: string
      changed_by:
        type: object
        nullable: true
        description: Who made the change, with the name they had then. Null for changes made by the system.
        required:
          - id
          - display_name
        properties:
          id:
            type: string
            format: uuid
            description: The user id.
          display_name:
            type: string
      comment:
        type: string
        nullable: true
        description: The comment given with a transition; an internal one is null for people who may not read internal notes.
      at:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    example:
      id: 0192a3f0-1000-7000-8000-000000000002
      org_id: 0192a3f0-1000-7000-8000-000000000003
      ticket_id: 0192a3f0-1000-7000-8000-000000000004
