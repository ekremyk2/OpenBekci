    properties:
      body:
        type: string
      visibility:
        type: string
        description: Open enum.
        enum:
          - public
          - internal
        x-open-enum: true
      attachment_file_ids:
        type: array
        items:
          type: string
          format: uuid
  TicketCommentList:
    type: object
    required:
      - items
      - next_cursor
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/TicketComment"
      next_cursor:
        type: string
        nullable: true
        description: Pass as `cursor` for the next page; null on the last page.
    example:
      items:
        - id: 0192a3f0-1000-7000-8000-000000000002
          org_id: 0192a3f0-1000-7000-8000-000000000003
