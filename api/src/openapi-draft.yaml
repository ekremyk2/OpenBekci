openapi: 3.0.3
info:
  title: "OpenBekci API (draft: releases 0.1 to 0.3)"
  version: 0.1.0
  description: "DRAFT contract for releases 0.1, 0.2 and 0.3. Builders move path references from this root into `openapi.yaml` as they implement them; nothing here is served until then. Conventions: api/README.md."
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: instance
    description: Instance discovery and information.
  - name: auth
    description: Sign-in, tokens and re-authentication.
  - name: me
    description: The signed-in user and their sessions.
  - name: tenancy
    description: Organizations, sites, blocks, units, allocation keys, imports, site transfer, vehicles.
  - name: people
    description: Persons, occupancies, memberships, invitations, join codes and claims, move-out, directory, vendors.
  - name: money
    description: Chart of accounts, funds, plans, charges, payments, bank import, expenses, collections, statements and reports.
  - name: operations
    description: Tickets, announcements, documents, notifications, files, jobs and exports.
  - name: audit
    description: Audit log and audit notes.
  - name: governance
    description: Assemblies, notices, agenda, polls, attendance, decisions, minutes, term reminders (release 0.2).
  - name: community
    description: Facilities, bookings, visitors, deliveries and the guard console (release 0.3).
  - name: access
    description: Agents, access points, credentials, access events and manual open (release 0.3).
  - name: agent
    description: "Agent transport: enrolment, WebSocket, long-poll, token rotation (release 0.3; message schemas in api/agent-protocol/v1)."
  - name: dashboards
    description: Site, portfolio and resident dashboards.
  - name: codes
    description: Labels for open enums and site-defined statuses.
  - name: platform
    description: Instance operator endpoints (platform administrators).
