parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
get:
  operationId: people.listMemberships
  summary: List role memberships
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [membership.read]
  parameters:
    - $ref: '../../components/common.yaml#/parameters/Limit'
    - $ref: '../../components/common.yaml#/parameters/Cursor'
    - name: person_id
      in: query
      description: 'Only this person.'
      schema: {type: string, format: uuid}
    - name: site_id
      in: query
      description: 'Only memberships scoped to this site or its blocks.'
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/MembershipList'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
post:
  operationId: people.createMembership
  summary: Grant a role
  description: '`board_member` and `auditor` are site-owned and must be scoped to a site or block.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [membership.manage]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/people.yaml#/schemas/MembershipCreate'
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/Membership'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
