parameters:
  - name: code
    in: path
    required: true
    description: Id of the code.
    schema:
      type: string
post:
  operationId: people.createUnitClaim
  summary: Claim a unit
  description: |-
    **Release 0.1.** The caller signed up (or signed in) first. The claim waits for approval; nothing is granted before.

    Problems: `not_found` (404), `conflict` (409), `rate_limited` (429).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/UnitClaimCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/UnitClaim
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
