parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: invitation_id
    in: path
    required: true
    description: Id of the invitation.
    schema:
      type: string
      format: uuid
delete:
  operationId: me.revokeHouseholdInvitation
  summary: Revoke a household invitation I sent
  description: |-
    **Release 0.1.** Revokes a pending household invitation the caller sent; the link stops working. An accepted invitation cannot be revoked here: end the household occupancy instead (`me.endHouseholdOccupancy`).

    Permission: `invitations.household` (own invitations only).

    Problems: `conflict` (409, not pending).
  tags:
    - me
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    owner:
      - invitations.household
    tenant:
      - invitations.household
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
