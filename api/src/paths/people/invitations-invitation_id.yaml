parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: invitation_id
    in: path
    required: true
    description: The invitation id.
    schema:
      type: string
      format: uuid
delete:
  operationId: people.revokeInvitation
  summary: Revoke a pending invitation
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [invitation.manage]
  x-idempotent: optional
  responses:
    '204':
      description: Done.
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
