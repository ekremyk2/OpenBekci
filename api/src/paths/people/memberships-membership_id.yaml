parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: membership_id
    in: path
    required: true
    description: The membership id.
    schema:
      type: string
      format: uuid
delete:
  operationId: people.endMembership
  summary: End a membership
  description: 'End-dates the membership. A site-owned one (board member, auditor) needs a recent re-authentication and is recorded as an override; the last organization administrator cannot be ended.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [membership.manage]
  x-idempotent: optional
  responses:
    '204':
      description: Done.
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
