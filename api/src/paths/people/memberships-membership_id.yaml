parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: membership_id
    in: path
    required: true
    description: Id of the membership.
    schema:
      type: string
      format: uuid
get:
  operationId: people.getMembership
  summary: Get a membership
  description: |-
    **Release 0.1.** Get a membership.

    Permission: `memberships.read`.
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - memberships.read
    site_manager:
      - memberships.read
    board_member:
      - memberships.read
    auditor:
      - memberships.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/Membership
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: people.updateMembership
  summary: Update a membership
  description: |-
    **Release 0.1.** Changing a site-owned membership needs re-authentication (or the decision, 0.2).

    Permission: `memberships.manage`.

    Problems: `reauth_required` (403), `version_conflict` (409), `conflict` (409).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - memberships.manage
    site_manager:
      - memberships.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/MembershipUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/Membership
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
delete:
  operationId: people.deleteMembership
  summary: End a membership
  description: |-
    **Release 0.1.** Removing a site-owned membership needs re-authentication and is audited; an organization admin cannot otherwise remove board or auditor memberships.

    Permission: `memberships.manage`.

    Sensitive (ending a site-owned membership): answers 403 `reauth_required` unless the session re-authenticated in the last 10 minutes (`POST /v1/auth/reauth`).

    Problems: `reauth_required` (403), `conflict` (409), `version_conflict` (409).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - memberships.manage
    site_manager:
      - memberships.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
