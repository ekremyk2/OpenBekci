parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: people.listUnitClaims
  summary: List unit claims
  description: |-
    **Release 0.1.** List unit claims.

    Permission: `claims.decide`.
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - claims.decide
    site_manager:
      - claims.decide
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteId
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - pending
          - approved
          - rejected
      description: Filter by `status`.
    - name: unit_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/UnitClaimList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
