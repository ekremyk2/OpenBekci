parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: person_id
    in: path
    required: true
    description: Id of the person.
    schema:
      type: string
      format: uuid
post:
  operationId: people.requestDataExport
  summary: Export a person's data
  description: |-
    **Release 1.0.** Queues the export of everything the organization holds about the person: the person, occupancies, charges and payments, tickets and comments, consents and the audit trail of the person (personal values appear in it only as keyed hashes). A job files a JSON and a PDF as private documents in the "Privacy" folder of the person's site, readable by the person and the managers, and notifies the person and the manager who asked (`privacy.export_ready`). The national id is not included (it is only ever shown masked).

    Permission: `people.export` (a manager for the person) or `me.manage` (the person asking for their own data). Anyone else answers 403.

    Problems: `forbidden` (403), `conflict` (409, the person is erased or has no site to file in).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - people.export
    site_manager:
      - people.export
    member:
      - me.manage
  x-idempotent: optional
  x-stability: stable
  responses:
    "202":
      description: Accepted; the export continues as a job.
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/DataExportRequested
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
