parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: occupancy_id
    in: path
    required: true
    description: The occupancy id.
    schema:
      type: string
      format: uuid
post:
  operationId: people.moveOut
  summary: Record a move-out or transfer
  description: 'Ends the occupancy as of a date, with placeholder closing statement and debt certificate records; a successor takes over for a sale.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [moveout.manage]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/people.yaml#/schemas/MoveOutRequest'
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/MoveOut'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
