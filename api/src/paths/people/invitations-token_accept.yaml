parameters:
  - name: token
    in: path
    required: true
    description: Id of the token.
    schema:
      type: string
post:
  operationId: people.acceptInvitation
  summary: Accept an invitation
  description: |-
    **Release 0.1.** Creates the account (or links the signed-in one) to the person and starts a session as `client` says.

    Problems: `rate_limited` (429), `not_found` (404), `conflict` (409).
  tags:
    - people
  security:
    - {}
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/InvitationAccept
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/auth.yaml#/schemas/AuthResult
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
