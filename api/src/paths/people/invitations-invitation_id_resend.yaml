parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: invitation_id
    in: path
    required: true
    description: Id of the invitation.
    schema:
      type: string
      format: uuid
post:
  operationId: people.resendInvitation
  summary: Resend an invitation
  description: |-
    **Release 0.1.** Resend an invitation.

    Permission: `invitations.manage`.

    Problems: `sms_unavailable` (503), `mail_unavailable` (503), `rate_limited` (429), `conflict` (409).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - invitations.manage
    site_manager:
      - invitations.manage
    board_member:
      - invitations.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/Invitation
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
