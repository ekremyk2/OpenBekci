parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: claim_id
    in: path
    required: true
    description: Id of the claim.
    schema:
      type: string
      format: uuid
post:
  operationId: people.rejectUnitClaim
  summary: Reject a unit claim
  description: |-
    **Release 0.1.** Reject a unit claim.

    Permission: `claims.decide`.

    Problems: `conflict` (409).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - claims.decide
    site_manager:
      - claims.decide
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/UnitClaimReject
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/UnitClaim
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
