parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: unit_id
    in: path
    required: true
    description: The unit id.
    schema:
      type: string
      format: uuid
post:
  operationId: people.createOccupancy
  summary: Add an occupancy to a unit
  description: 'Owner, tenant or household member. Co-owner shares of the unit sum to at most 100; a new correspondent replaces the side''s previous one.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [occupancy.manage]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/people.yaml#/schemas/OccupancyCreate'
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/Occupancy'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
