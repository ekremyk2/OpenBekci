parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: site_id
    in: path
    required: true
    description: The site id.
    schema:
      type: string
      format: uuid
get:
  operationId: people.getJoinCode
  summary: Read the site's join code
  description: 'The code behind the site''s QR: `{BASE_URL}/join/{code}`.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [invitation.manage]
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/JoinCode'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
post:
  operationId: people.rotateJoinCode
  summary: Create or replace the site's join code
  description: 'The previous code stops working at once.'
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [invitation.manage]
  x-idempotent: optional
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/JoinCode'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
