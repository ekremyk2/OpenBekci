parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: site_id
    in: path
    required: true
    description: Id of the site.
    schema:
      type: string
      format: uuid
get:
  operationId: people.getJoinCode
  summary: Get the site QR join code
  description: |-
    **Release 0.1.** Get the site QR join code.

    Permission: `claims.decide`.
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - claims.decide
    site_manager:
      - claims.decide
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/JoinCode
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
put:
  operationId: people.setJoinCodeEnabled
  summary: Enable or disable the join code
  description: |-
    **Release 0.1.** Enable or disable the join code.

    Permission: `claims.decide`.

    Problems: `conflict` (409).
  tags:
    - people
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - claims.decide
    site_manager:
      - claims.decide
  x-idempotent: optional
  x-stability: stable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/JoinCodeSet
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/JoinCode
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
