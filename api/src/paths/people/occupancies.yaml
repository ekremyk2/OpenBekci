parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
get:
  operationId: people.listOccupancies
  summary: List occupancies
  tags: [people]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [occupancy.read]
  parameters:
    - $ref: '../../components/common.yaml#/parameters/Limit'
    - $ref: '../../components/common.yaml#/parameters/Cursor'
    - name: site_id
      in: query
      description: 'Only this site.'
      schema: {type: string, format: uuid}
    - name: unit_id
      in: query
      description: 'Only this unit.'
      schema: {type: string, format: uuid}
    - name: person_id
      in: query
      description: 'Only this person.'
      schema: {type: string, format: uuid}
    - name: current
      in: query
      description: 'Only occupancies in force today.'
      schema: {type: boolean}
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/people.yaml#/schemas/OccupancyList'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
