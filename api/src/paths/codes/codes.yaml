parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
get:
  operationId: codes.listCodes
  summary: Labels for enums, error codes and site statuses
  description: |-
    Clients translate open enums and problem codes with this; unknown codes fall back to the raw value.

    Permission: `codes.read`.
  tags:
    - codes
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [codes.read]
  parameters:
    - name: locale
      in: query
      schema:
        type: string
      description: Filter by `locale`.
    - $ref: ../../components/common.yaml#/parameters/SiteId
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/codes.yaml#/schemas/OrgCodes
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
