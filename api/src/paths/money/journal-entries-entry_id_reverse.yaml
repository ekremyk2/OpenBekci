parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
post:
  operationId: money.reverseJournalEntry
  summary: Reverse a journal entry
  description: |-
    **Release 0.1.** Posts the mirror entry dated today with `reverses_entry_id`; the original document date is kept. Fails with `locked_period` if today is on or before the lock date, with `conflict` if already reversed.

    Permission: `money.post`.

    Problems: `locked_period` (409), `conflict` (409), `idempotency_mismatch` (422).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.post
    site_manager:
      - money.post
    board_member:
      - money.post
    accountant:
      - money.post
  x-idempotent: required
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/JournalReverse
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/JournalEntry
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
