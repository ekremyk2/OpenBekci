parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.getBudgetVsActualReport
  summary: Budget versus actual
  description: |-
    **Release 0.1.**  JSON by default; `format=csv` downloads it.

    Permission (any one of): `reports.read`, `reports.aggregate`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - reports.read
    site_manager:
      - reports.read
    board_member:
      - reports.read
    auditor:
      - reports.read
    accountant:
      - reports.read
    owner:
      - reports.aggregate
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: fiscal_year_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `fiscal_year_id`.
      required: true
    - $ref: ../../components/draft-common.yaml#/parameters/Format
  responses:
    "200":
      description: The report. JSON by default; `format=csv` selects a CSV download.
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/BudgetVsActualReport
        text/csv:
          schema:
            type: string
            format: binary
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
