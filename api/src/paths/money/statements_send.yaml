parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: money.sendStatement
  summary: Generate and send a statement
  description: |-
    **Release 0.1.** Files the PDF into the unit folder (O8) and notifies the debtor.

    Permission: `statements.read`.

    Problems: `sms_unavailable` (503), `mail_unavailable` (503), `conflict` (409).

    `debtor` is a unit side or a person (carried debt).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - statements.read
    site_manager:
      - statements.read
    board_member:
      - statements.read
    auditor:
      - statements.read
    accountant:
      - statements.read
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/StatementSend
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/StatementSent
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
