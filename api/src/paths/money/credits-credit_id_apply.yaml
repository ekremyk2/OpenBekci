parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: credit_id
    in: path
    required: true
    description: Id of the credit.
    schema:
      type: string
      format: uuid
post:
  operationId: money.applyCredit
  summary: Apply a credit to charges
  description: |-
    **Release 0.1.** Apply a credit to charges.

    Permission: `payments.record`.

    Problems: `conflict` (409), `idempotency_mismatch` (422), `locked_period` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - payments.record
    site_manager:
      - payments.record
    board_member:
      - payments.record
    accountant:
      - payments.record
  x-idempotent: required
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/CreditApply
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Credit
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
