parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: charge_id
    in: path
    required: true
    description: Id of the charge.
    schema:
      type: string
      format: uuid
post:
  operationId: money.cancelCharge
  summary: Cancel a charge
  description: |-
    **Release 0.1.** Reverses the posting (dated today) with a reason; payments already allocated become credit.

    Permission: `money.post`.

    Problems: `conflict` (409), `idempotency_mismatch` (422).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.post
    site_manager:
      - money.post
    board_member:
      - money.post
    accountant:
      - money.post
  x-idempotent: required
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/ChargeCancel
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Charge
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
