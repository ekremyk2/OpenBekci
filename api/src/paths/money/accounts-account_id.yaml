parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: account_id
    in: path
    required: true
    description: Id of the account.
    schema:
      type: string
      format: uuid
get:
  operationId: money.getAccount
  summary: Get account
  description: |-
    **Release 0.1.** Get account.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [money.read]
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Account
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: money.updateAccount
  summary: Update account
  description: |-
    **Release 0.1.** Update account.

    Permission: `money.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [money.manage]
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/money-params.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/AccountUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Account
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
