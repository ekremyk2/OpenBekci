parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.getMyBalances
  summary: What I owe today
  description: |-
    **Release 0.1.** One row per unit side the caller may see, with the accrued late fee and the site bank details with a suggested reference. Household members appear only with `may_see_money`.

    Permission: `statements.read_own`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    owner:
      - statements.read_own
    tenant:
      - statements.read_own
    household:
      - statements.read_own
    former_occupant:
      - statements.read_own
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteId
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/MyBalances
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
