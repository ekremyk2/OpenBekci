parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: transfer_id
    in: path
    required: true
    description: Id of the transfer.
    schema:
      type: string
      format: uuid
get:
  operationId: money.getTransfer
  summary: Get transfer
  description: |-
    **Release 0.1.** Get transfer.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Transfer
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
