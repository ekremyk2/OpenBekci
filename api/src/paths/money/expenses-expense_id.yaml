parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: expense_id
    in: path
    required: true
    description: Id of the expense.
    schema:
      type: string
      format: uuid
get:
  operationId: money.getExpense
  summary: Get an expense
  description: |-
    **Release 0.1.** Get an expense.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Expense
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
