parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: payment_id
    in: path
    required: true
    description: Id of the payment.
    schema:
      type: string
      format: uuid
post:
  operationId: money.sendPaymentReceipt
  summary: Send the receipt
  description: |-
    **Release 0.1.** Send the receipt.

    Permission: `payments.record`.

    Problems: `sms_unavailable` (503), `mail_unavailable` (503), `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - payments.record
    site_manager:
      - payments.record
    board_member:
      - payments.record
    accountant:
      - payments.record
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/ReceiptDelivery
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
