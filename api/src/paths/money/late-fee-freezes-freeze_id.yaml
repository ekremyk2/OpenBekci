parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: freeze_id
    in: path
    required: true
    description: Id of the freeze.
    schema:
      type: string
      format: uuid
get:
  operationId: money.getLateFeeFreeze
  summary: Get late-fee freeze
  description: |-
    **Release 0.1.** Get late-fee freeze.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/LateFeeFreeze
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: money.updateLateFeeFreeze
  summary: Update late-fee freeze
  description: |-
    **Release 0.1.** Update late-fee freeze.

    Permission: `money.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.manage
    site_manager:
      - money.manage
    board_member:
      - money.manage
    accountant:
      - money.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/LateFeeFreezeUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/LateFeeFreeze
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
