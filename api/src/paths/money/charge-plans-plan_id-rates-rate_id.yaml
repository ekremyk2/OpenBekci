parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: plan_id
    in: path
    required: true
    description: Id of the plan.
    schema:
      type: string
      format: uuid
  - name: rate_id
    in: path
    required: true
    description: Id of the rate.
    schema:
      type: string
      format: uuid
delete:
  operationId: money.deleteChargePlanRate
  summary: Delete a future rate
  description: |-
    **Release 0.1.** Only a rate that has not taken effect yet.

    Permission: `money.manage`.

    Problems: `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.manage
    site_manager:
      - money.manage
    board_member:
      - money.manage
    accountant:
      - money.manage
  x-idempotent: optional
  x-stability: stable
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
