parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: stage_id
    in: path
    required: true
    description: Id of the stage.
    schema:
      type: string
      format: uuid
get:
  operationId: money.getDunningStage
  summary: Get dunning stage
  description: |-
    **Release 0.1.** Get dunning stage.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/DunningStage
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
