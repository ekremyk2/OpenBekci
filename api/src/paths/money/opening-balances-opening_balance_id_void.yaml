parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: opening_balance_id
    in: path
    required: true
    description: Id of the opening balance.
    schema:
      type: string
      format: uuid
post:
  operationId: money.voidOpeningBalance
  summary: Void an opening balance
  description: |-
    **Release 0.1.** Reverses the opening entry with a reason and keeps both in the ledger (nothing is edited or deleted after the fact); `locked_period` once the lock date has passed `as_of`. Replaces the former `money.deleteOpeningBalance`.

    Permission: `money.post`.

    Sensitive (M7, backend section 16): answers 403 `reauth_required` unless the session re-authenticated in the last 10 minutes (`POST /v1/auth/reauth`).

    Problems: `locked_period` (409), `conflict` (409), `idempotency_mismatch` (422).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.post
    site_manager:
      - money.post
    board_member:
      - money.post
    accountant:
      - money.post
  x-idempotent: required
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/OpeningBalanceVoid
  responses:
    "200":
      description: The voided opening balance.
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/OpeningBalance
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
