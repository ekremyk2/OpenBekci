parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.listCashBoxes
  summary: List cash boxes
  description: |-
    **Release 0.1.** Cursor-paginated list of cash boxs.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/CashBoxList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: money.createCashBox
  summary: Create cash box
  description: |-
    **Release 0.1.** Creates a cash box.

    Permission: `money.manage`.

    Problems: `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.manage
    site_manager:
      - money.manage
    board_member:
      - money.manage
    accountant:
      - money.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/CashBoxCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/CashBox
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
