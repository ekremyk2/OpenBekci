parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.getChargeGenerationStatus
  summary: Catch-up charge generation status
  description: |-
    **Release 0.1.** Catch-up charge generation status.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/ChargeGenerationStatus
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
