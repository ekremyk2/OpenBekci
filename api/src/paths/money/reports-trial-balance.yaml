parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.getTrialBalanceReport
  summary: Trial balance
  description: |-
    **Release 0.1.**  JSON by default; `format=csv` downloads it.

    Permission: `reports.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - reports.read
    site_manager:
      - reports.read
    board_member:
      - reports.read
    auditor:
      - reports.read
    accountant:
      - reports.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: as_of
      in: query
      schema:
        type: string
        format: date
      description: Evaluate as of this date (default today).
    - name: fund_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `fund_id`.
    - $ref: ../../components/draft-common.yaml#/parameters/Format
  responses:
    "200":
      description: The report. JSON by default; `format=csv` selects a CSV download.
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/TrialBalanceReport
        text/csv:
          schema:
            type: string
            format: binary
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
