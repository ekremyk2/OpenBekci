parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.listTransfers
  summary: List transfers
  description: |-
    **Release 0.1.** Cursor-paginated list of transfers.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: account_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `account_id`.
    - name: from
      in: query
      schema:
        type: string
        format: date
      description: Start of the range (inclusive).
    - name: to
      in: query
      schema:
        type: string
        format: date
      description: End of the range (inclusive).
    - name: kind
      in: query
      schema:
        type: string
      description: Filter by `kind`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/TransferList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: money.createTransfer
  summary: Create transfer
  description: |-
    **Release 0.1.** Creates a transfer.

    Permission: `money.post`.

    Problems: `locked_period` (409), `idempotency_mismatch` (422), `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.post
    site_manager:
      - money.post
    board_member:
      - money.post
    accountant:
      - money.post
  x-idempotent: required
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/TransferCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Transfer
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
