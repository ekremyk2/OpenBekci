parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: money.createDunningRun
  summary: Send a reminder run
  description: |-
    **Release 0.1.** Send a reminder run.

    Permission: `collections.manage`.

    Problems: `sms_unavailable` (503), `mail_unavailable` (503), `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - collections.manage
    site_manager:
      - collections.manage
    board_member:
      - collections.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/DunningRunRequest
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/DunningRun
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
