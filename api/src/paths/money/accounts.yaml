parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: money.listAccounts
  summary: List accounts
  description: |-
    **Release 0.1.** Cursor-paginated list of accounts.

    Permission: `money.read`.
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.read
    site_manager:
      - money.read
    board_member:
      - money.read
    auditor:
      - money.read
    accountant:
      - money.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: type
      in: query
      schema:
        type: string
        x-known-values:
          - asset
          - liability
          - equity
          - income
          - expense
      description: Filter by `type`.
    - name: subtype
      in: query
      schema:
        type: string
      description: Filter by `subtype`.
    - name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    - name: archived
      in: query
      schema:
        type: boolean
      description: Filter by `archived`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/AccountList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: money.createAccount
  summary: Create account
  description: |-
    **Release 0.1.** Creates a account.

    Permission: `money.manage`.

    Problems: `conflict` (409).
  tags:
    - money
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - money.manage
    site_manager:
      - money.manage
    board_member:
      - money.manage
    accountant:
      - money.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/money.yaml#/schemas/AccountCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/money.yaml#/schemas/Account
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
