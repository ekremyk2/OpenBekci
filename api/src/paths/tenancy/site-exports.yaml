parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
get:
  operationId: tenancy.listSiteExports
  summary: List site exports and imports
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [site.export]
  parameters:
    - $ref: '../../components/common.yaml#/parameters/Limit'
    - $ref: '../../components/common.yaml#/parameters/Cursor'
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/SiteExportList'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
