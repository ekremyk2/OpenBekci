parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: unit_id
    in: path
    required: true
    description: The unit id.
    schema:
      type: string
      format: uuid
post:
  operationId: tenancy.createVehicle
  summary: Register a plate for a unit
  description: 'The plate is normalized (`34 abc 123` becomes `34ABC123`) and unique per site.'
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [vehicle.manage]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/tenancy.yaml#/schemas/VehicleCreate'
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/Vehicle'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
