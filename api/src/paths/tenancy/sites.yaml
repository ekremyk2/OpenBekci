parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: tenancy.listSites
  summary: List sites
  description: |-
    **Release 0.1.** Cursor-paginated list of sites.

    Permission: `sites.read`.
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    member:
      - sites.read
  x-stability: stable
  parameters:
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - active
          - offboarded
      description: Filter by `status`.
    - name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/SiteList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: tenancy.createSite
  summary: Create site
  description: |-
    **Release 0.1.** Creates a site.

    Permission: `sites.manage`.

    Problems: `conflict` (409).
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - sites.manage
    site_manager:
      - sites.manage
    board_member:
      - sites.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/tenancy.yaml#/schemas/SiteCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/Site
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
