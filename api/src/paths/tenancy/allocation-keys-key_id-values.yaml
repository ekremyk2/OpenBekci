parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: key_id
    in: path
    required: true
    description: The key id.
    schema:
      type: string
      format: uuid
put:
  operationId: tenancy.setAllocationKeyValues
  summary: Replace a share or table key's values
  description: 'Values are rationals (`12/1000`) or decimals. The response carries sanity warnings, for example a share key that does not add up to one.'
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [allocation.manage]
  x-idempotent: optional
  parameters:
    - name: If-Match
      in: header
      required: false
      description: |
        The resource's `version` (as sent in `ETag`), optionally quoted. Required: without it the answer is 422
        `validation_failed`. Declared optional only so an unauthenticated caller gets 401 first.
      schema:
        type: string
        pattern: '^"?[0-9]{1,9}"?$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/tenancy.yaml#/schemas/AllocationKeyValues'
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/AllocationKeyDetail'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
