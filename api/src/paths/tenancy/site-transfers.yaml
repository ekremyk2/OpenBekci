parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: tenancy.listSiteTransfers
  summary: List site exports, imports and offboardings
  description: |-
    **Release 0.1.** List site exports, imports and offboardings.

    Permission: `sites.export`.
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - sites.export
  x-stability: stable
  parameters:
    - name: direction
      in: query
      schema:
        type: string
        x-known-values:
          - export
          - import
          - offboard
      description: Filter by `direction`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/SiteTransferList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
