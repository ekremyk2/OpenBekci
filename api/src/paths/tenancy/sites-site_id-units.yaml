parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: site_id
    in: path
    required: true
    description: The site id.
    schema:
      type: string
      format: uuid
get:
  operationId: tenancy.listUnits
  summary: List a site's units
  description: 'A block-scoped caller sees only the permitted blocks'' units.'
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [unit.read]
  parameters:
    - $ref: '../../components/common.yaml#/parameters/Limit'
    - $ref: '../../components/common.yaml#/parameters/Cursor'
    - name: block_id
      in: query
      description: 'Only units of this block.'
      schema: {type: string, format: uuid}
    - name: type
      in: query
      description: 'Only units of this type.'
      schema: {type: string}
    - name: q
      in: query
      description: 'Door number fragment.'
      schema: {type: string}
    - name: vacant
      in: query
      description: 'Only vacant or only occupied units (derived).'
      schema: {type: boolean}
    - name: parent_unit_id
      in: query
      description: 'Only appurtenances of this unit.'
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/UnitList'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
post:
  operationId: tenancy.createUnit
  summary: Add a unit
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [unit.manage]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/tenancy.yaml#/schemas/UnitCreate'
  responses:
    '201':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/Unit'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
