parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: tenancy.importPeople
  summary: Import people and occupancies from CSV or XLSX
  description: |-
    **Release 0.1.** Creates persons, owner/tenant occupancies and, with `send_invitations`, invitations by SMS or email (S4). Same dry-run flow as `tenancy.importUnits`.

    Permission: `units.import`.

    Problems: `payload_too_large` (413), `conflict` (409).
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - units.import
    site_manager:
      - units.import
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/DryRun
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            site_id:
              type: string
              format: uuid
            file:
              type: string
              format: binary
            mapping:
              type: object
              additionalProperties: true
            send_invitations:
              type: boolean
          required:
            - site_id
            - file
  responses:
    "200":
      description: The dry-run report; nothing was saved.
      content:
        application/json:
          schema:
            $ref: ../../components/draft-common.yaml#/schemas/ImportReport
    "202":
      description: Committed; follow `job_id`.
      content:
        application/json:
          schema:
            $ref: ../../components/draft-common.yaml#/schemas/ImportReport
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "413":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
