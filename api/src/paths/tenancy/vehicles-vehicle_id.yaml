parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: vehicle_id
    in: path
    required: true
    description: The vehicle id.
    schema:
      type: string
      format: uuid
delete:
  operationId: tenancy.deleteVehicle
  summary: Remove a vehicle
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [vehicle.manage]
  x-idempotent: optional
  responses:
    '204':
      description: Done.
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
