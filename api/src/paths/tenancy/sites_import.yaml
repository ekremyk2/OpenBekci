parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: tenancy.importSite
  summary: Import a site archive into this organization
  description: |-
    **Release 0.1.** Preserves identifiers; residents' logins survive because accounts are instance-wide.

    Permission: `sites.export`.

    Sensitive: answers 403 `reauth_required` unless the session re-authenticated in the last 10 minutes (`POST /v1/auth/reauth`).

    Problems: `reauth_required` (403), `payload_too_large` (413), `conflict` (409).
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - sites.export
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            archive:
              type: string
              format: binary
          required:
            - archive
  responses:
    "202":
      description: Accepted; the work continues as a job.
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/SiteTransfer
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "413":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
