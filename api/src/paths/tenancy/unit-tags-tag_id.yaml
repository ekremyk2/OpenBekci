parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: tag_id
    in: path
    required: true
    description: Id of the tag.
    schema:
      type: string
      format: uuid
get:
  operationId: tenancy.getUnitTag
  summary: Get unit tag
  description: |-
    **Release 0.1.** Get unit tag.

    Permission: `units.read`.
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - units.read
    site_manager:
      - units.read
    board_member:
      - units.read
    auditor:
      - units.read
    accountant:
      - units.read
    staff:
      - units.read
    owner:
      - units.read
    tenant:
      - units.read
    household:
      - units.read
    former_occupant:
      - units.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/UnitTag
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
