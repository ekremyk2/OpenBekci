parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: tenancy.listAllocationKeys
  summary: List allocation keys
  description: |-
    **Release 0.1.** Cursor-paginated list of allocation keys.

    Permission: `units.read`.
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - units.read
    site_manager:
      - units.read
    board_member:
      - units.read
    auditor:
      - units.read
    accountant:
      - units.read
    staff:
      - units.read
    owner:
      - units.read
    tenant:
      - units.read
    household:
      - units.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: kind
      in: query
      schema:
        type: string
        x-known-values:
          - share
          - equal
          - area
          - table
      description: Filter by `kind`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/AllocationKeyList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: tenancy.createAllocationKey
  summary: Create allocation key
  description: |-
    **Release 0.1.** Creates a allocation key.

    Permission: `sites.manage`.

    Problems: `conflict` (409).
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - sites.manage
    site_manager:
      - sites.manage
    board_member:
      - sites.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/tenancy.yaml#/schemas/AllocationKeyCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/AllocationKey
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
