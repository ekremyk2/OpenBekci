parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: site_id
    in: path
    required: true
    description: The site id.
    schema:
      type: string
      format: uuid
get:
  operationId: tenancy.listVehicles
  summary: List a site's vehicles
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [vehicle.read]
  parameters:
    - $ref: '../../components/common.yaml#/parameters/Limit'
    - $ref: '../../components/common.yaml#/parameters/Cursor'
    - name: unit_id
      in: query
      description: 'Only this unit''s vehicles.'
      schema: {type: string, format: uuid}
    - name: q
      in: query
      description: 'Plate fragment.'
      schema: {type: string}
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/VehicleList'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
