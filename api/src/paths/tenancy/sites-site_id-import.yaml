parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: site_id
    in: path
    required: true
    description: The site id.
    schema:
      type: string
      format: uuid
post:
  operationId: tenancy.importUnits
  summary: Import units and people from a spreadsheet
  description: 'CSV or XLSX; idempotent by door number. With `dry_run=true` only the row-level report is produced. A real import with an error row writes nothing and answers `status: failed`. Opening-balance columns are validated and stored for the money module.'
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [import.run]
  x-idempotent: optional
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../components/tenancy.yaml#/schemas/ImportUpload'
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/ImportReport'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
