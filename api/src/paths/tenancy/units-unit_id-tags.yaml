parameters:
  - $ref: '../../components/common.yaml#/parameters/OrgId'
  - name: unit_id
    in: path
    required: true
    description: The unit id.
    schema:
      type: string
      format: uuid
put:
  operationId: tenancy.setUnitTags
  summary: Replace a unit's tags
  description: 'Tags are cost-group memberships such as `lift` or `pool`.'
  tags: [tenancy]
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [unit.manage]
  x-idempotent: optional
  parameters:
    - name: If-Match
      in: header
      required: false
      description: |
        The resource's `version` (as sent in `ETag`), optionally quoted. Required: without it the answer is 422
        `validation_failed`. Declared optional only so an unauthenticated caller gets 401 first.
      schema:
        type: string
        pattern: '^"?[0-9]{1,9}"?$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/tenancy.yaml#/schemas/UnitTags'
  responses:
    '200':
      description: 'Success.'
      content:
        application/json:
          schema:
            $ref: '../../components/tenancy.yaml#/schemas/Unit'
    '401':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '403':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '404':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '409':
      $ref: '../../components/problem.yaml#/responses/Problem'
    '422':
      $ref: '../../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../../components/problem.yaml#/responses/Problem'
