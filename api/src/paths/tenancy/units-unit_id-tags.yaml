parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: unit_id
    in: path
    required: true
    description: Id of the unit.
    schema:
      type: string
      format: uuid
put:
  operationId: tenancy.setUnitTags
  summary: Replace a unit's tags
  description: |-
    **Release 0.1.** Not part of the original draft; phase B keeps it because the tag codes of a unit are stored with the unit (cost-group memberships such as `lift` or `pool`). It is superseded by the `unit-tags` resources once those are served; both write the same membership.

    Permission: `units.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - tenancy
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - units.manage
    site_manager:
      - units.manage
    board_member:
      - units.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/tenancy.yaml#/schemas/UnitTags
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/tenancy.yaml#/schemas/Unit
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
