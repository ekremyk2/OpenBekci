post:
  operationId: auth.requestPasswordReset
  summary: Request a password reset link
  description: |-
    **Release 0.1.** Always 202, whether or not the identifier exists. The link format is `{BASE_URL}/reset/{token}`.

    Problems: `rate_limited` (429), `sms_unavailable` (503), `mail_unavailable` (503), `conflict` (409).
  tags:
    - auth
  security: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/PasswordResetRequest
  responses:
    "202":
      description: Accepted; the work continues as a job.
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
