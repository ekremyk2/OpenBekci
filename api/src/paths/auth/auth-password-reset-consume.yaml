post:
  operationId: auth.resetPassword
  summary: Set a new password with a reset token
  description: |-
    **Release 0.1.** Single use. Revokes all sessions of the account.

    Problems: `invalid_grant` (401), `rate_limited` (429), `conflict` (409).
  tags:
    - auth
  security: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/PasswordResetConsume
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
