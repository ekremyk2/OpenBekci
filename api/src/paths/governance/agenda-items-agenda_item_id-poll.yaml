parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: agenda_item_id
    in: path
    required: true
    description: Id of the agenda item.
    schema:
      type: string
      format: uuid
get:
  operationId: governance.getPoll
  summary: Get the poll of an agenda item
  description: |-
    **Release 0.2.** Get the poll of an agenda item.

    Permission: `meetings.read`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [meetings.read]
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/Poll
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
put:
  operationId: governance.setPoll
  summary: Create or change the poll
  description: |-
    **Release 0.2.** Create or change the poll.

    The first creation of a poll needs no `If-Match`. Every later change requires it: send the `version` you last read (a stale one is 409 `version_conflict`, a missing one 422). A closed poll (its `closes_at` has passed) is final: it cannot be reopened or changed (409 `conflict`).

    Permission: `meetings.manage`.

    Problems: `conflict` (409), `version_conflict` (409).
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [meetings.manage]
  x-idempotent: optional
  x-stability: stable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/governance.yaml#/schemas/PollSet
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/Poll
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatchOptional
