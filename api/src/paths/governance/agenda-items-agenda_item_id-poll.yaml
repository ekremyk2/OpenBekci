parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: agenda_item_id
    in: path
    required: true
    description: Id of the agenda item.
    schema:
      type: string
      format: uuid
get:
  operationId: governance.getPoll
  summary: Get the poll of an agenda item
  description: |-
    **Release 0.2.** Get the poll of an agenda item.

    Permission: `meetings.read`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - meetings.read
    site_manager:
      - meetings.read
    board_member:
      - meetings.read
    auditor:
      - meetings.read
    owner:
      - meetings.read
    tenant:
      - meetings.read
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/Poll
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
put:
  operationId: governance.setPoll
  summary: Create or change the poll
  description: |-
    **Release 0.2.** Create or change the poll.

    `If-Match` is required: send the `version` you last read (a stale one is 409 `version_conflict`, a missing one 422).

    Permission: `meetings.manage`.

    Problems: `conflict` (409), `version_conflict` (409).
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - meetings.manage
    site_manager:
      - meetings.manage
    board_member:
      - meetings.manage
  x-idempotent: optional
  x-stability: preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/governance.yaml#/schemas/PollSet
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/Poll
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
