parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: meeting_id
    in: path
    required: true
    description: Id of the meeting.
    schema:
      type: string
      format: uuid
put:
  operationId: governance.reorderAgendaItems
  summary: Reorder the agenda
  description: |-
    **Release 0.2.** Reorder the agenda.

    Permission: `meetings.manage`.

    Problems: `conflict` (409).
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - meetings.manage
    site_manager:
      - meetings.manage
    board_member:
      - meetings.manage
  x-idempotent: optional
  x-stability: preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/governance.yaml#/schemas/AgendaOrder
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
