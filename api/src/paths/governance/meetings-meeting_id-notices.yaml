parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: meeting_id
    in: path
    required: true
    description: Id of the meeting.
    schema:
      type: string
      format: uuid
get:
  operationId: governance.listMeetingNotices
  summary: Delivery checklist of a meeting
  description: |-
    **Release 0.2.** Delivery checklist of a meeting.

    Permission: `meetings.manage`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [meetings.manage]
  x-stability: stable
  parameters:
    - name: phase
      in: query
      schema:
        type: string
        x-known-values:
          - call
          - decisions
      description: Filter by `phase`.
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - pending
          - recorded
      description: Filter by `status`.
    - name: person_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by person.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/MeetingNoticeList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
