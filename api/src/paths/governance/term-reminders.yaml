parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: governance.listTermReminders
  summary: Terms nearing expiry
  description: |-
    **Release 0.2.** Shown on the site dashboard; also sent as a notification.

    Permission: `meetings.manage`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [meetings.manage]
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - upcoming
          - due
          - overdue
      description: Filter by `status`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/TermReminderList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
