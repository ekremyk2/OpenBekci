parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: agenda_item_id
    in: path
    required: true
    description: Id of the agenda item.
    schema:
      type: string
      format: uuid
get:
  operationId: governance.listPollAnswers
  summary: Poll answers per unit
  description: |-
    **Release 0.2.** Poll answers per unit.

    Permission: `meetings.manage`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [meetings.manage]
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/PollAnswerList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
