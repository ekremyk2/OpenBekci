parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: meeting_id
    in: path
    required: true
    description: Id of the meeting.
    schema:
      type: string
      format: uuid
get:
  operationId: governance.getMyMeeting
  summary: The meeting as the caller sees it
  description: |-
    **Release 0.2.** My call letter notice, my check-in QR, my polls. Tenants see only what concerns residents.

    Permission: `meetings.read`.
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - meetings.read
    site_manager:
      - meetings.read
    board_member:
      - meetings.read
    auditor:
      - meetings.read
    owner:
      - meetings.read
    tenant:
      - meetings.read
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/MyMeeting
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
