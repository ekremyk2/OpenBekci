parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: meeting_id
    in: path
    required: true
    description: Id of the meeting.
    schema:
      type: string
      format: uuid
post:
  operationId: governance.checkInAttendance
  summary: Check an owner in by QR
  description: |-
    **Release 0.2.** Marks the same record as the tick-off screen.

    Permission: `attendance.manage`.

    Problems: `conflict` (409), `not_found` (404).
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [attendance.manage]
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/governance.yaml#/schemas/AttendanceCheckin
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/governance.yaml#/schemas/Attendance
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
