parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: meeting_id
    in: path
    required: true
    description: Id of the meeting.
    schema:
      type: string
      format: uuid
  - name: attendance_id
    in: path
    required: true
    description: Id of the attendance.
    schema:
      type: string
      format: uuid
delete:
  operationId: governance.removeAttendance
  summary: Remove an attendance record
  description: |-
    **Release 0.2.** Remove an attendance record.

    Permission: `attendance.manage`.

    Problems: `conflict` (409).
  tags:
    - governance
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [attendance.manage]
  x-idempotent: optional
  x-stability: preview
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
