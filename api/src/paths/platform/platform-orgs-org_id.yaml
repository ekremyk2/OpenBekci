parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: platform.getOrg
  summary: Get an organization
  description: |-
    **Release 0.1.** Get an organization.

    Permission: `platform.read`.
  tags:
    - platform
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    platform_admin:
      - platform.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/platform.yaml#/schemas/PlatformOrg
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: platform.updateOrg
  summary: Rename, suspend or reactivate an organization
  description: |-
    **Release 0.1.** Rename, suspend or reactivate an organization.

    Permission: `platform.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - platform
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    platform_admin:
      - platform.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/platform.yaml#/schemas/PlatformOrgUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/platform.yaml#/schemas/PlatformOrg
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
