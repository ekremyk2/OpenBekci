parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: facility_id
    in: path
    required: true
    description: Id of the facility.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getFacility
  summary: Get facility
  description: |-
    **Release 0.3.** Get facility.

    Permission (any one of): `bookings.read`, `facilities.manage`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - bookings.read
      - facilities.manage
    site_manager:
      - bookings.read
      - facilities.manage
    board_member:
      - bookings.read
      - facilities.manage
    owner:
      - bookings.read
    tenant:
      - bookings.read
    household:
      - bookings.read
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/Facility
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: community.updateFacility
  summary: Update facility
  description: |-
    **Release 0.3.** Update facility.

    Permission: `facilities.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - facilities.manage
    site_manager:
      - facilities.manage
    board_member:
      - facilities.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/FacilityUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/Facility
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
delete:
  operationId: community.deleteFacility
  summary: Delete facility
  description: |-
    **Release 0.3.** Only without future bookings (409 `conflict`).

    Permission: `facilities.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - facilities.manage
    site_manager:
      - facilities.manage
    board_member:
      - facilities.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
