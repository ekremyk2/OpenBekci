parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: community.createGuardSession
  summary: Switch guard with a quick PIN
  description: |-
    **Release 0.3.** The console is a shared booth device: the guard picks their name (`gate.listGuards`) and enters their PIN so every action is attributed to a person. A wrong PIN, an unknown person, a person without a PIN and a person who is not a guard of the site all answer the same `invalid_grant` (401).

    **Rate limit.** PIN attempts are limited per person and per console: 5 failed attempts in 15 minutes lock that guard for 15 minutes (429 `rate_limited` with `Retry-After`, also for a correct PIN during the lock), and a console that fails 20 times in an hour is locked for an hour. Every failed attempt is audited.

    Permission: `gate.operate`.

    Problems: `rate_limited` (429), `invalid_grant` (401), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/GuardSessionCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GuardSession
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
