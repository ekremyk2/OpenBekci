parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: facility_id
    in: path
    required: true
    description: Id of the facility.
    schema:
      type: string
      format: uuid
post:
  operationId: community.previewBooking
  summary: Preview a booking
  description: |-
    **Release 0.3.** What `community.createBooking` would do for the same body, without writing anything: the fee and the side it would be charged to, the refund rule that would apply, the unit's quota left in the period of the start, and the rule violations that would make create fail (the same field-error codes create answers 422 with). A blocked date or a taken slot is reported in `conflict` (create answers 409). The body is the one create takes; its `facility_id` must equal the path's, else 422 `facility_id` `invalid_value`.

    Refusals that depend on who asks (not allowed to book, closed facility, someone else's unit) are answered as create would, with 403, 404, 409 or 422.

    Permission: `bookings.create`.

    Problems: `validation_failed` (422), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - bookings.create
    site_manager:
      - bookings.create
    board_member:
      - bookings.create
    owner:
      - bookings.create
    tenant:
      - bookings.create
    household:
      - bookings.create
  x-idempotent: none
  x-stability: preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/BookingCreate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/BookingPreview
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
