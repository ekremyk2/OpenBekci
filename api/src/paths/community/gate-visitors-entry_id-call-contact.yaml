parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getGateVisitorCallContact
  summary: The number to call when the resident does not answer
  description: |-
    **Release 0.3.** Only the gate contact number the resident chose to share, and only for a pending request.

    Permission: `gate.operate`.

    Problems: `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/CallContact
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
