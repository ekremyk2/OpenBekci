parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getGateVisitor
  summary: Poll one visitor (approval status)
  description: |-
    **Release 0.3.** Poll one visitor (approval status).

    Guard minimization (S3): the response carries no phone numbers, e-mail addresses, national ids, balances or QR tokens.

    Permission: `gate.operate`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GuardVisitor
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
