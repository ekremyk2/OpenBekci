parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: community.listGateDeliveries
  summary: Waiting parcels
  description: |-
    **Release 0.3.** Waiting parcels.

    Guard minimization (S3): the response carries no phone numbers, e-mail addresses, national ids, balances or QR tokens.

    Permission: `gate.operate`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: unit_door_number
      in: query
      schema:
        type: string
      description: Filter by `unit_door_number`.
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - waiting
          - collected
      description: Filter by `status`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GateDeliveryList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: community.createGateDelivery
  summary: Log a parcel against a unit
  description: |-
    **Release 0.3.** Notifies the resident (in-app plus their preferred channel).

    Guard minimization (S3): the response carries no phone numbers, e-mail addresses, national ids, balances or QR tokens.

    Permission: `gate.operate`.

    Problems: `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/DeliveryCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GateDelivery
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
