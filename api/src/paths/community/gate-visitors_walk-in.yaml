parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: community.createWalkInVisitor
  summary: Register a walk-in and ask the resident
  description: |-
    **Release 0.3.** Creates an entry with `approval_status = requested` and sends the resident an approve / deny request (in-app and SMS).

    Permission: `gate.operate`.

    Problems: `sms_unavailable` (503), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/WalkInCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GuardVisitor
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
