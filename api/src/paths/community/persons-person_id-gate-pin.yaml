parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: person_id
    in: path
    required: true
    description: Id of the person.
    schema:
      type: string
      format: uuid
put:
  operationId: community.setGuardPin
  summary: Set or reset a guard PIN
  description: |-
    **Release 0.3.** For a person with a guard membership; stored hashed.

    Permission: `gate.manage`.

    Problems: `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.manage
    site_manager:
      - gate.manage
  x-idempotent: optional
  x-stability: preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/GatePinSet
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
