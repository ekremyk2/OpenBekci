parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: community.listVisitorApprovalRequests
  summary: My visitor approval requests
  description: |-
    **Release 0.3.** Polled while pending.

    Permission: `visitors.decide`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    owner:
      - visitors.decide
    tenant:
      - visitors.decide
    household:
      - visitors.decide
  x-stability: preview
  parameters:
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - pending
          - approved
          - denied
          - expired
      description: Filter by `status`.
    - name: unit_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/VisitorApprovalRequestList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
