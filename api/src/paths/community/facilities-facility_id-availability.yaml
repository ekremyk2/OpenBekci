parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: facility_id
    in: path
    required: true
    description: Id of the facility.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getFacilityAvailability
  summary: Taken and blocked slots
  description: |-
    **Release 0.3.** Taken and blocked slots.

    Permission: `bookings.create`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - bookings.create
    site_manager:
      - bookings.create
    board_member:
      - bookings.create
    owner:
      - bookings.create
    tenant:
      - bookings.create
    household:
      - bookings.create
  x-stability: stable
  parameters:
    - name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Start of the range (inclusive).
      required: true
    - name: to
      in: query
      schema:
        type: string
        format: date-time
      description: End of the range (inclusive).
      required: true
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/Availability
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
