parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: community.scanGateVisitor
  summary: Scan a visitor QR
  description: |-
    **Release 0.3.** Online validation against the visitor entry; does not need the access agent. If valid, admit with `community.arriveGateVisitor`.

    Guard minimization (S3): the response carries no phone numbers, e-mail addresses, national ids, balances or QR tokens.

    Permission: `gate.operate`.

    Problems: `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/ScanRequest
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/ScanResult
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
