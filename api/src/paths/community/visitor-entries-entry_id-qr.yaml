parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getVisitorEntryQr
  summary: The visitor QR as an image
  description: |-
    **Release 0.3.** The visitor QR as an image.

    Permission: `visitors.manage`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - visitors.manage
    site_manager:
      - visitors.manage
    board_member:
      - visitors.manage
    owner:
      - visitors.manage
    tenant:
      - visitors.manage
    household:
      - visitors.manage
  x-stability: preview
  responses:
    "200":
      description: The file.
      content:
        image/svg+xml:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
