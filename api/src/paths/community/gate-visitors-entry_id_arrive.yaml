parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
post:
  operationId: community.arriveGateVisitor
  summary: Mark a visitor arrived
  description: |-
    **Release 0.3.** Only for a valid pre-approved or approved entry.

    Guard minimization (S3): the response carries no phone numbers, e-mail addresses, national ids, balances or QR tokens.

    Permission: `gate.operate`.

    Problems: `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/VisitorArrive
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GuardVisitor
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
