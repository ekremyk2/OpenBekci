parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: entry_id
    in: path
    required: true
    description: Id of the entry.
    schema:
      type: string
      format: uuid
get:
  operationId: community.getVisitorEntry
  summary: Get visitor entry
  description: |-
    **Release 0.3.** Get visitor entry.

    Permission (any one of): `visitors.read`, `visitors.manage`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - visitors.read
      - visitors.manage
    site_manager:
      - visitors.read
      - visitors.manage
    board_member:
      - visitors.read
      - visitors.manage
    auditor:
      - visitors.read
    owner:
      - visitors.manage
    tenant:
      - visitors.manage
    household:
      - visitors.manage
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/VisitorEntry
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: community.updateVisitorEntry
  summary: Update visitor entry
  description: |-
    **Release 0.3.** Update visitor entry.

    Permission: `visitors.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - visitors.manage
    site_manager:
      - visitors.manage
    board_member:
      - visitors.manage
    owner:
      - visitors.manage
    tenant:
      - visitors.manage
    household:
      - visitors.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/community.yaml#/schemas/VisitorEntryUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/VisitorEntry
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
