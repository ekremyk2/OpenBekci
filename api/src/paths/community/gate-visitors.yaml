parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: community.listGateVisitors
  summary: Search visitors by name or plate
  description: |-
    **Release 0.3.** Search visitors by name or plate.

    Permission: `gate.operate`.
  tags:
    - community
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - gate.operate
    site_manager:
      - gate.operate
    guard:
      - gate.operate
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    - name: date
      in: query
      schema:
        type: string
      description: Filter by `date`.
    - name: plate
      in: query
      schema:
        type: string
      description: Filter by `plate`.
    - name: unit_door_number
      in: query
      schema:
        type: string
      description: Filter by `unit_door_number`.
    - name: approval_status
      in: query
      schema:
        type: string
      description: Filter by `approval_status`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
    - $ref: ../../components/draft-common.yaml#/parameters/GuardSession
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/community.yaml#/schemas/GuardVisitorList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
