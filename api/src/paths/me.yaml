get:
  operationId: me.get
  summary: The signed-in user, organizations, roles and permissions
  tags: [me]
  security:
    - cookieAuth: []
    - bearerAuth: []
  responses:
    '200':
      description: The caller's identity.
      content:
        application/json:
          schema:
            $ref: '../components/auth.yaml#/schemas/Me'
    '401':
      $ref: '../components/problem.yaml#/responses/Problem'
    default:
      $ref: '../components/problem.yaml#/responses/Problem'
