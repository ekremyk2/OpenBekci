parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: credential_id
    in: path
    required: true
    description: Id of the credential.
    schema:
      type: string
      format: uuid
get:
  operationId: access.getCredential
  summary: Get a credential
  description: |-
    **Release 0.3.** Get a credential.

    Permission: `access.read`.
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - access.read
    site_manager:
      - access.read
    board_member:
      - access.read
    auditor:
      - access.read
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/Credential
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
