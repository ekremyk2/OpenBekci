parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
get:
  operationId: access.listCredentials
  summary: List credentials (derived, read-only)
  description: |-
    **Release 0.3.** List credentials (derived, read-only).

    Permission: `access.read`.
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    - access.read
  x-stability: preview
  parameters:
    - $ref: ../../components/access.yaml#/parameters/SiteIdRequired
    - name: kind
      in: query
      schema:
        type: string
        x-known-values:
          - plate
          - visitor_qr
          - tag
          - pin
      description: Filter by `kind`.
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - active
          - suspended
          - revoked
          - expired
      description: Filter by `status`.
    - name: source_type
      in: query
      schema:
        type: string
        x-known-values:
          - vehicle
          - visitor_entry
          - manual
      description: Filter by `source_type`.
    - name: unit_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit.
    - name: point_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `point_id`.
    - name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/CredentialList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
