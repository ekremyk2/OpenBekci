parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: access.listCredentials
  summary: List credentials (derived, read-only)
  description: |-
    **Release 0.3.** List credentials (derived, read-only).

    Permission: `access.read`.
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - access.read
    site_manager:
      - access.read
    board_member:
      - access.read
    auditor:
      - access.read
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: kind
      in: query
      schema:
        type: string
        x-known-values:
          - plate
          - visitor_qr
          - tag
          - pin
      description: Filter by `kind`.
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - active
          - suspended
          - revoked
          - expired
      description: Filter by `status`.
    - name: source_type
      in: query
      schema:
        type: string
        x-known-values:
          - vehicle
          - visitor_entry
          - manual
      description: Filter by `source_type`.
    - name: unit_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit.
    - name: point_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `point_id`.
    - name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/CredentialList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: access.createCredential
  summary: Create a tag or PIN credential
  description: |-
    **Release 0.3.** Adds a manual `tag` or `pin` credential and pushes it to the agent with the next snapshot delta. The secret `value` is write-only. Plates and visitor QR codes come from vehicles and visitor entries, not from here.

    Permission: `access.manage`.

    Problems: `conflict` (409, the same value already exists on the site), `idempotency_mismatch` (422).
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - access.manage
    site_manager:
      - access.manage
  x-idempotent: required
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/access.yaml#/schemas/CredentialCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/Credential
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
