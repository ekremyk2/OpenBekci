parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: agent_id
    in: path
    required: true
    description: Id of the agent.
    schema:
      type: string
      format: uuid
post:
  operationId: access.revokeAgent
  summary: Revoke an agent
  description: |-
    **Release 0.3.** A connected agent receives `command revoked` and the socket closes with 4401; any later call is 401.

    Permission: `access.manage`.

    Problems: `conflict` (409).
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    - access.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/Agent
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
