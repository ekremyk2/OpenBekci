parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: access.listAccessPoints
  summary: List access points
  description: |-
    **Release 0.3.** Cursor-paginated list of access points.

    Permission: `access.read`.
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - access.read
    site_manager:
      - access.read
    board_member:
      - access.read
    auditor:
      - access.read
  x-stability: preview
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: agent_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `agent_id`.
    - name: enabled
      in: query
      schema:
        type: boolean
      description: Filter by `enabled`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/AccessPointList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: access.createAccessPoint
  summary: Create access point
  description: |-
    **Release 0.3.** Creates a access point.

    Permission: `access.manage`.

    Problems: `conflict` (409).
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - access.manage
    site_manager:
      - access.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/access.yaml#/schemas/AccessPointCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/AccessPoint
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
