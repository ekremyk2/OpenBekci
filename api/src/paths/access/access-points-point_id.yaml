parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: point_id
    in: path
    required: true
    description: Id of the point.
    schema:
      type: string
      format: uuid
get:
  operationId: access.getAccessPoint
  summary: Get access point
  description: |-
    **Release 0.3.** Get access point.

    Permission: `access.read`.
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    - access.read
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/AccessPoint
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: access.updateAccessPoint
  summary: Update access point
  description: |-
    **Release 0.3.** Update access point.

    Permission: `access.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    - access.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/access.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/access.yaml#/schemas/AccessPointUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/access.yaml#/schemas/AccessPoint
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
delete:
  operationId: access.deleteAccessPoint
  summary: Delete access point
  description: |-
    **Release 0.3.** Re-projects the allow-list.

    Permission: `access.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - access
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    - access.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/access.yaml#/parameters/IfMatch
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
