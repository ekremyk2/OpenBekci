parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: key_id
    in: path
    required: true
    description: Id of the API key.
    schema:
      type: string
      format: uuid
post:
  operationId: integrations.rotateApiKey
  summary: Rotate an API key
  description: |-
    **Release 0.4.** Replaces the key's prefix and secret and returns the new secret exactly
    once. The old token stops working at once (401 `unauthenticated`). The key keeps its id,
    scopes, site and expiry. A revoked key cannot be rotated.

    Sensitive (backend section 16): answers 403 `reauth_required` unless the session re-authenticated in the last 10 minutes (`POST /v1/auth/reauth`).

    Permission: `apikeys.manage`.

    Problems: `reauth_required` (403), `conflict` (409, the key is revoked).
  tags:
    - integrations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - apikeys.manage
  x-idempotent: none
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/integrations.yaml#/schemas/ApiKeyCreated
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
