parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: endpoint_id
    in: path
    required: true
    description: Id of the webhook endpoint.
    schema:
      type: string
      format: uuid
post:
  operationId: integrations.rotateWebhookEndpointSecret
  summary: Rotate a webhook endpoint's signing secret
  description: |-
    **Release 0.4.** Replaces the endpoint's signing secret and returns the new one exactly once.
    The replaced secret keeps signing for 24 hours (`previous_secret_expires_at`): every delivery
    in that time carries both signatures (`OpenBekci-Signature: t=...,v1=<new>,v1=<old>`), so a
    receiver that accepts any matching `v1` can switch without a gap. Rotating again inside the
    window replaces the overlap with the secret that was current a moment ago; the oldest secret
    stops signing at once.

    Permission: `webhooks.manage` (a person; an API key cannot manage webhook endpoints).
  tags:
    - integrations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - webhooks.manage
  x-idempotent: none
  x-stability: stable
  responses:
    "200":
      description: The new secret, shown once.
      content:
        application/json:
          schema:
            $ref: ../../components/integrations.yaml#/schemas/WebhookEndpointCreated
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
