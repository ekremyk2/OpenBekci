post:
  operationId: me.startContactChange
  summary: Start changing my email or phone
  description: |-
    **Release 0.1.** Sends a code to the new address or number.

    Sensitive: answers 403 `reauth_required` unless the session re-authenticated in the last 10 minutes (`POST /v1/auth/reauth`).

    Problems: `reauth_required` (403), `conflict` (409), `rate_limited` (429), `sms_unavailable` (503), `mail_unavailable` (503).
  tags:
    - me
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/ContactChangeCreate
  responses:
    "202":
      description: Accepted; the work continues as a job.
      content:
        application/json:
          schema:
            $ref: ../../components/people.yaml#/schemas/ContactChange
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
