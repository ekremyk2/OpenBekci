patch:
  operationId: me.updateProfile
  summary: Update my profile
  description: |-
    **Release 0.1.** Display name and locale. Contact changes go through `me.startContactChange`.

    Problems: `conflict` (409).
  tags:
    - me
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/ProfileUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/auth.yaml#/schemas/MeUser
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
