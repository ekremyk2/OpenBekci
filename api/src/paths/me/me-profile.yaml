patch:
  operationId: me.updateProfile
  x-openbekci-roles: [sessions.manage_own]
  summary: Update my profile
  description: |-
    **Release 0.1.** Display name and locale of the signed-in account (`PATCH /v1/me/profile`). Contact changes are not part of /v1 yet (see `docs/api/deferred.md`).
    Send the `version` of `GET /v1/me` (`user.version`) in `If-Match`; a stale one is 409
    `version_conflict`. Returns the updated `user`, with its new `version`. The display name is the account's own: it wins over the
    name of the linked person in `GET /v1/me`; an empty string clears it. The locale is one the server has texts for: `tr` or `en`.

    Problems: `version_conflict` (409), `validation_failed` (422).
  tags:
    - me
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/ProfileUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/auth.yaml#/schemas/MeUser
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
