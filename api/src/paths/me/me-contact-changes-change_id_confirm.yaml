parameters:
  - name: change_id
    in: path
    required: true
    description: Id of the change.
    schema:
      type: string
      format: uuid
post:
  operationId: me.confirmContactChange
  summary: Confirm the new email or phone
  description: |-
    **Release 0.1.** Confirm the new email or phone.

    Problems: `invalid_grant` (401), `rate_limited` (429), `conflict` (409).
  tags:
    - me
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/people.yaml#/schemas/ContactChangeConfirm
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/auth.yaml#/schemas/MeUser
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "429":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
