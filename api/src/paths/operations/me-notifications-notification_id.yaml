parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: notification_id
    in: path
    required: true
    description: Id of the notification.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.getNotification
  summary: Read one notification
  description: |-
    **Release 0.1.** One of the caller's notifications, a single-row read cheap enough for a push handler (`notification_id` of the push payload). Another person's notification is 404.

    Permission: `notifications.read`.

    Problems: `not_found` (404).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    member:
      - notifications.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Notification
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
