parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: ticket_id
    in: path
    required: true
    description: Id of the ticket.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.listTicketComments
  summary: List ticket comments
  description: |-
    **Release 0.1.** Residents never receive internal comments.

    Permission (any one of): `tickets.read`, `tickets.open`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - tickets.read
      - tickets.open
    site_manager:
      - tickets.read
      - tickets.open
    board_member:
      - tickets.read
      - tickets.open
    auditor:
      - tickets.read
    staff:
      - tickets.read
      - tickets.open
    owner:
      - tickets.open
    tenant:
      - tickets.open
    household:
      - tickets.open
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCommentList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: operations.createTicketComment
  summary: Comment on a ticket
  description: |-
    **Release 0.1.** `visibility: internal` needs `tickets.manage` or `tickets.work`.

    Permission (any one of): `tickets.read`, `tickets.open`, `tickets.work`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - tickets.read
      - tickets.open
    site_manager:
      - tickets.read
      - tickets.open
    board_member:
      - tickets.read
      - tickets.open
    auditor:
      - tickets.read
    staff:
      - tickets.read
      - tickets.open
      - tickets.work
    owner:
      - tickets.open
    tenant:
      - tickets.open
    household:
      - tickets.open
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/TicketCommentCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketComment
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
