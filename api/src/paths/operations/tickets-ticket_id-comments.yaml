parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: ticket_id
    in: path
    required: true
    description: Id of the ticket.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.listTicketComments
  summary: List ticket comments
  description: |-
    Residents never receive internal comments.

    Internal notes are returned only to holders of `tickets.manage` or `tickets.work`; staff without `tickets.work` on that ticket see public comments only.

    Permission (any one of): `tickets.read`, `tickets.open`, `tickets.read_assigned`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [tickets.read|tickets.open|tickets.read_assigned]
  parameters:
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCommentList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: operations.createTicketComment
  summary: Comment on a ticket
  description: |-
    `visibility: internal` needs `tickets.manage` or `tickets.work`.

    Permission (any one of): `tickets.read`, `tickets.open`, `tickets.read_assigned`, `tickets.work`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [tickets.read|tickets.open|tickets.read_assigned|tickets.work]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/TicketCommentCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketComment
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
