parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: category_id
    in: path
    required: true
    description: Id of the category.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.getTicketCategory
  summary: Get ticket category
  description: |-
    Get ticket category.

    Permission (any one of): `tickets.read`, `tickets.open`, `tickets.read_assigned`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [tickets.read|tickets.open|tickets.read_assigned]
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCategory
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: operations.updateTicketCategory
  summary: Update ticket category
  description: |-
    Update ticket category.

    Permission: `tickets.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [tickets.manage]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/TicketCategoryUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCategory
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
