parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: site_id
    in: path
    required: true
    description: Id of the site.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.getSiteChatGroup
  summary: The site's Telegram group and WhatsApp invite link
  description: |-
    **Release 1.0.** Whether the site's Telegram group is `linked`, `pending` (a link code was issued and not yet sent in the
    group) or `none`, its title and kind, and the WhatsApp group invite link the site maintains.

    Permission: `chatgroups.manage`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - chatgroups.manage
    site_manager:
      - chatgroups.manage
  x-stability: preview
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/SiteChatGroup
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: operations.updateSiteChatGroup
  summary: Set the WhatsApp group invite link
  description: |-
    **Release 1.0.** Sets (`https://chat.whatsapp.com/<code>`) or clears (`null`) the WhatsApp group invite link residents see
    on Home as "Join the site's WhatsApp group".

    Permission: `chatgroups.manage`.

    Problems: `validation_failed` (422).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - chatgroups.manage
    site_manager:
      - chatgroups.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/SiteChatGroupUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/SiteChatGroup
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
delete:
  operationId: operations.unlinkSiteChatGroup
  summary: Unlink the site's Telegram group
  description: |-
    **Release 1.0.** Removes the link and has the bot leave the group. Nothing is posted there any more.

    Permission: `chatgroups.manage`.

    Problems: `not_found` (404, the site has no Telegram group).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - chatgroups.manage
    site_manager:
      - chatgroups.manage
  x-idempotent: optional
  x-stability: preview
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
