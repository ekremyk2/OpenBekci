parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: announcement_id
    in: path
    required: true
    description: Id of the announcement.
    schema:
      type: string
      format: uuid
post:
  operationId: operations.archiveAnnouncement
  summary: Archive an announcement
  description: |-
    Archive an announcement.

    Permission: `announcements.publish`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [announcements.publish]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Announcement
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
