parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: operations.listTicketCategories
  summary: List ticket categories
  description: |-
    **Release 0.1.** Cursor-paginated list of ticket categorys.

    Permission (any one of): `tickets.read`, `tickets.open`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - tickets.read
      - tickets.open
    site_manager:
      - tickets.read
      - tickets.open
    board_member:
      - tickets.read
      - tickets.open
    auditor:
      - tickets.read
    staff:
      - tickets.read
      - tickets.open
    owner:
      - tickets.open
    tenant:
      - tickets.open
    household:
      - tickets.open
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: archived
      in: query
      schema:
        type: boolean
      description: Filter by `archived`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCategoryList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: operations.createTicketCategory
  summary: Create ticket category
  description: |-
    **Release 0.1.** Creates a ticket category.

    Permission: `tickets.manage`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - tickets.manage
    site_manager:
      - tickets.manage
    board_member:
      - tickets.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/TicketCategoryCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketCategory
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
