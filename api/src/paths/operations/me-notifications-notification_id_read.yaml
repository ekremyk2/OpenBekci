parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: notification_id
    in: path
    required: true
    description: Id of the notification.
    schema:
      type: string
      format: uuid
post:
  operationId: operations.markNotificationRead
  summary: Mark a notification read
  description: |-
    Mark a notification read.

    Permission: `notifications.read`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [notifications.read]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Notification
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
