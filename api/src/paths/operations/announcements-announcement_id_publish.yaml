parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: announcement_id
    in: path
    required: true
    description: Id of the announcement.
    schema:
      type: string
      format: uuid
post:
  operationId: operations.publishAnnouncement
  summary: Publish an announcement now
  description: |-
    Sends by the chosen channels and fixes `recipient_count` and `sms_count`.

    Permission: `announcements.publish`.

    Problems: `sms_unavailable` (503), `mail_unavailable` (503), `conflict` (409), `idempotency_mismatch` (422).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [announcements.publish]
  x-idempotent: required
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKeyRequired
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/AnnouncementPublish
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Announcement
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    "503":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
