parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: folder_id
    in: path
    required: true
    description: Id of the folder.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.getFolder
  summary: Get folder
  description: |-
    **Release 0.1.** Get folder.

    Permission: `documents.read`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - documents.read
    site_manager:
      - documents.read
    board_member:
      - documents.read
    auditor:
      - documents.read
    owner:
      - documents.read
    tenant:
      - documents.read
    household:
      - documents.read
    former_occupant:
      - documents.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Folder
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
patch:
  operationId: operations.updateFolder
  summary: Update folder
  description: |-
    **Release 0.1.** Update folder.

    Permission: `documents.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - documents.manage
    site_manager:
      - documents.manage
    board_member:
      - documents.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/FolderUpdate
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Folder
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
delete:
  operationId: operations.deleteFolder
  summary: Delete folder
  description: |-
    **Release 0.1.** Only an empty, non-system folder.

    Permission: `documents.manage`.

    Problems: `version_conflict` (409), `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - documents.manage
    site_manager:
      - documents.manage
    board_member:
      - documents.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/IfMatch
  responses:
    "204":
      description: No content
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
