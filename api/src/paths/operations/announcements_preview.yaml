parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: operations.previewAnnouncement
  summary: Preview recipient and SMS counts
  description: |-
    **Release 0.1.** Preview recipient and SMS counts.

    Permission: `announcements.publish`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - announcements.publish
    site_manager:
      - announcements.publish
    board_member:
      - announcements.publish
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/AnnouncementPreviewRequest
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/AnnouncementPreview
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
