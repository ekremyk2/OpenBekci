parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: announcement_id
    in: path
    required: true
    description: Id of the announcement.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.listAnnouncementReads
  summary: Who has read an announcement
  description: |-
    **Release 0.1.** Who has read an announcement.

    Permission: `announcements.publish`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - announcements.publish
    site_manager:
      - announcements.publish
    board_member:
      - announcements.publish
  x-stability: stable
  parameters:
    - name: read
      in: query
      schema:
        type: boolean
      description: Filter by `read`.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/AnnouncementReadList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
