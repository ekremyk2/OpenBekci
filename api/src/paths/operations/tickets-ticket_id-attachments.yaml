parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
  - name: ticket_id
    in: path
    required: true
    description: Id of the ticket.
    schema:
      type: string
      format: uuid
post:
  operationId: operations.createTicketAttachment
  summary: Attach an uploaded file to a ticket
  description: |-
    At most 10 per ticket or comment.

    Permission: `tickets.open`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [tickets.open]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/TicketAttachmentCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/TicketAttachment
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
