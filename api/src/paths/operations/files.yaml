parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
post:
  operationId: operations.uploadFile
  summary: Upload a file
  description: |-
    **Release 0.1.** Streams through the server: type sniffed, EXIF location stripped, `thumb` and `medium` generated for images.

    Permission: `files.upload`.

    Problems: `payload_too_large` (413), `validation_failed` (422), `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    member:
      - files.upload
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
            site_id:
              type: string
              format: uuid
            scope:
              type: string
          required:
            - file
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/File
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "413":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
