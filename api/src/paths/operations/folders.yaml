parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
get:
  operationId: operations.listFolders
  summary: List folders
  description: |-
    **Release 0.1.** Cursor-paginated list of folders.

    Permission: `documents.read`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - documents.read
    site_manager:
      - documents.read
    board_member:
      - documents.read
    auditor:
      - documents.read
    owner:
      - documents.read
    tenant:
      - documents.read
    household:
      - documents.read
  x-stability: stable
  parameters:
    - $ref: ../../components/draft-common.yaml#/parameters/SiteIdRequired
    - name: parent_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by `parent_id`.
    - name: kind
      in: query
      schema:
        type: string
        x-known-values:
          - site
          - unit
      description: Filter by `kind`.
    - name: unit_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit.
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/FolderList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: operations.createFolder
  summary: Create folder
  description: |-
    **Release 0.1.** Creates a folder.

    Permission: `documents.manage`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    org_admin:
      - documents.manage
    site_manager:
      - documents.manage
    board_member:
      - documents.manage
  x-idempotent: optional
  x-stability: stable
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/FolderCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Folder
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
