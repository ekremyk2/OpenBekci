parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
get:
  operationId: operations.listAnnouncements
  summary: List announcements
  description: |-
    List announcements.

    Permission (any one of): `announcements.read`, `announcements.publish` (residents: published announcements addressed to them).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [announcements.read|announcements.publish]
  parameters:
    - $ref: ../../components/common.yaml#/parameters/SiteIdRequired
    - name: status
      in: query
      schema:
        type: string
        x-known-values:
          - draft
          - scheduled
          - published
          - archived
      description: Filter by `status`.
    - name: pinned
      in: query
      schema:
        type: boolean
      description: Filter by `pinned`.
    - name: unread
      in: query
      schema:
        type: boolean
      description: Filter by `unread`.
    - name: from
      in: query
      schema:
        type: string
        format: date
      description: Start of the range (inclusive).
    - name: to
      in: query
      schema:
        type: string
        format: date
      description: End of the range (inclusive).
    - $ref: ../../components/common.yaml#/parameters/Limit
    - $ref: ../../components/common.yaml#/parameters/Cursor
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/AnnouncementList
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
post:
  operationId: operations.createAnnouncement
  summary: Create an announcement
  description: |-
    Created as a draft; `publish_at` schedules it.

    Permission: `announcements.publish`.

    Problems: `conflict` (409).
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [announcements.publish]
  x-idempotent: optional
  parameters:
    - $ref: ../../components/common.yaml#/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/operations.yaml#/schemas/AnnouncementCreate
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/Announcement
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "409":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
