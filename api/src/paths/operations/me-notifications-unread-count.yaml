parameters:
  - $ref: ../../components/common.yaml#/parameters/OrgId
get:
  operationId: operations.getUnreadCount
  summary: Unread notification count
  description: |-
    Cheap enough to poll. `visitor_approvals_pending` is polled together with the badge and stays 0 until release 0.3 (gate control).

    Permission: `notifications.read`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles: [notifications.read]
  parameters:
    - $ref: ../../components/common.yaml#/parameters/SiteId
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/UnreadCount
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "422":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
