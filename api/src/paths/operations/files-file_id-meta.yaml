parameters:
  - $ref: ../../components/draft-common.yaml#/parameters/OrgId
  - name: file_id
    in: path
    required: true
    description: Id of the file.
    schema:
      type: string
      format: uuid
get:
  operationId: operations.getFileMeta
  summary: Get file metadata
  description: |-
    **Release 0.1.** Get file metadata.

    Permission: `files.read`.
  tags:
    - operations
  security:
    - cookieAuth: []
    - bearerAuth: []
  x-openbekci-roles:
    member:
      - files.read
  x-stability: stable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/operations.yaml#/schemas/File
    "401":
      $ref: ../../components/problem.yaml#/responses/Problem
    "403":
      $ref: ../../components/problem.yaml#/responses/Problem
    "404":
      $ref: ../../components/problem.yaml#/responses/Problem
    default:
      $ref: ../../components/problem.yaml#/responses/Problem
