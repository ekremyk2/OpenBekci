name: docs

on:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && vars.DOCS_PUBLISH == 'true'
        with:
          path: docs-site/site

  # Publishing stays off until the repository variable DOCS_PUBLISH is set to
  # "true" (Settings > Secrets and variables > Actions > Variables) and Pages
  # is enabled with source "GitHub Actions". Off while the repository is private.
  deploy:
    needs: build
    if: github.event_name == 'push' && vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
