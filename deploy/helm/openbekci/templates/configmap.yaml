apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openbekci.name" . }}
  labels: {{- include "openbekci.labels" . | nindent 4 }}
data:
  OPENBEKCI_BASE_URL: {{ required "config.BASE_URL is required (the public URL)" .Values.config.BASE_URL | quote }}
  {{- range $k, $v := .Values.config }}
  {{- if ne $k "BASE_URL" }}
  OPENBEKCI_{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
